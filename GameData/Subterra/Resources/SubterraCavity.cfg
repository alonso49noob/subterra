// SubterraCavity: the layer of the subsurface radar for SCANsat's maps. It is not a real resource: it has no mass, no
// price, cannot be carried or transferred, and no part holds it. Its abundance at a point is the confidence of this
// save's radar detections there (0 where Subterra never found anything), returned by Subterra's patch of
// ResourceMap.GetAbundance (src/Subterra/Radar/CavityAbundance.cs), whatever the distribution below says.
//
// The distribution is not empty on purpose (ruling R9, SCANsat spike): SCANsat marks a resource whose PresenceChance
// is 0 as absent and hides it from its resource list by default. A positive PresenceChance keeps it listed; the
// minimum is tiny so that nothing in the distribution looks like a deposit, the maximum sets the top of SCANsat's
// colour scale (it reads these values as percentages). Subterra answers 0 to the stock summary requests that build
// the KerbNet resource chart, so the resource never shows up there.
//
// Limitation: that only holds while Subterra's 'resources' patch is active. If the patch is disabled in Settings.cfg,
// fails to apply, or switches itself off after repeated errors, the game answers with this distribution (stock values
// of 0.1 to 0.8 everywhere), so SCANsat and the KerbNet chart show a fake layer until the patch is active again;
// Subterra logs one warning when that happens. A single error inside the patch is handled: the answer is then 0.
RESOURCE_DEFINITION
{
	name = SubterraCavity
	displayName = #Subterra_Resource_Cavity
	abbreviation = #Subterra_Resource_Cavity_Abbr
	density = 0
	unitCost = 0
	flowMode = NO_FLOW
	transfer = NONE
	isTweakable = false
	isVisible = false
	volume = 0
}

GLOBAL_RESOURCE
{
	ResourceName = SubterraCavity
	ResourceType = 0
	Distribution
	{
		PresenceChance = 100
		MinAbundance = 0.0001
		MaxAbundance = 100
		Variance = 0
		Dispersal = 1
	}
}
