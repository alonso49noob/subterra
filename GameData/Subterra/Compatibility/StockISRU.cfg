// Subterra: explosives made on site. The stock converters (ISRU, Convert-O-Tron 125) get one more recipe: ore and
// electricity into blasting explosive (an ammonium-nitrate-like mix), so a mining base resupplies its own blast holes.
// Same heat curves as the stock recipes. [Claude, revisar: ratios]
// Convert-O-Tron 250: 5 kg of ore a second into 2.5 kg of explosive.
@PART[ISRU]:FOR[Subterra]
{
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = #Subterra_ISRU_Explosive
		StartActionName = #Subterra_ISRU_Explosive_start
		StopActionName = #Subterra_ISRU_Explosive_stop
		AutoShutdown = true
		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1000 10000
			key = 1250 500
			key = 2000 50
			key = 4000 0
		}
		GeneratesHeat = true
		DefaultShutoffTemp = .8
		ThermalEfficiency
		{
			key = 0 0 0 0
			key = 500 0.1 0 0
			key = 1000 1.0 0 0
			key = 1250 0.1 0 0
			key = 3000 0 0 0
		}
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		UseSpecialistHeatBonus = true
		SpecialistHeatFactor = 0.1
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		resourceOutputName = #Subterra_Res_Explosive
		INPUT_RESOURCE
		{
			ResourceName = Ore
			Ratio = 0.5
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 30
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Explosive
			Ratio = 2.5
			DumpExcess = false
		}
	}
}
