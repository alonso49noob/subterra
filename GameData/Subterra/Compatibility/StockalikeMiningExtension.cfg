// Optional: with Stockalike Mining Extension (linuxgurugamer, CC BY-NC-SA 4.0) installed, its big stack drills bore
// tunnels the way they point and pull their rig along them (Subterra's mole module; the tunnel borer they used is gone,
// replaced by the lasers). Nothing of that mod is copied here; this only adds Subterra's module to its parts.
@PART[SMX_2mStackDrill]:NEEDS[MiningExpansion]:FOR[Subterra]
{
	MODULE
	{
		name = ModuleSubterraMole
		radius = 3
		baseRate = 0.2
		iceFactor = 2
		powerUse = 25
		maxRockTemp = 750
		digAxis = 0, -1, 0
		headOffset = 2.5
	}
}

@PART[SMX_3mStackDrill]:NEEDS[MiningExpansion]:FOR[Subterra]
{
	MODULE
	{
		name = ModuleSubterraMole
		radius = 4.5
		baseRate = 0.25
		iceFactor = 2
		powerUse = 40
		maxRockTemp = 800
		digAxis = 0, -1, 0
		headOffset = 3.5
	}
}
