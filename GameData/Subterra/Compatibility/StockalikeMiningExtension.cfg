// Optional: with Stockalike Mining Extension (linuxgurugamer, CC BY-NC-SA 4.0) installed, its big stack drills
// also bore tunnels. Nothing of that mod is copied here; this only adds Subterra's module to its parts.
@PART[SMX_2mStackDrill]:NEEDS[MiningExpansion]:FOR[Subterra]
{
	MODULE
	{
		name = ModuleSubterraTunnelBorer
		radius = 3
		baseRate = 0.2
		powerUse = 25
		maxRockTemp = 750
		maxSlope = 30
		spoilOre = 0.25
		digAxis = 0, -1, 0
		headOffset = 2.5
	}
}

@PART[SMX_3mStackDrill]:NEEDS[MiningExpansion]:FOR[Subterra]
{
	MODULE
	{
		name = ModuleSubterraTunnelBorer
		radius = 4.5
		baseRate = 0.25
		powerUse = 40
		maxRockTemp = 800
		maxSlope = 30
		spoilOre = 0.25
		digAxis = 0, -1, 0
		headOffset = 3.5
	}
}
