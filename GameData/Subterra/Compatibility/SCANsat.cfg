// Optional: with SCANsat installed, its resource scanners also read out SubterraCavity (the radar's layer) in the
// part menu, the way SCANsat's own Community Resource Pack patch adds a readout per resource. SCANsat itself lists the
// resource and draws it on its maps from the resource definition alone (GameData/Subterra/Resources/SubterraCavity.cfg).
//
// Nothing is added to Subterra's own parts (Eco, Plomada): a SCANsat scanner module there would reveal every resource
// SCANsat knows, not only this one. The layer shows where the player has SCANsat resource coverage of the body AND
// Subterra's radar has found something; elsewhere its abundance is 0.
@PART[SurfaceScanner|OrbitalScanner|scansat-resources*]:NEEDS[SCANsat]:AFTER[SCANsat]
{
	MODULE
	{
		name = SCANresourceDisplay
		ResourceName = SubterraCavity
	}
}
