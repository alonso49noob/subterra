// Subterra settings. Edit with the game closed.
SUBTERRA_SETTINGS
{
	// Memory for cave meshes and props (MB).
	memoryCapMB = 300
	// Main-thread time per frame for uploading meshes and colliders (ms).
	mainThreadBudgetMs = 2
	// Cave colliders are built this far around each loaded vessel (m).
	colliderRadius = 150
	// Cave meshes are shown when the camera is this close to a network (m).
	visualRange = 4000
	// Far skylight caps are drawn between these camera distances (m).
	capMinDistance = 1500
	capRange = 8000
	// Round openings are cut into the terrain itself with a smooth edge (true), or whole terrain triangles are removed
	// and covered by a rim (false).
	terrainClip = true
	// Rims over removed terrain: texture (a textured stand-in) or terrain (experimental: a copy of the terrain material).
	rimMaterial = texture
	// Waypoint on each skylight of a discovered network.
	waypoints = true
	// Debug window button on the toolbar (Alt+Shift+U always works).
	debug = false
	// Drilling and digging speed multiplier (sub-project 2).
	digSpeed = 1
	// Tunnel borers can dig (false: they only show the rock ahead).
	excavation = true
	// Water in caves lifts, slows and crushes what goes in (sub-project 4).
	waterPhysics = true
	// Rover ramps beside skylights (experimental: off while their mouths are being fixed).
	ramps = false
	// Cheat menu, Set Position with a negative altitude (turn "override safety check" on): the vessel goes that far under
	// the ground (or under the sea level with "do not place underwater"); in solid rock a pocket its size is carved around it.
	carveOnSetPosition = true
	// Size of that pocket: pocketScale times the craft's size (1 = just room for it, up to 50), and at least pocketMinRadius
	// and pocketMinHeight metres; it grows up and out from under the craft. Also in the Subterra window (Alt+Shift+U).
	pocketScale = 1
	pocketMinRadius = 0
	pocketMinHeight = 0
	// Share of the real weight of the rock above that the PresMat adds to the air and water pressure (0 to 1). A tenth: KSP's 1:10 scale.
	rockPressureScale = 0.1
	// Boulders, rubble and slabs on cave and tunnel floors (false takes them out; only new chunks).
	tunnelRocks = true
	// Plumes of ice and vapour over the vents of lakes under the ice of airless moons (Vall, Eeloo, Minmus): cryovolcanoes.
	cryovolcanoPlumes = true
	// Parts are crushed past their rated pressure (maxPressure) in deep water: oceans under ice, flooded caves.
	waterCrush = false
	// Rock layers below the surface one look like their kind of rock (basalt, granite, ice, salt...); false = every layer uses
	// the body's own ground texture, tinted.
	layerTextures = true
	// Below the datum (caves, shafts, pits) the air pressure grows going down and the air is as hot as the rock: Kerbin's
	// air is about 17 atm 35 km down. KSP's own overpressure check leaves parts underground alone unless waterCrush = true.
	undergroundAir = true
	// How the deep, hot rock looks: glow (dull red from about 800 K to white-hot at the core, like the Earth's insides),
	// iridescent (thin-film colours) or none.
	deepRockLook = glow
	// Most tunnel pieces per body (a piece is up to 20 m).
	maxTunnelSegments = 5000
	// Rock strength (MPa) that sets how deep a tunnel can stay open: depth = strength / (density x gravity).
	voidStrengthMPa = 150
	// Radar overlay on the focused body in the map view and the Tracking Station (with a toolbar button to hide it).
	radarOverlay = true
	// Comma-separated body names Subterra leaves alone.
	disabledBodies =
	// Comma-separated patch ids to turn off: terrainAltitude, groundPositioning, camera, pqsHole, thermal, science, resources, kerbalismRadiation.
	disabledPatches =
}
