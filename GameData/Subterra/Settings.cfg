// Subterra settings. Edit with the game closed.
SUBTERRA_SETTINGS
{
	// Memory for cave meshes and props (MB).
	memoryCapMB = 300
	// Main-thread time per frame for uploading meshes and colliders (ms).
	mainThreadBudgetMs = 2
	// Cave colliders are built this far around each loaded vessel (m).
	colliderRadius = 150
	// Cave meshes are shown when the camera is this close to a network (m).
	visualRange = 4000
	// Far skylight caps are drawn between these camera distances (m).
	capMinDistance = 1500
	capRange = 8000
	// Round openings are cut into the terrain itself with a smooth edge (true), or whole terrain triangles are removed
	// and covered by a rim (false).
	terrainClip = true
	// Rims over removed terrain: texture (a textured stand-in) or terrain (experimental: a copy of the terrain material).
	rimMaterial = texture
	// Waypoint on each skylight of a discovered network.
	waypoints = true
	// Debug window button on the toolbar (Alt+Shift+U always works).
	debug = false
	// Drilling and digging speed multiplier (sub-project 2).
	digSpeed = 1
	// Tunnel borers can dig (false: they only show the rock ahead).
	excavation = true
	// Most tunnel pieces per body (a piece is up to 20 m).
	maxTunnelSegments = 5000
	// Rock strength (MPa) that sets how deep a tunnel can stay open: depth = strength / (density x gravity).
	voidStrengthMPa = 150
	// Comma-separated body names Subterra leaves alone.
	disabledBodies =
	// Comma-separated patch ids to turn off: terrainAltitude, groundPositioning, camera, pqsHole, thermal, science, resources, kerbalismRadiation.
	disabledPatches =
}
