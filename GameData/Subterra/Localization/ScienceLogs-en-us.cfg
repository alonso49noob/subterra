// Subterra science logs (Lucas: a log for each underground biome, with information and lore). Read by ScienceLogs.cs:
// #Subterra_Log_<experiment>_<zone> (variants _2, _3), else #Subterra_Log_Any_<zone>; a named site's #Subterra_Lore_<site> after
// the crew, EVA and sample reports; core samples #Subterra_Exp_Core_<layer>, else #Subterra_Exp_Core_Kind_<rock kind>.
// <<1>> is the body.
Localization
{
	en-us
	{
		#Subterra_Biome_SubsurfaceOcean = Subsurface Ocean
		#Subterra_Log_Core_Data = Layer from <<1>> to <<2>> m down. Hardness <<3>>, density <<4>> t/m³, about <<5>> K at its middle. Holds: <<6>>.
		#Subterra_Log_Core_Nothing = nothing worth pumping
		#Subterra_Log_Heading = <<1>> · <<2>>, <<3>>
		#Subterra_Log_CoreHeading = Rock core: <<1>> · <<2>>
		#Subterra_Log_Reading = READING
		#Subterra_Log_Meaning = WHAT IT MEANS
		#Subterra_Log_Story = THE PLACE
		#Subterra_Log_Read_Where = <<1>> m under the surface, in <<2>>
		#Subterra_Log_Read_Temp = Rock at <<1>> K (<<2>> °C); it warms about <<3>> K per kilometre from the surface
		#Subterra_Log_Read_Pressure = Pressure <<1>> kPa (<<2>> atm): gas <<3>>, liquid <<4>>, rock <<5>> kPa
		#Subterra_Log_Read_Gravity = Gravity <<1>> m/s², <<2>> % of the surface's (only the mass further down pulls)
		#Subterra_Log_Read_Seismic = Seismic waves at about <<1>> m/s in this rock (density <<2>> t/m³, hardness <<3>>)
		#Subterra_Log_Read_Sample = Sample: hardness <<1>>, density <<2>> t/m³; holds <<3>>
		#Subterra_Log_Read_Sky = Sky in sight from here: <<1>> %
		#Subterra_Log_Read_Water = Under <<1>> m of water
		#Subterra_Log_Core_Where = From <<1>> to <<2>> m down (<<3>> m thick)
		#Subterra_Log_Core_Rock = Hardness <<1>>, density <<2>> t/m³: a drill goes through it at <<3>> % of its speed
		#Subterra_Log_Core_Heat = <<1>> K at its top, <<2>> K at its base
		#Subterra_Log_Core_Weight = Weight of the rock over its middle: <<1>> kPa (at the PresMat's scale)
		#Subterra_Log_Core_Holds = Holds: <<1>>

		// --- Skylight shaft: the pit under a skylight, where the roof fell in --------------------------------------------
		#Subterra_Log_crewReport_SkylightShaft = Looking up the shaft, the crew sees a disc of sky framed by jagged rock. A cone of rubble from the fallen roof fills the floor; the kerbals argue over whether it fell a million years ago or last Tuesday.
		#Subterra_Log_evaReport_SkylightShaft = At the bottom of the skylight, half in sunlight and half in black shadow. The walls show the cave's roof in cross-section: layer upon layer of rock that held the ceiling up, until one day it didn't.
		#Subterra_Log_surfaceSample_SkylightShaft = A block of the roof that fell in, still sharp-edged. One face is weathered by the sky; the others had never seen anything but rock until the collapse.
		#Subterra_Log_mysteryGoo_SkylightShaft = The goo pressed itself against the side of the canister facing the light, then against the side facing the dark. It seems undecided about caves.
		#Subterra_Log_mobileMaterialsLab_SkylightShaft = Samples left in the pit's half-shade went from sunlight to shadow and back as the light crept across the walls: a free fatigue test, and a terrible place to get a tan.
		#Subterra_Log_temperatureScan_SkylightShaft = Where the light falls the floor bakes; one step into the shadow it drops sharply. The skylight is a doorway between the surface's extremes and the cave's steady calm.
		#Subterra_Log_barometerScan_SkylightShaft = The pressure matches the surface's almost exactly: the skylight is an open chimney, and whatever air there is flows freely up and down it.
		#Subterra_Log_seismicScan_SkylightShaft = The rubble cone rings differently from solid rock: loose, settling, still shifting now and then. The collapse that made this skylight may not be entirely over.
		#Subterra_Log_gravityScan_SkylightShaft = A faint gravity low: the gravimeter feels the missing mass of the cave beneath and around it, the very void that let this roof fall in.
		#Subterra_Log_atmosphereAnalysis_SkylightShaft = The air circulates slowly through the shaft: warm air rises out by day, cool air sinks in by night. The cave is breathing through this hole.
		#Subterra_Log_evaScience_SkylightShaft = A survey of the shaft's walls maps the layers of roof rock. Each band is a lava flow, a seabed or a dust storm that piled up long before the cave opened underneath.
		#Subterra_Log_Any_SkylightShaft = Measured at the bottom of a skylight, where the surface and the cave meet: half one world, half the other.

		// --- Tube gallery: the main passage ------------------------------------------------------------------------------
		#Subterra_Log_crewReport_TubeGallery = The gallery runs on into the dark beyond the reach of the lights: smooth walls, a flat floor, a ceiling like the inside of a giant pipe. Whatever flowed through here (lava, or water) took its time leaving.
		#Subterra_Log_crewReport_TubeGallery_2 = Total silence, total darkness, and a floor so even you could land a plane on it. The crew agrees it's the best garage on <<1>>. Nobody agrees on who pays the rent.
		#Subterra_Log_evaReport_TubeGallery = Walking the gallery, the kerbal finds lines along the walls at different heights: the high-water marks of the flow that carved the tube, recording how it rose and fell before it drained away.
		#Subterra_Log_surfaceSample_TubeGallery = A scraping from the gallery wall: a glassy rind over finer rock. The rind formed where the molten rock (or the dissolving water) touched the wall for years on end.
		#Subterra_Log_mysteryGoo_TubeGallery = In the gallery's absolute darkness the goo began to glow faintly. Or the observer's eyes were playing tricks. Either way, it's in the report now.
		#Subterra_Log_mobileMaterialsLab_TubeGallery = Shielded from radiation and from the swings of day and night, the gallery is about the steadiest lab on <<1>>. Long experiments drift less here than anywhere on the surface.
		#Subterra_Log_temperatureScan_TubeGallery = The temperature barely changes along the gallery: the rock overhead smooths out every day and every season. Down here it's as warm as the ground's yearly average, all year round.
		#Subterra_Log_barometerScan_TubeGallery = A slight draught along the gallery shows up as a tiny pressure difference between its ends: the cave breathes through openings nobody has found yet.
		#Subterra_Log_seismicScan_TubeGallery = Signals travel along the gallery as along a pipe: the hollow carries the faint rumble of distant impacts and quakes far better than solid rock does.
		#Subterra_Log_gravityScan_TubeGallery = Gravity in the gallery is a hair weaker than on the ground above it: the rock overhead now pulls upwards, against the rest of <<1>> below.
		#Subterra_Log_atmosphereAnalysis_TubeGallery = The gallery's air is still, cool and stale: the surface's own air, drier, and with a little of whatever seeps slowly out of the rock.
		#Subterra_Log_evaScience_TubeGallery = The survey measures the gallery's cross-section every few metres: it narrows where the flow ran fast and bulges where it pooled.
		#Subterra_Log_Any_TubeGallery = Data from deep in a tube gallery, out of the sun's reach and sheltered from space by tens of metres of rock.

		// --- Tube chamber: a great room ----------------------------------------------------------------------------------
		#Subterra_Log_crewReport_TubeChamber = The lights don't reach the far wall. The chamber echoes: every kerbal who speaks is answered three seconds later by three more. Bob would like to stop speaking now.
		#Subterra_Log_evaReport_TubeChamber = In the middle of the chamber the ceiling is so far up it might as well be the sky. Blocks the size of houses lie on the floor where the roof sagged and shed them, long ago.
		#Subterra_Log_surfaceSample_TubeChamber = From the breakdown pile in the middle of the chamber: pieces of the roof, cracked when they landed. Their fresh faces show what the rock far overhead is made of.
		#Subterra_Log_mysteryGoo_TubeChamber = The goo spread out flat, as if trying to fill the whole chamber. It managed about four centimetres before giving up.
		#Subterra_Log_mobileMaterialsLab_TubeChamber = The chamber's size lets big samples be tested in still, dark, steady conditions. The structural tests also suggest the chamber itself is holding up nicely. For now.
		#Subterra_Log_temperatureScan_TubeChamber = The chamber holds a slow pool of air, a little cooler near the floor and a little warmer under the dome: even underground, warm things rise.
		#Subterra_Log_barometerScan_TubeChamber = Steady pressure, a little higher than at the entrance: the chamber lies deeper than the passage that leads to it.
		#Subterra_Log_seismicScan_TubeChamber = The roof answers each tap with a long, low hum: the whole dome resonates. The engineers would like to know exactly how thick it is.
		#Subterra_Log_gravityScan_TubeChamber = A clear gravity low over the chamber: a lot of rock is missing here. Mapped from orbit, rooms like this show up as shallow dips in the field.
		#Subterra_Log_atmosphereAnalysis_TubeChamber = The chamber's still air is layered: the heaviest gases settle into the hollows of the floor. Helmets stay on.
		#Subterra_Log_evaScience_TubeChamber = Measured end to end, the roof spans further than any rock should comfortably span. The shape of the arch holds it up, helped by the gravity of <<1>>.
		#Subterra_Log_Any_TubeChamber = Data from a great underground chamber, where the cave grew wide before it narrowed again.

		// --- Tube branch: a side passage ---------------------------------------------------------------------------------
		#Subterra_Log_crewReport_TubeBranch = A narrower passage splits off the main gallery and winds out of sight. The crew paints an arrow on the wall so nobody gets lost. Then a second arrow, pointing at the first.
		#Subterra_Log_evaReport_TubeBranch = The branch is a tight fit: the kerbal can touch both walls at once. Its floor lies lower than the gallery's: the flow found a new way and left the old one behind.
		#Subterra_Log_surfaceSample_TubeBranch = Wall rock from a side branch: finer and denser than in the main gallery, cooled faster in the narrow channel.
		#Subterra_Log_mysteryGoo_TubeBranch = The goo flowed to the lowest corner of its canister, as if looking for the way the branch goes on.
		#Subterra_Log_mobileMaterialsLab_TubeBranch = In the cramped branch the samples sat close to the wall, where the rock's steady warmth rules everything: a good place to study slow heat soaking.
		#Subterra_Log_temperatureScan_TubeBranch = The branch is a little colder than the gallery: less air moves through it, and it lies further from any opening.
		#Subterra_Log_barometerScan_TubeBranch = No draught at all: the branch may end blind, or reach the rest of the system only through cracks too thin to see.
		#Subterra_Log_seismicScan_TubeBranch = Echoes from the end of the branch come back sooner than expected: it doesn't go on forever. Or it turns. One of the two.
		#Subterra_Log_gravityScan_TubeBranch = Hardly any gravity change in the branch: it's too narrow to leave much of a hole in the field. Only the depth counts here.
		#Subterra_Log_atmosphereAnalysis_TubeBranch = The stalest air in the cave: dead ends trap the gases that seep out of the rock and keep them for ages.
		#Subterra_Log_evaScience_TubeBranch = Following the branch, the kerbal logs where it splits and joins again: a braided pattern, like a river delta in stone.
		#Subterra_Log_Any_TubeBranch = Data from a side branch of the cave, a tight passage off the main gallery.

		// --- Frozen vault: an ice-lined cold trap ------------------------------------------------------------------------
		#Subterra_Log_crewReport_FrozenVault = Every surface is coated in frost that sparkles in the lights. The vault is a cold trap: once water gets in, it never leaves. Jeb wants to build a hockey rink.
		#Subterra_Log_evaReport_FrozenVault = The kerbal's boots crunch on ice crystals that grew over ages, one molecule at a time, from the faintest whisper of vapour. Some are as long as a finger.
		#Subterra_Log_surfaceSample_FrozenVault = Ice scraped from the vault floor: layers of frost with fine dust between them, a record of every time the cave breathed a little moisture in.
		#Subterra_Log_mysteryGoo_FrozenVault = The goo stiffened in the cold and refused to move. Several kerbals could relate.
		#Subterra_Log_mobileMaterialsLab_FrozenVault = The coldest steady place around: samples kept here change only at the pace of the ice itself. A freezer older than the space program.
		#Subterra_Log_temperatureScan_FrozenVault = Colder than the rock around it and than the gallery leading to it: cold air sinks into the vault and stays, and the ice holds the cold.
		#Subterra_Log_barometerScan_FrozenVault = The frost sets the pressure here: the colder the vault, the less vapour the ice gives off and the thinner the air over it.
		#Subterra_Log_seismicScan_FrozenVault = The ice muffles the signals like a soft blanket over the rock. How thick it is can be read from how much the echoes are damped.
		#Subterra_Log_gravityScan_FrozenVault = Ice weighs a third as much as rock: the vault's frozen floor makes the gravity low a little deeper than empty rock would.
		#Subterra_Log_atmosphereAnalysis_FrozenVault = Dry, frigid air with traces of what the ice traps: old gases locked into the frost as it grew.
		#Subterra_Log_evaScience_FrozenVault = Ice cores from the vault floor show bands like tree rings: times when more moisture came in, and times when almost none did.
		#Subterra_Log_Any_FrozenVault = Data from a frozen vault, a cold trap where ice has gathered undisturbed for ages.

		// --- Dug tunnel: a hole kerbals made -----------------------------------------------------------------------------
		#Subterra_Log_crewReport_Excavation = The walls still show the marks of the tools, or of the blast, that cut them. Nobody had ever seen this rock: it had been in the dark since <<1>> formed.
		#Subterra_Log_evaReport_Excavation = Freshly broken rock all around: sharp edges, clean faces, no dust yet. The kerbal reads the layers in the wall like the pages of a book nobody ever opened.
		#Subterra_Log_surfaceSample_Excavation = A pristine sample, untouched by space, water or air: straight from the rock's interior, exactly as it formed.
		#Subterra_Log_mysteryGoo_Excavation = The goo seems agitated, as if the digging still echoes in the walls. Or it has opinions about drilling.
		#Subterra_Log_mobileMaterialsLab_Excavation = Freshly cut rock is reactive: samples near the walls pick up a faint film from the newly exposed minerals. Interesting chemistry, annoying contamination.
		#Subterra_Log_temperatureScan_Excavation = The rock here is at its natural temperature for this depth, untouched by any cave air. Deeper tunnels will run warmer: the ground heats up going down.
		#Subterra_Log_barometerScan_Excavation = The tunnel holds only the air that leaked in from the surface, or that the kerbals brought: a fresh tube of almost nothing.
		#Subterra_Log_seismicScan_Excavation = The tunnel's fresh cracks still settle with small pops and creaks as the rock adjusts to the hole. The engineers call it normal. Everyone else calls it unsettling.
		#Subterra_Log_gravityScan_Excavation = Gravity here depends on depth alone: the deeper the tunnel, the more of <<1>> lies above, pulling up, and the less pulls down.
		#Subterra_Log_atmosphereAnalysis_Excavation = The air carries rock dust and a whiff of explosive: a fine haze that will take weeks to settle.
		#Subterra_Log_evaScience_Excavation = The kerbal logs the walls metre by metre: the first map of rock no eye had ever seen.
		#Subterra_Log_Any_Excavation = Data from a tunnel dug by kerbals: rock opened to the light for the first time.

		// --- Geode: a sealed room of crystals ----------------------------------------------------------------------------
		#Subterra_Log_crewReport_Geode = Crystals as big as kerbals line the walls, glinting in every colour the lights can make. Nobody speaks for a whole minute. Then everyone speaks at once.
		#Subterra_Log_evaReport_Geode = Up close the crystals are clear, smaller ones grown on bigger ones, and some hold bubbles of fluid: drops of the hot water they grew from, sealed in ages ago.
		#Subterra_Log_surfaceSample_Geode = A crystal tip broken from the wall. Inside, tiny pockets of fluid: the very water this room was born in. Its chemistry tells when it happened, and how hot it was.
		#Subterra_Log_mysteryGoo_Geode = The goo took on a faint crystalline sheen. It may have been impressed. It may have been trying to fit in.
		#Subterra_Log_mobileMaterialsLab_Geode = The crystals are nearly perfect: grown slowly and undisturbed in a sealed room. Their structure is a lesson in patience for every materials scientist.
		#Subterra_Log_temperatureScan_Geode = The geode is at exactly the temperature of the rock around it: no air ever came in to change it. The crystals grew when it was much hotter.
		#Subterra_Log_barometerScan_Geode = The pressure is whatever came in through the hole: until it was opened, the geode was a sealed bubble holding nothing but its own crystals.
		#Subterra_Log_seismicScan_Geode = The geode rings like a bell. A hollow lined with hard crystals inside solid rock is, seismically speaking, a musical instrument.
		#Subterra_Log_gravityScan_Geode = A small, sharp gravity low: a sealed void, the kind of target a gravimeter survey finds before any drill does.
		#Subterra_Log_atmosphereAnalysis_Geode = Traces of gas released from the crystals' fluid inclusions when the room was opened: the breath of the water that made the geode.
		#Subterra_Log_evaScience_Geode = Crystal sizes measured across the room: biggest in the middle of each wall, smallest in the corners, where the mineral-laden water reached them least.
		#Subterra_Log_Any_Geode = Data from inside a geode, a sealed room of crystals that grew in the dark.

		// --- Subglacial lake ---------------------------------------------------------------------------------------------
		#Subterra_Log_crewReport_SubglacialLake = Black water under a ceiling of ice, perfectly still. The lights reflect off it as off a mirror. It has been liquid, sealed and dark since long before any kerbal looked up at the sky.
		#Subterra_Log_evaReport_SubglacialLake = At the water's edge the ice overhead glows faintly blue. The kerbal dips a glove in: cold, but liquid, kept that way by the weight of the ice above and the warmth of the rock below.
		#Subterra_Log_surfaceSample_SubglacialLake = Lake water: fine silt, dissolved salts, minerals leached from the rock floor. If anything has ever lived on <<1>>, places like this are where it would hide.
		#Subterra_Log_mysteryGoo_SubglacialLake = The goo dissolved a little in the lake water, then put itself back together, looking smug.
		#Subterra_Log_mobileMaterialsLab_SubglacialLake = Samples soaked in the lake show what ages of contact with sealed water do to rock and metal: slow, steady corrosion, never stirred by a single wave.
		#Subterra_Log_temperatureScan_SubglacialLake = The water sits just above its freezing point. The ice above presses so hard that it melts at its base: the lake is warmed from below and capped from above.
		#Subterra_Log_barometerScan_SubglacialLake = The pressure here is the weight of the ice overhead, hundreds of metres of it, bearing down on the water.
		#Subterra_Log_seismicScan_SubglacialLake = The lake floor reflects signals sharply: a flat bed of sediment under the water, laid down grain by grain in total calm.
		#Subterra_Log_gravityScan_SubglacialLake = Water weighs less than rock and more than ice: the lake shows up as a faint anomaly under the ice sheet, which is how such lakes are found from orbit.
		#Subterra_Log_atmosphereAnalysis_SubglacialLake = The air over the water is saturated with moisture and rich in gases that bubbled out of the lake when it was opened.
		#Subterra_Log_evaScience_SubglacialLake = Soundings across the lake map its floor: a smooth basin, deepest where the ice above is thickest.
		#Subterra_Log_Any_SubglacialLake = Data from a lake sealed under the ice, liquid in the dark for ages.

		// --- Subsurface ocean --------------------------------------------------------------------------------------------
		#Subterra_Log_crewReport_SubsurfaceOcean = Outside the windows: nothing. No floor below, no surface above, only dark water in every direction, and the ice ceiling far overhead. The crew is very quiet.
		#Subterra_Log_evaReport_SubsurfaceOcean = Floating in the ocean of <<1>>, the kerbal watches the lights fade into the dark a few metres away. Somewhere above is the underside of the ice; somewhere below, the sea floor.
		#Subterra_Log_surfaceSample_SubsurfaceOcean = A sample of the ocean: salty, cold, full of minerals dissolved from the rock floor far below. A whole world's worth of water nobody had ever tasted.
		#Subterra_Log_mysteryGoo_SubsurfaceOcean = In the dark ocean the goo pulsed slowly, as if in time with something far away. The kerbals agreed not to put that in the report. Too late.
		#Subterra_Log_mobileMaterialsLab_SubsurfaceOcean = Samples exposed to the ocean's crushing, freezing water show how hulls will fare on long dives. The answer: they had better be thick.
		#Subterra_Log_temperatureScan_SubsurfaceOcean = A few degrees above freezing: warmer near the floor, where the rock heats it, and colder under the ice. Slow currents rise and sink between the two.
		#Subterra_Log_barometerScan_SubsurfaceOcean = The pressure out there is the whole weight of the ice and the water above, and it grows with every metre down.
		#Subterra_Log_seismicScan_SubsurfaceOcean = Sound carries for kilometres in the ocean: the ice ceiling creaks and groans as the tides flex it, a constant, distant chorus.
		#Subterra_Log_gravityScan_SubsurfaceOcean = The ocean is a layer of lighter matter between the ice and the rock: how deep and how salty it is can be worked out from gravity alone.
		#Subterra_Log_atmosphereAnalysis_SubsurfaceOcean = Gases dissolved in the ocean, measured as they bubble out of the sample: a chemistry made by water and rock in contact, sealed off from the sky.
		#Subterra_Log_evaScience_SubsurfaceOcean = Water sampled at several depths: the deeper, the saltier and the warmer. The ocean is layered, and slowly turning over.
		#Subterra_Log_Any_SubsurfaceOcean = Data from the ocean under the crust of <<1>>: a whole sea that has never seen the sun.

		// --- Named sites: their lore ------------------------------------------------------------------------------------
		#Subterra_Lore_KscCave = The KSC Cave, a short drive from the runway: the first cave most space programs ever see. Gene Kerman insists it was "discovered" by a rover test that went off course.
		#Subterra_Lore_KerbinGreatHall = The Great Hall: a chamber dissolved out of the limestone by groundwater over hundreds of thousands of years, entered through a sinkhole in the highlands north of the KSC.
		#Subterra_Lore_KerbinCenotes = The Coast Cenotes: sinkholes where the roof of a flooded cave fell in, opening windows of clear water near the shore. Ancient kerbals took them for doors to another world. They were partly right.
		#Subterra_Lore_KerbinKimberlite = The Kimberlite Chimney: a pipe punched up from the mantle by a violent, gas-driven eruption. Kimberlites bring diamonds up from great depths; this one spirals down for kilometres, and something sealed lies below its bottom.
		#Subterra_Lore_KerbinDeepGeode = The Deep Geode: a sealed crystal room far under the Kimberlite Chimney, grown from mineral-rich water heated by the old volcanic pipe.
		#Subterra_Lore_KerbinLakeKostok = Lake Kostok: liquid water two kilometres under the south polar ice, sealed from the sky for perhaps millions of years. Its water is the oldest on Kerbin.
		#Subterra_Lore_KerbinWhillansLake = Whillans Lake: a film of water a few metres deep spread under 4.5 km of ice, its roof nearly touching its floor. It fills and drains every few years, lifting the ice above it by metres, and is all mud and slow water.
		#Subterra_Lore_KerbinEllsworthChain = The Ellsworth Chain: three lakes in a row under the polar ice, joined by channels, the meltwater draining slowly from the first to the last.
		#Subterra_Lore_DunaNorthBrines = The Northern Brine Pockets: small lakes of brine so salty they stay liquid in the cold, strung along channels under Duna's northern cap.
		#Subterra_Lore_DunaSouthBrineFilm = The Southern Brine Film: a sheet of brine a few metres deep and kilometres wide, glistening under the southern ice.
		#Subterra_Lore_LaytheWhillansLake = The Thin Lake: a broad sheet of water a few metres deep under Laythe's northern ice, warmed from below by Jool's tides.
		#Subterra_Lore_LaytheLakeChain = The Lake Chain: three lakes under Laythe's northern cap joined by water channels, each a little deeper than the last.
		#Subterra_Lore_KerbinSaltLake = The Salt Lake: what is left of an inland sea that dried out over the desert. Its water sank into the rock and pooled 140 m down, so salty it would float a kerbal on its back; cubes of halite crust its shores and floor, growing a little every year as the brine evaporates into the cave.
		#Subterra_Lore_LaytheHotSpring = The Hot Spring: water warmed by the heat under the island rises here, rich in sulphur and iron. It is alive: mats of bacteria carpet the floor in orange and the walls in green, glowing faintly as they feed on the minerals. The first life found on another world lives in the dark.
		#Subterra_Lore_KerbinVerneRoute = The Verne Route: down the crater of a dormant volcano, along an ancient tube to the Lidenbrock Sea (a flooded cavern three kilometres underground) and up again through a second volcano. An old story says a professor and his nephew made this trip. Kerbals assume he was a professor kerbal.
		#Subterra_Lore_SerenitySkylight = Serenity Skylight: the first skylight spotted on the Mun, a pit in the mare that opens into a lava tube. Its discovery sent every mission planner back to the drawing board.
		#Subterra_Lore_GreatGallery = The Great Gallery: one of the Mun's longest lava tubes, running for kilometres under the dark mare. In the Mun's low gravity, tubes can grow far wider than they ever could on Kerbin.
		#Subterra_Lore_KermanChain = The Kerman Chain: a row of collapse pits strung along a buried lava tube like beads on a string, each one a place where the roof gave way.
		#Subterra_Lore_Frostvault = Frostvault: an ice-lined tube near the Mun's pole, where the sun never shines in. Water ice gathered here over ages: a treasure for anyone who means to stay.
		#Subterra_Lore_KermanRille = The Kerman Rille: a winding channel carved by flowing lava and partly roofed over, a lava tube with its lid half missing.
		#Subterra_Lore_DunaCatena = The Duna Catena: a straight row of pits ten kilometres long over a buried lava tube, like the pit chains on the flanks of old volcanoes elsewhere in the Kerbol system.
		#Subterra_Lore_DunaVolcanoTubes = Volcano Tubes: tubes down the flank of a dormant shield volcano, where lava once ran in insulated channels for tens of kilometres before it reached the plains.
		#Subterra_Lore_DunaPolarIce = Polar Ice Cave: a tube under Duna's northern cap, its walls frosted. The air trapped in its ice is a sample of Duna's sky from ages ago, when it may have been thicker.
		#Subterra_Lore_DunaCanyonCaves = Canyon Caves: low, wide chambers under the floor of the Midland Canyon, opened where water once ran, or seeped, through the canyon's layered rock.
		#Subterra_Lore_DunaSouthPolarLake = The South Polar Lake: a lens of cold brine more than a kilometre under the southern ice. The salt keeps it liquid far below the freezing point of fresh water. Radar found it before any kerbal did.
		#Subterra_Lore_IkeTrench = Ike Trench: a long crack pulled open by the tides Duna raises in its moon, roofed over in places. Ike is slowly being stretched.
		#Subterra_Lore_TyloGreatSystem = Tylo's Great System: deep, wide lava tubes under the flat mara, with rooms like cathedrals. Tylo's gravity is heavy, but its rock is strong. And under all of it lies an ocean.
		#Subterra_Lore_TyloHighlandCaves = Highland Caves: smaller caves in Tylo's ancient highlands, shattered and reglued by impacts, older than the mara and harder to read.
		#Subterra_Lore_MinmusFlatsGallery = The Flats Gallery: a broad, low cave in the ice under the Great Flats, from a time when that frozen lake was liquid.
		#Subterra_Lore_MinmusIceCaves = Slope Ice Caves: a winding tube in the mint ice under Minmus's slopes. Daylight seeps through its thin roof and tints the walls green.
		#Subterra_Lore_MinmusCentralGeode = The Central Geode: a sealed crystal chamber forty metres under the highlands, found by radar. On Minmus, even the crystals look slightly minty.
		#Subterra_Lore_MinmusMintLake = The Mint Lake: liquid water perched in Minmus's ice over its ocean, given away by the cryovolcanic dome over it and the plume that vents from its top.
		#Subterra_Lore_Mohole = The Mohole: the collapsed roof of a huge, emptied magma chamber at Moho's pole. Its walls spiral down for kilometres. The scientists who named it insist the joke was unintentional.
		#Subterra_Lore_MohoPlainsTubes = Plains Tubes: lava tubes under Moho's scorched plains, where the rock never stops being hot.
		#Subterra_Lore_MohoThermalRefuge = Thermal Refuge: a deep, closed chamber at a steady temperature, sheltered from Moho's brutal days and nights. The most comfortable room this close to the sun.
		#Subterra_Lore_EveAquifer = The Explodium Aquifer: a karst passage half flooded with explodium, the volatile liquid that dissolves Eve's rock as water dissolves limestone. Pumps welcome; open flames not.
		#Subterra_Lore_EveSaltDome = The Salt Dome: a column of ancient salt that rose through Eve's crust like wax in a lamp, pushing up the rock above it.
		#Subterra_Lore_LaytheIslandTube = The Island Tube: a lava tube under one of Laythe's volcanic islands, running down toward the sea. Its seaward end is flooded.
		#Subterra_Lore_LaytheNorthPolarLake = The North Polar Lake: water under Laythe's northern ice, kept liquid by the heat Jool's tides pump into the moon.
		#Subterra_Lore_DresCanyonCaves = Canyon Caves: caves in the walls of Dres's great canyons, cracks opened when something very large hit the dwarf planet.
		#Subterra_Lore_GillyTunnel = The Gilly Tunnel: a winding gap between the blocks that make up Gilly, open at both ends. Gilly is less a moon than a loose pile of rocks flying in formation.
		#Subterra_Lore_BopCavern = Bop's Cavern: a huge void in the dirty ice Bop is made of. Bop is likely a captured comet, hollowed out by ages of outgassing.
		#Subterra_Lore_BopKrakenChamber = The Old Chamber: a vast cavity deep inside Bop, and in it, something large and old. The crew reports that it is "definitely not moving". They have been asked to keep checking.
		#Subterra_Lore_VallIceCaves = Vall Ice Caves: tubes in Vall's ice shell, flexed every day by Jool's tides. They open and close by fractions of a millimetre, creaking without end.
		#Subterra_Lore_VallThera = Thera Lake: a lens of liquid water perched in Vall's ice shell, like those thought to lie under the chaos terrains of icy moons. Its cryovolcanic vent gives it away from orbit.
		#Subterra_Lore_VallThrace = Thrace Lake: a second perched lake in Vall's ice, its place marked by a dome where the water pushes up the ice over it.
		#Subterra_Lore_EelooIceCaves = Eeloo Ice Caves: caves in the frozen crust of the farthest world, where the sun is only a bright star.
		#Subterra_Lore_EelooGeyserLake = Geyser Lake: a pocket of liquid deep in Eeloo's ice, venting to space through a geyser. Even the coldest world in the system is warm inside.
		#Subterra_Lore_PolIceCaves = Pol Ice Caves: tubes in the strange, pollen-coloured ice of Pol, a world of spikes and pits.

		// --- Core samples, by layer --------------------------------------------------------------------------------------
		#Subterra_Exp_Core_Regolith = Loose dust and glassy beads in thin, sorted bands. Every grain was smashed, melted or thrown here by impacts: the regolith of <<1>> is the debris of ages of bombardment. The bottom of the core is a little coarser than the top.
		#Subterra_Exp_Core_Megaregolith = Broken blocks in a matrix of rock flour, crushed by the great impacts of <<1>>'s youth. Kilometres of this shattered layer lie under the surface: the crust was broken, mixed and thrown about long before the first lava flowed.
		#Subterra_Exp_Core_MareBasalt = Dark, fine-grained basalt full of frozen gas bubbles, from a sea of lava that flooded a basin ages ago. Iron and titanium give it the dark colour that makes the maria stand out from afar.
		#Subterra_Exp_Core_AnorthositeBreccia = Pale fragments of anorthosite (a rock almost entirely of feldspar) welded together by impacts: the first crust of <<1>>, which floated to the top of a global ocean of magma when the world was young and molten.
		#Subterra_Exp_Core_Basalt = Dense, dark basalt: lava that erupted, flowed and cooled. Small olivine crystals sparkle green in the cut face; they were already solid when the lava rose.
		#Subterra_Exp_Core_VolcanicBasalt = Thin flows stacked like the pages of a book, each a few metres thick, each with a rubbly top where it cooled. Count them and you are counting eruptions.
		#Subterra_Exp_Core_IslandBasalt = Young basalt with fresh olivine and pyroxene: the islands of <<1>> grew from flows like these, one on top of another, from the sea floor up.
		#Subterra_Exp_Core_Granite = Coarse crystals of quartz, feldspar and mica: rock that cooled slowly, kilometres down, over hundreds of thousands of years. Continents are made of granite: light, strong, and very, very old.
		#Subterra_Exp_Core_Limestone = Fine grey limestone thick with the shells of tiny sea creatures. It formed on an old seabed; the water that has seeped through it since dissolved the caves and sinkholes of <<1>>'s karst.
		#Subterra_Exp_Core_Sandstone = Rounded sand grains cemented together in slanted layers: the faces of dunes, or the ripples of a riverbed, frozen into stone.
		#Subterra_Exp_Core_Sediments = Soft layers of silt and clay laid down by water and wind, year after year. Fine laminations record seasons; coarser beds record floods and storms.
		#Subterra_Exp_Core_LayeredSediments = Hundreds of fine bands, light and dark, alternating like clockwork. They follow the slow wobbles of <<1>>'s orbit and tilt: a record of ancient climates, written in stone.
		#Subterra_Exp_Core_Evaporites = Salt and gypsum: a sea dried up here, again and again, leaving its salts behind each time. Under pressure, salt flows like very slow toothpaste and rises in domes.
		#Subterra_Exp_Core_Soil = Dark, crumbly soil with roots, grit and the remains of countless small living things. Barely a metre thick, and it took thousands of years to make.
		#Subterra_Exp_Core_DeepCrust = Hot, dense metamorphic rock squeezed into folds: the deep roots of the crust.
		#Subterra_Exp_Core_MiddleCrust = Banded gneiss: light and dark minerals drawn out into stripes by heat and pressure that never quite melted the rock. The middle crust is where mountains go when they are buried.
		#Subterra_Exp_Core_LowerCrust = Heavy, dark rock, its minerals realigned by heat and pressure: the deep roots of the crust of <<1>>. It is hot to the touch even inside the sample case.
		#Subterra_Exp_Core_MagmaChamberRoof = Glassy, baked rock threaded with veins that were once molten: the roof of a magma chamber. Below this, the rock was liquid not so long ago, geologically speaking.
		#Subterra_Exp_Core_LithosphericMantle = Green olivine and dark pyroxene, cold and rigid: the top of the mantle, welded to the crust into the plates that ride on the softer rock below.
		#Subterra_Exp_Core_Asthenosphere = Olivine with a thin film of melt between its grains. Only a percent or two is liquid, but it's enough to let the whole layer flow over ages: the plates above glide on it.
		#Subterra_Exp_Core_UpperMantle = Peridotite, mostly green olivine: the most common rock in all of <<1>>, and almost never seen at its surface. At this depth it glows.
		#Subterra_Exp_Core_Mantle = Dense green rock from the mantle, slowly flowing over ages under immense pressure.
		#Subterra_Exp_Core_TransitionZone = At this pressure olivine has collapsed into denser crystals that can hold water inside their structure. The transition zone of <<1>> may hold more water than all its seas.
		#Subterra_Exp_Core_LowerMantle = Crystals that exist only under crushing pressure, denser than any rock at the surface. They make up most of the mantle's mass, and most of the planet's.
		#Subterra_Exp_Core_CoreMantleBoundary = A patchy, dense layer where the rocky mantle meets the metal core. The core's heat floods into the mantle here, and great plumes rise from it toward the surface.
		#Subterra_Exp_Core_OuterCore = Liquid iron and nickel, churning: the flow of this metal ocean is what makes the magnetic field of <<1>>. The sample was liquid when it was taken and is solid now, which says a lot about the drill head.
		#Subterra_Exp_Core_InnerCore = Solid iron and nickel, crystallised by the pressure despite a heat like a star's surface. The centre of <<1>>: there is nowhere deeper to go.
		#Subterra_Exp_Core_IronCore = Iron and nickel, impossibly dense: a piece of the core of <<1>>, a world small enough that its core froze solid long ago.
		#Subterra_Exp_Core_Core = Iron and nickel, impossibly dense: a piece of the core itself.
		#Subterra_Exp_Core_RockyMantle = Dark silicate rock under the ice: the stony interior the icy shell hides.
		#Subterra_Exp_Core_RockyCore = Dense, dark rock at the heart of an icy world: everything heavy sank here when <<1>> was young and warm enough to separate.
		#Subterra_Exp_Core_IcyMantle = Ice under great pressure, grey with dust: neither the brittle ice of the surface nor liquid water, but a warm, slow, plastic layer that moves over ages.
		#Subterra_Exp_Core_HighPressureIce = Ice squeezed into crystal forms that cannot exist at the surface: denser than water, and solid even when warm. It sinks instead of floating.
		#Subterra_Exp_Core_IceRegolith = Ice grains and dust packed together: the frosty soil of an icy world, stirred by micrometeorites and frozen hard.
		#Subterra_Exp_Core_WaterIce = Clear, hard water ice with tiny trapped bubbles, each one a sample of whatever air, or vacuum, there was when the ice formed.
		#Subterra_Exp_Core_DirtyIce = Ice streaked with dark dust and organic grime: the stuff comets are made of, here in bulk.
		#Subterra_Exp_Core_IcyCrust = Ice and rock in alternating layers: a crust that froze, thawed and froze again many times as <<1>> warmed and cooled.
		#Subterra_Exp_Core_IcyBreccia = Broken ice and rock frozen back together by old impacts: the scars of the history of <<1>>, sealed in ice.
		#Subterra_Exp_Core_IceShell = Ice that is older the deeper it goes: the shell over the ocean.
		#Subterra_Exp_Core_MintIce = Pale green ice, faintly minty. Nobody quite knows why Minmus is like this. The scientists checked twice: the sample definitely smells of mint.
		#Subterra_Exp_Core_PolarIce = Polar ice in fine layers, each band a season of frost and dust. Read from the top, the core is a calendar of polar winters.
		#Subterra_Exp_Core_Rubble = Loose blocks and voids barely held together by gravity: a rubble pile, not a solid world. The drill kept dropping into gaps.
		#Subterra_Exp_Core_PartialMelt = Rock with pockets of melt between its crystals, glowing orange in the sample case: on its way to becoming magma, if it ever finds a way up.
		#Subterra_Exp_Core_SubsurfaceOcean = The drill came up wet: the hole broke through the bottom of the crust into the ocean of <<1>>. Salty, cold, and liquid for ages.

		// --- Core samples, by kind of rock (layers of other planet packs) -------------------------------------------------
		#Subterra_Exp_Core_Kind_Generic = A cylinder of rock from the bottom of the hole, banded and fresh: rock nobody had ever seen, from deep inside <<1>>.
		#Subterra_Exp_Core_Kind_Regolith = Loose dust and broken grains: the debris of impacts and weathering, packed down over ages.
		#Subterra_Exp_Core_Kind_Basalt = Dark, fine-grained volcanic rock: lava that cooled near the surface.
		#Subterra_Exp_Core_Kind_Anorthosite = Pale rock almost entirely of feldspar: crust that floated to the top of an ancient ocean of magma.
		#Subterra_Exp_Core_Kind_Breccia = Sharp fragments cemented together: rock broken by an impact and welded again by its heat.
		#Subterra_Exp_Core_Kind_Limestone = Fine limestone made of the shells of tiny sea creatures: an old seabed.
		#Subterra_Exp_Core_Kind_Sandstone = Sand grains cemented into stone in slanted layers: old dunes or riverbeds.
		#Subterra_Exp_Core_Kind_Granite = Coarse crystals of quartz and feldspar: rock that cooled slowly, deep underground.
		#Subterra_Exp_Core_Kind_Ice = Hard, clear ice with bubbles and dust in it: frozen for ages.
		#Subterra_Exp_Core_Kind_Salt = Salt crystals: what is left of a sea that dried up.
		#Subterra_Exp_Core_Kind_Metal = Iron and nickel, impossibly dense: metal from a core.
		#Subterra_Exp_Core_Kind_Olivine = Green olivine and pyroxene: the rigid top of the mantle.
		#Subterra_Exp_Core_Kind_Mantle = Dense mantle rock, flowing slowly over ages under immense pressure.
		#Subterra_Exp_Core_Kind_Core = Dense rock and metal from the heart of <<1>>.
		#Subterra_Exp_Core_Kind_Sediment = Soft layers of silt and clay laid down by water or wind.
		#Subterra_Exp_Core_Kind_Gabbro = Coarse, dark gabbro: basalt's twin, cooled slowly deep in the crust.
		#Subterra_Exp_Core_Kind_Gneiss = Banded gneiss: rock drawn out into stripes by heat and pressure.
		#Subterra_Exp_Core_Kind_Asthenosphere = Hot rock with a film of melt between its grains: the soft layer the plates glide on.
		#Subterra_Exp_Core_Kind_MoltenMetal = Metal that was liquid when the drill reached it: a sample of a churning ocean of metal.

		// --- The centre of a world (CentreReward) ---------------------------------------------------------------------------
		#Subterra_Centre_Title = Journey to the centre of <<1>>
		#Subterra_Centre_Message = The centre of <<1>>!
		#Subterra_Centre_Ok = Onwards (and upwards)
		#Subterra_Centre_Science = +<<1>> science
		#Subterra_Centre_Funds = +<<1>> funds
		#Subterra_Centre_Reputation = +<<1>> reputation
		#Subterra_Centre_Any = The centre of <<1>>. Every way is up from here: the whole world weighs on you from all sides and pulls you nowhere. No kerbal had ever been this deep, and maybe none ever will be again.
		#Subterra_Centre_Kerbin = Six hundred kilometres of rock, magma and molten iron overhead, and at the bottom of it all, the solid iron heart of Kerbin: hotter than the surface of the sun and squeezed solid by the weight of the whole world. Gravity is zero; every way is up. The professor in the old story never got this far.
		#Subterra_Centre_Mun = The heart of the Mun: a small iron core that froze long ago. The whole Mun presses in from every side and pulls you nowhere. Nobody back on Kerbin will believe it; the instruments will have to do the talking.
		#Subterra_Centre_Minmus = The rocky heart of Minmus, under its ice and its ocean. It is, against all reason, faintly minty.
		#Subterra_Centre_Duna = The core of Duna: once it stirred a magnetic field that sheltered a thicker sky and maybe seas. It has been cooling ever since, and Duna's air went with its field.
		#Subterra_Centre_Ike = The core of Ike, small and cold, gripped every day by Duna's tides. Ike creaks around you.
		#Subterra_Centre_Eve = The centre of Eve: more rock and iron than Kerbin, under a sky so heavy it crushes landers. Getting here was the easy part. Getting back to orbit from Eve is the stuff of legends.
		#Subterra_Centre_Gilly = The middle of Gilly: barely a centre at all, a few kilometres of loose rubble held together by a whisper of gravity. Mind the gaps.
		#Subterra_Centre_Moho = The core of Moho: an enormous ball of iron that makes up most of the planet, as if the sun had burnt the rest away. The hottest place this close to the hottest star.
		#Subterra_Centre_Dres = The heart of Dres, the forgotten dwarf planet. Nobody remembers Dres. Nobody will forget this.
		#Subterra_Centre_Laythe = The core of Laythe, kept hot by Jool's tides, under an ocean with air above it. The most kerbal-friendly moon is just as fierce inside as any.
		#Subterra_Centre_Vall = The centre of Vall, under its ice shell and its ocean: a stony core flexed each day by Jool, warm enough to keep a sea liquid above it for ages.
		#Subterra_Centre_Tylo = The core of Tylo, under an ocean fifty kilometres deep and hundreds of kilometres of rock. The heaviest moon in the system, and you went all the way down.
		#Subterra_Centre_Bop = The heart of Bop, a captured comet: dirty ice all the way down, and something large and old somewhere in it. You have the feeling you are not alone.
		#Subterra_Centre_Pol = The centre of Pol, the pollen-coloured moon: a small, stony core in a world of spikes.
		#Subterra_Centre_Eeloo = The core of Eeloo, the farthest world: rock, under ice, under the faintest sunlight in the system. Even here it is warmer than on the surface.
	}
}
