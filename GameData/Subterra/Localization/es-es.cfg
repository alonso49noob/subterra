		#Subterra_Part_Manufacturer = Subterra Geoworks
		#Subterra_Part_CoreDrill_title = Perforadora de testigos SB-1 "Barrena"
		#Subterra_Part_CoreDrill_desc = Abre un pozo estrecho recto hacia abajo a través de las capas de roca, más lento en roca dura y caliente, y saca una muestra de núcleo por capa. Avisa cuando el pozo atraviesa una cueva. El pozo se pierde si te mueves.
		#Subterra_Part_TunnelBorer_title = Tuneladora SB-T "Topo"
		#Subterra_Part_TunnelBorer_desc = Excava un túnel redondo de 5 m delante del cabezal mientras la nave está quieta; avanza dentro del túnel nuevo para seguir. Los túneles se guardan en la partida y se abren a las cuevas que alcanzan. Parte de la roca sale como mineral.
		#Subterra_Part_WellPump_title = Bomba de pozo SB-P "Fuente"
		#Subterra_Part_Magazine_title = Polvorín de explosivos SB-X "Barril"
		#Subterra_Part_Magazine_desc = Un polvorín radial de explosivo de voladura para los barrenos de la perforadora SB-1: carga el pozo desde el menú de la perforadora. Mantener lejos del calor y de las voladuras ajenas.
		#Subterra_Part_Tank0625_title = Tanque de explosivo SB-T0 (0,625 m)
		#Subterra_Part_Tank125_title = Tanque de explosivo SB-T1 (1,25 m)
		#Subterra_Part_Tank25_title = Tanque de explosivo SB-T2 (2,5 m)
		#Subterra_Part_Tank_desc = Un tanque en línea de explosivo de voladura para los barrenos de la perforadora. Mantener lejos del calor y de las voladuras ajenas.
		#Subterra_Part_WellPump_desc = Saca agua o explodium de la capa que alcanzó una perforadora de testigos de la misma nave.
		#Subterra_Exp_CoreSample = Muestra de núcleo
		#Subterra_Exp_CoreSample_Result = Un cilindro de roca del fondo del pozo, con bandas y recién cortado.
		#Subterra_Exp_Core_Regolith = El testigo sale como polvo suelto con perlas de vidrio: suelo removido por eras de pequeños impactos.
		#Subterra_Exp_Core_Megaregolith = Bloques destrozados unidos por harina de roca: los escombros profundos de los grandes impactos antiguos.
		#Subterra_Exp_Core_MareBasalt = Basalto oscuro de grano fino con burbujas de gas atrapadas: un viejo mar de lava enfriado hace mucho.
		#Subterra_Exp_Core_AnorthositeBreccia = Fragmentos claros, ricos en feldespato y soldados entre sí: la corteza antigua de las tierras altas, rota y vuelta a pegar.
		#Subterra_Exp_Core_Basalt = Un testigo de basalto denso y oscuro: lava que fluyó, se enfrió y quedó enterrada.
		#Subterra_Exp_Core_VolcanicBasalt = Basalto en capas finas, cada una una colada: la historia del volcán leída de abajo arriba.
		#Subterra_Exp_Core_IslandBasalt = Basalto joven con cristales frescos de olivino: las islas crecieron con estas coladas.
		#Subterra_Exp_Core_Granite = Cristales gruesos rosados y grises: roca que se enfrió despacio en lo hondo de la corteza.
		#Subterra_Exp_Core_Limestone = Caliza gris fina llena de conchitas: un antiguo fondo marino, ahora lejos de cualquier mar.
		#Subterra_Exp_Core_Sandstone = Granos de arena redondeados en franjas: dunas o lechos de río convertidos en piedra.
		#Subterra_Exp_Core_Sediments = Capas blandas de limo y arcilla: lo que el viento y el agua depositaron año tras año.
		#Subterra_Exp_Core_LayeredSediments = Cientos de franjas finas, claras y oscuras: el registro de estaciones que ya no existen.
		#Subterra_Exp_Core_Evaporites = Cristales de sal y yeso: aquí se secó un mar, una y otra vez.
		#Subterra_Exp_Core_Soil = Tierra oscura y desmenuzable con raíces y arenilla: la piel viva del suelo.
		#Subterra_Exp_Core_DeepCrust = Roca metamórfica densa y caliente, plegada por la presión: las raíces profundas de la corteza.
		#Subterra_Exp_Core_LowerCrust = Roca pesada y oscura, caliente incluso en el portamuestras: ya cerca del manto.
		#Subterra_Exp_Core_MagmaChamberRoof = Roca vidriosa cocida por el calor de abajo: el techo de una cámara de magma.
		#Subterra_Exp_Core_UpperMantle = Olivino verde y piroxeno, todavía incandescentes: el manto, alcanzado con un taladro.
		#Subterra_Exp_Core_Mantle = Roca verde y densa del manto, que fluye despacio a lo largo de las eras.
		#Subterra_Exp_Core_LowerMantle = Cristales densísimos que ninguna roca de la superficie tiene: el manto profundo.
		#Subterra_Exp_Core_RockyMantle = Roca silicatada oscura bajo el hielo: el interior pétreo de la luna.
		#Subterra_Exp_Core_RockyCore = Roca oscura bajo todo el hielo: el corazón rocoso de este mundo helado.
		#Subterra_Exp_Core_Core = Hierro y níquel, de una densidad increíble: un trozo del propio núcleo.
		#Subterra_Exp_Core_IceRegolith = Granos de hielo y polvo apelmazados: el suelo escarchado de un mundo helado.
		#Subterra_Exp_Core_WaterIce = Hielo de agua claro y duro con burbujitas: congelado desde hace eras.
		#Subterra_Exp_Core_DirtyIce = Hielo veteado de polvo oscuro y mugre orgánica.
		#Subterra_Exp_Core_IcyCrust = Hielo y roca mezclados en capas: una corteza que se heló y deshizo muchas veces.
		#Subterra_Exp_Core_IcyBreccia = Hielo y roca rotos, vueltos a congelar juntos por impactos antiguos.
		#Subterra_Exp_Core_IceShell = Hielo más antiguo cuanto más hondo: el caparazón sobre el océano.
		#Subterra_Exp_Core_MintIce = Hielo verde pálido, con un leve aroma a menta: el extraño hielo de Minmus.
		#Subterra_Exp_Core_PolarIce = Hielo polar en capas, cada franja una estación de escarcha.
		#Subterra_Exp_Core_Rubble = Bloques sueltos y huecos: un montón de escombros que la gravedad apenas mantiene unido.
