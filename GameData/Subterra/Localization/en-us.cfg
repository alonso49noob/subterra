		// Part 6: subsurface radar
		#Subterra_Part_Eco_title = SR-E "Eco" Radar Sounder
		#Subterra_Part_Eco_desc = A long low-frequency dipole that listens for radar echoes from beneath the surface. Fly it in orbit between 10 and 250 km, best at 30 km: voids and caves large enough to answer show up as hints on the map.
		#Subterra_Part_Plomada_title = SG-P "Plomada" Gravimeter
		#Subterra_Part_Plomada_desc = Measures tiny changes in the pull of gravity along the ground track. A cave or tunnel is missing mass, so it shows as a weak spot. Fly it in orbit between 10 and 200 km, best at 30 km.
