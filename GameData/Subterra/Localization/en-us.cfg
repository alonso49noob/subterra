		// Sub-project 2: drills, borers, pumps
		#Subterra_Part_Manufacturer = Subterra Geoworks
		#Subterra_Part_CoreDrill_title = SB-1 "Auger" Core Drill
		#Subterra_Part_CoreDrill_desc = Bores a narrow hole straight down through the rock layers, slower in hard and hot rock, and brings up one core sample per layer. Tells you when the hole breaks into a cave. The hole is lost if you move.
		#Subterra_Part_TunnelBorer_title = SB-T "Mole" Tunnel Borer
		#Subterra_Part_TunnelBorer_desc = Digs a 5 m round tunnel ahead of its head while the vessel stands still; drive into the new tunnel to dig on. Tunnels are kept in the save and open into the caves they reach. Part of the rock comes out as Ore.
		#Subterra_Part_WellPump_title = SB-P "Spring" Well Pump
		#Subterra_Part_Magazine_title = SB-X "Powder Keg" Explosive Magazine
		#Subterra_Part_Magazine_desc = A radial magazine of blasting explosive for the SB-1 core drill's blast holes: load the hole from the drill's menu. Keep it away from heat and from other people's blasts.
		#Subterra_Part_Tank0625_title = SB-T0 Explosive Tank (0.625 m)
		#Subterra_Part_Tank125_title = SB-T1 Explosive Tank (1.25 m)
		#Subterra_Part_Tank25_title = SB-T2 Explosive Tank (2.5 m)
		#Subterra_Part_Tank_desc = An inline tank of blasting explosive for the core drill's blast holes. Keep it away from heat and from other people's blasts.
		#Subterra_Part_WellPump_desc = Draws water or explodium from the layer a core drill on the same vessel has reached.
		#Subterra_Exp_CoreSample = Core Sample
		#Subterra_Exp_CoreSample_Result = A cylinder of rock from the bottom of the hole, banded and fresh.
		#Subterra_Exp_Core_Regolith = The core comes up as loose, sorted dust and glassy beads: soil churned by ages of small impacts.
		#Subterra_Exp_Core_Megaregolith = Shattered blocks cemented in rock flour: the deep rubble left by the great early impacts.
		#Subterra_Exp_Core_MareBasalt = Dark, fine-grained basalt with gas bubbles frozen in it: an old sea of lava, cooled long ago.
		#Subterra_Exp_Core_AnorthositeBreccia = Pale, feldspar-rich fragments welded together: the ancient highland crust, broken and reglued.
		#Subterra_Exp_Core_Basalt = A dense, dark basalt core: lava that flowed, cooled and was buried.
		#Subterra_Exp_Core_VolcanicBasalt = Basalt in thin layers, each a lava flow: the volcano's history read from the bottom up.
		#Subterra_Exp_Core_IslandBasalt = Young basalt with fresh olivine crystals: the islands grew from these flows.
		#Subterra_Exp_Core_Granite = Coarse pink and grey crystals: rock that cooled slowly deep in the crust.
		#Subterra_Exp_Core_Limestone = Fine grey limestone full of tiny shells: an old seabed, now far from any sea.
		#Subterra_Exp_Core_Sandstone = Rounded grains of sand in bands: dunes or riverbeds turned to stone.
		#Subterra_Exp_Core_Sediments = Soft layers of silt and clay: what wind and water laid down, year after year.
		#Subterra_Exp_Core_LayeredSediments = Fine bands, light and dark, by the hundred: a record of seasons long gone.
		#Subterra_Exp_Core_Evaporites = Salt crystals and gypsum: a sea dried out here, again and again.
		#Subterra_Exp_Core_Soil = Dark, crumbly soil with roots and grit: the living skin of the ground.
		#Subterra_Exp_Core_DeepCrust = Hot, dense metamorphic rock, squeezed into folds: the crust's deep roots.
		#Subterra_Exp_Core_LowerCrust = Heavy, dark rock, hot to the touch even in the sample case: close to the mantle now.
		#Subterra_Exp_Core_MagmaChamberRoof = Glassy rock baked by heat from below: the roof of a magma chamber.
		#Subterra_Exp_Core_UpperMantle = Green olivine and pyroxene, still glowing: the mantle, reached by a drill.
		#Subterra_Exp_Core_Mantle = Dense green rock from the mantle, slowly flowing over ages.
		#Subterra_Exp_Core_LowerMantle = Extremely dense crystals no surface rock has: the deep mantle.
		#Subterra_Exp_Core_RockyMantle = Dark silicate rock under the ice: the moon's stony interior.
		#Subterra_Exp_Core_RockyCore = Dark rock under all the ice: the rocky heart of this icy world.
		#Subterra_Exp_Core_Core = Iron and nickel, impossibly dense: a piece of the core itself.
		#Subterra_Exp_Core_IceRegolith = Ice grains and dust packed together: the frosty soil of an icy world.
		#Subterra_Exp_Core_WaterIce = Clear, hard water ice with tiny bubbles: frozen for ages.
		#Subterra_Exp_Core_DirtyIce = Ice streaked with dark dust and organic grime.
		#Subterra_Exp_Core_IcyCrust = Ice and rock mixed in layers: a crust that froze and thawed many times.
		#Subterra_Exp_Core_IcyBreccia = Broken ice and rock frozen back together by old impacts.
		#Subterra_Exp_Core_IceShell = Ice older the deeper it goes: the shell over the ocean.
		#Subterra_Exp_Core_MintIce = Pale green ice, faintly minty: the strange ice of Minmus.
		#Subterra_Exp_Core_PolarIce = Layered polar ice, each band a season of frost.
		#Subterra_Exp_Core_Rubble = Loose blocks and voids: a pile of rubble barely held together by gravity.
