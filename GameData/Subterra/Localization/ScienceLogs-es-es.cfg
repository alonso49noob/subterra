// Registros de ciencia de Subterra (Lucas: uno por bioma subterráneo, con información y lore). Los lee ScienceLogs.cs:
// #Subterra_Log_<experimento>_<zona> (variantes _2, _3), si no #Subterra_Log_Any_<zona>; el #Subterra_Lore_<sitio> de un sitio
// con nombre tras los informes de tripulación, EVA y muestra; testigos #Subterra_Exp_Core_<capa>, si no #Subterra_Exp_Core_Kind_<tipo>.
// <<1>> es el cuerpo.
Localization
{
	es-es
	{
		#Subterra_Biome_SubsurfaceOcean = Océano subsuperficial
		#Subterra_Log_Core_Data = Capa de <<1>> a <<2>> m de profundidad. Dureza <<3>>, densidad <<4>> t/m³, unos <<5>> K en su mitad. Contiene: <<6>>.
		#Subterra_Log_Core_Nothing = nada que valga la pena bombear
		#Subterra_Log_Heading = <<1>> · <<2>>, <<3>>
		#Subterra_Log_CoreHeading = Testigo de roca: <<1>> · <<2>>
		#Subterra_Log_Reading = LECTURA
		#Subterra_Log_Meaning = QUÉ SIGNIFICA
		#Subterra_Log_Story = EL LUGAR
		#Subterra_Log_Read_Where = <<1>> m bajo la superficie, en <<2>>
		#Subterra_Log_Read_Temp = Roca a <<1>> K (<<2>> °C); sube unos <<3>> K por kilómetro desde la superficie
		#Subterra_Log_Read_Pressure = Presión <<1>> kPa (<<2>> atm): gas <<3>>, líquido <<4>>, roca <<5>> kPa
		#Subterra_Log_Read_Gravity = Gravedad <<1>> m/s², el <<2>> % de la de la superficie (solo atrae la masa que queda más abajo)
		#Subterra_Log_Read_Seismic = Ondas sísmicas a unos <<1>> m/s en esta roca (densidad <<2>> t/m³, dureza <<3>>)
		#Subterra_Log_Read_Sample = Muestra: dureza <<1>>, densidad <<2>> t/m³; contiene <<3>>
		#Subterra_Log_Read_Sky = Cielo visible desde aquí: <<1>> %
		#Subterra_Log_Read_Water = Bajo <<1>> m de agua
		#Subterra_Log_Core_Where = De <<1>> a <<2>> m de profundidad (<<3>> m de espesor)
		#Subterra_Log_Core_Rock = Dureza <<1>>, densidad <<2>> t/m³: un taladro avanza al <<3>> % de su velocidad
		#Subterra_Log_Core_Heat = <<1>> K en su techo, <<2>> K en su base
		#Subterra_Log_Core_Weight = Peso de la roca sobre su mitad: <<1>> kPa (a la escala del PresMat)
		#Subterra_Log_Core_Holds = Contiene: <<1>>

		// --- Pozo de claraboya: el hoyo bajo una claraboya, donde cayó el techo -----------------------------------------
		#Subterra_Log_crewReport_SkylightShaft = Mirando hacia arriba, la tripulación ve un disco de cielo enmarcado en roca dentada. Un cono de escombros del techo caído llena el suelo; los kerbals discuten si se cayó hace un millón de años o el martes pasado.
		#Subterra_Log_evaReport_SkylightShaft = En el fondo de la claraboya, mitad al sol y mitad en sombra negra. Las paredes muestran el techo de la cueva en corte: capa sobre capa de roca que lo sostuvo, hasta que un día dejó de hacerlo.
		#Subterra_Log_surfaceSample_SkylightShaft = Un bloque del techo que se vino abajo, aún con aristas vivas. Una cara está curtida por el cielo; las otras no habían visto más que roca hasta el derrumbe.
		#Subterra_Log_mysteryGoo_SkylightShaft = El goo se pegó al lado del recipiente que da a la luz, y luego al que da a la oscuridad. Parece no decidirse con las cuevas.
		#Subterra_Log_mobileMaterialsLab_SkylightShaft = Las muestras en la penumbra del pozo pasaron del sol a la sombra y vuelta mientras la luz recorría las paredes: una prueba de fatiga gratis, y un pésimo sitio para broncearse.
		#Subterra_Log_temperatureScan_SkylightShaft = Donde cae la luz el suelo se cuece; un paso hacia la sombra y la temperatura se desploma. La claraboya es una puerta entre los extremos de la superficie y la calma de la cueva.
		#Subterra_Log_barometerScan_SkylightShaft = La presión es casi idéntica a la de la superficie: la claraboya es una chimenea abierta, y el aire que haya sube y baja por ella sin estorbo.
		#Subterra_Log_seismicScan_SkylightShaft = El cono de escombros suena distinto de la roca maciza: suelto, asentándose, todavía moviéndose de vez en cuando. El derrumbe que abrió esta claraboya quizá no haya terminado del todo.
		#Subterra_Log_gravityScan_SkylightShaft = Una leve anomalía negativa: el gravímetro nota la masa que falta en la cueva de abajo y de alrededor, el mismo vacío que dejó caer este techo.
		#Subterra_Log_atmosphereAnalysis_SkylightShaft = El aire circula despacio por el pozo: de día sale el aire caliente, de noche entra el frío. La cueva respira por este agujero.
		#Subterra_Log_evaScience_SkylightShaft = Un estudio de las paredes del pozo cartografía las capas del techo. Cada banda es una colada de lava, un fondo marino o una tormenta de polvo que se apilaron mucho antes de que la cueva se abriera debajo.
		#Subterra_Log_Any_SkylightShaft = Medido en el fondo de una claraboya, donde se juntan la superficie y la cueva: mitad un mundo, mitad el otro.

		// --- Galería del tubo: el pasadizo principal ---------------------------------------------------------------------
		#Subterra_Log_crewReport_TubeGallery = La galería sigue hacia la oscuridad más allá del alcance de los focos: paredes lisas, suelo plano, un techo como el interior de una tubería gigante. Lo que pasó por aquí (lava o agua) no tuvo prisa en irse.
		#Subterra_Log_crewReport_TubeGallery_2 = Silencio total, oscuridad total y un suelo tan parejo que podrías aterrizar un avión. La tripulación está de acuerdo en que es el mejor garaje de <<1>>. Nadie está de acuerdo en quién paga el alquiler.
		#Subterra_Log_evaReport_TubeGallery = Recorriendo la galería, el kerbal encuentra líneas en las paredes a distintas alturas: las marcas del nivel del flujo que excavó el tubo, que cuentan cómo subió y bajó antes de vaciarse.
		#Subterra_Log_surfaceSample_TubeGallery = Un raspado de la pared de la galería: una costra vítrea sobre roca más fina. Se formó donde la roca fundida (o el agua que disolvía) tocó la pared durante años.
		#Subterra_Log_mysteryGoo_TubeGallery = En la oscuridad absoluta de la galería el goo empezó a brillar un poco. O al observador le engañaron los ojos. En cualquier caso, ya está en el informe.
		#Subterra_Log_mobileMaterialsLab_TubeGallery = Protegida de la radiación y de los vaivenes del día y la noche, la galería es casi el laboratorio más estable de <<1>>. Los experimentos largos derivan aquí menos que en cualquier punto de la superficie.
		#Subterra_Log_temperatureScan_TubeGallery = La temperatura apenas cambia a lo largo de la galería: la roca de encima suaviza cada día y cada estación. Aquí abajo hace la media anual del terreno, todo el año.
		#Subterra_Log_barometerScan_TubeGallery = Una leve corriente a lo largo de la galería se nota como una mínima diferencia de presión entre sus extremos: la cueva respira por aberturas que nadie ha encontrado aún.
		#Subterra_Log_seismicScan_TubeGallery = Las señales viajan por la galería como por una tubería: el hueco transmite el rumor de impactos y temblores lejanos mucho mejor que la roca maciza.
		#Subterra_Log_gravityScan_TubeGallery = La gravedad en la galería es un pelo más débil que en el suelo de encima: la roca de arriba ahora tira hacia arriba, contra el resto de <<1>> que queda abajo.
		#Subterra_Log_atmosphereAnalysis_TubeGallery = El aire de la galería está quieto, fresco y viciado: el mismo aire de la superficie, más seco, con un poco de lo que rezuma lentamente de la roca.
		#Subterra_Log_evaScience_TubeGallery = El estudio mide la sección de la galería cada pocos metros: se estrecha donde el flujo corría deprisa y se ensancha donde se estancaba.
		#Subterra_Log_Any_TubeGallery = Datos del fondo de una galería, fuera del alcance del sol y resguardada del espacio por decenas de metros de roca.

		// --- Cámara del tubo: una gran sala ------------------------------------------------------------------------------
		#Subterra_Log_crewReport_TubeChamber = Los focos no llegan a la pared del fondo. La cámara retumba: a cada kerbal que habla le contestan otros tres, tres segundos después. Bob preferiría dejar de hablar.
		#Subterra_Log_evaReport_TubeChamber = En el centro de la cámara el techo queda tan alto que bien podría ser el cielo. Bloques del tamaño de casas yacen donde el techo se combó y los soltó, hace mucho.
		#Subterra_Log_surfaceSample_TubeChamber = Del montón de derrumbe del centro de la cámara: trozos del techo, partidos al caer. Sus caras frescas muestran de qué está hecha la roca que queda muy por encima.
		#Subterra_Log_mysteryGoo_TubeChamber = El goo se extendió todo lo que pudo, como intentando llenar la cámara entera. Llegó a unos cuatro centímetros antes de rendirse.
		#Subterra_Log_mobileMaterialsLab_TubeChamber = El tamaño de la cámara permite probar muestras grandes en condiciones quietas, oscuras y estables. Las pruebas de estructura sugieren además que la propia cámara aguanta bien. Por ahora.
		#Subterra_Log_temperatureScan_TubeChamber = La cámara guarda una lenta balsa de aire, algo más fresca junto al suelo y algo más tibia bajo la bóveda: incluso bajo tierra, lo caliente sube.
		#Subterra_Log_barometerScan_TubeChamber = Presión estable, un poco mayor que en la entrada: la cámara está más honda que el pasadizo que lleva a ella.
		#Subterra_Log_seismicScan_TubeChamber = El techo responde a cada golpe con un zumbido largo y grave: toda la bóveda resuena. A los ingenieros les gustaría saber exactamente cuánto mide de grosor.
		#Subterra_Log_gravityScan_TubeChamber = Una clara anomalía negativa sobre la cámara: aquí falta mucha roca. Vistas desde órbita, salas como esta aparecen como hondonadas suaves en el campo.
		#Subterra_Log_atmosphereAnalysis_TubeChamber = El aire quieto de la cámara está en capas: los gases más pesados se asientan en los huecos del suelo. Los cascos se quedan puestos.
		#Subterra_Log_evaScience_TubeChamber = Medido de punta a punta, el techo salva una luz mayor de la que ninguna roca debería salvar cómodamente. Lo sostiene la forma del arco, con ayuda de la gravedad de <<1>>.
		#Subterra_Log_Any_TubeChamber = Datos de una gran cámara subterránea, donde la cueva se ensanchó antes de volver a estrecharse.

		// --- Ramal del tubo: un pasadizo lateral -------------------------------------------------------------------------
		#Subterra_Log_crewReport_TubeBranch = Un pasadizo más estrecho sale de la galería y se pierde de vista. La tripulación pinta una flecha en la pared para que nadie se pierda. Luego una segunda flecha, apuntando a la primera.
		#Subterra_Log_evaReport_TubeBranch = El ramal es estrecho: el kerbal toca las dos paredes a la vez. Su suelo está más bajo que el de la galería: el flujo encontró otro camino y abandonó el viejo.
		#Subterra_Log_surfaceSample_TubeBranch = Roca de la pared de un ramal: más fina y densa que en la galería, enfriada más rápido en el canal estrecho.
		#Subterra_Log_mysteryGoo_TubeBranch = El goo se escurrió al rincón más bajo del recipiente, como buscando por dónde sigue el ramal.
		#Subterra_Log_mobileMaterialsLab_TubeBranch = En el ramal angosto las muestras quedaron pegadas a la pared, donde manda el calor constante de la roca: buen sitio para estudiar cómo se empapa algo de calor despacio.
		#Subterra_Log_temperatureScan_TubeBranch = El ramal está un poco más frío que la galería: por él circula menos aire y queda más lejos de cualquier abertura.
		#Subterra_Log_barometerScan_TubeBranch = Ni la menor corriente: el ramal quizá acabe ciego, o se comunique con el resto del sistema solo por grietas demasiado finas para verlas.
		#Subterra_Log_seismicScan_TubeBranch = Los ecos del fondo del ramal vuelven antes de lo esperado: no sigue para siempre. O gira. Una de dos.
		#Subterra_Log_gravityScan_TubeBranch = Apenas cambia la gravedad en el ramal: es demasiado estrecho para dejar mucho hueco en el campo. Aquí solo cuenta la profundidad.
		#Subterra_Log_atmosphereAnalysis_TubeBranch = El aire más viciado de la cueva: los fondos ciegos atrapan los gases que rezuman de la roca y los guardan durante eras.
		#Subterra_Log_evaScience_TubeBranch = Siguiendo el ramal, el kerbal anota dónde se divide y vuelve a juntarse: un dibujo trenzado, como el delta de un río en piedra.
		#Subterra_Log_Any_TubeBranch = Datos de un ramal de la cueva, un pasadizo estrecho que sale de la galería principal.

		// --- Bóveda helada: una trampa fría forrada de hielo -------------------------------------------------------------
		#Subterra_Log_crewReport_FrozenVault = Todo está cubierto de escarcha que centellea con los focos. La bóveda es una trampa fría: el agua que entra ya no sale. Jeb quiere montar una pista de hockey.
		#Subterra_Log_evaReport_FrozenVault = Las botas del kerbal crujen sobre cristales de hielo que crecieron durante eras, molécula a molécula, del más leve susurro de vapor. Algunos son largos como un dedo.
		#Subterra_Log_surfaceSample_FrozenVault = Hielo raspado del suelo de la bóveda: capas de escarcha con polvo fino entre ellas, un registro de cada vez que la cueva respiró un poco de humedad.
		#Subterra_Log_mysteryGoo_FrozenVault = El goo se puso rígido con el frío y se negó a moverse. Varios kerbals lo entendieron perfectamente.
		#Subterra_Log_mobileMaterialsLab_FrozenVault = El lugar estable más frío de la zona: las muestras guardadas aquí cambian solo al ritmo del propio hielo. Un congelador más viejo que el programa espacial.
		#Subterra_Log_temperatureScan_FrozenVault = Más frío que la roca que lo rodea y que la galería que lleva a él: el aire frío baja a la bóveda y se queda, y el hielo guarda el frío.
		#Subterra_Log_barometerScan_FrozenVault = Aquí la presión la pone la escarcha: cuanto más fría la bóveda, menos vapor suelta el hielo y más tenue es el aire sobre él.
		#Subterra_Log_seismicScan_FrozenVault = El hielo amortigua las señales como una manta sobre la roca. Su grosor se lee en cuánto se apagan los ecos.
		#Subterra_Log_gravityScan_FrozenVault = El hielo pesa un tercio que la roca: el suelo helado de la bóveda hace la anomalía un poco más honda que la de un hueco vacío.
		#Subterra_Log_atmosphereAnalysis_FrozenVault = Aire seco y gélido con trazas de lo que atrapa el hielo: gases antiguos encerrados en la escarcha mientras crecía.
		#Subterra_Log_evaScience_FrozenVault = Los testigos de hielo del suelo muestran bandas como los anillos de un árbol: épocas en que entró más humedad y épocas en que casi no entró nada.
		#Subterra_Log_Any_FrozenVault = Datos de una bóveda helada, una trampa fría donde el hielo se ha acumulado sin que nadie lo toque durante eras.

		// --- Túnel excavado: un agujero hecho por kerbals ----------------------------------------------------------------
		#Subterra_Log_crewReport_Excavation = Las paredes aún muestran las marcas de las herramientas, o de la voladura, que las cortaron. Nadie había visto nunca esta roca: estaba a oscuras desde que se formó <<1>>.
		#Subterra_Log_evaReport_Excavation = Roca recién rota por todas partes: aristas vivas, caras limpias, sin polvo todavía. El kerbal lee las capas de la pared como las páginas de un libro que nadie abrió.
		#Subterra_Log_surfaceSample_Excavation = Una muestra intacta, que no ha tocado el espacio, el agua ni el aire: directa del interior de la roca, tal como se formó.
		#Subterra_Log_mysteryGoo_Excavation = El goo parece inquieto, como si la excavación aún resonara en las paredes. O tiene opiniones sobre las perforaciones.
		#Subterra_Log_mobileMaterialsLab_Excavation = La roca recién cortada es reactiva: las muestras junto a las paredes recogen una película tenue de los minerales recién expuestos. Química interesante, contaminación molesta.
		#Subterra_Log_temperatureScan_Excavation = La roca está aquí a su temperatura natural para esta profundidad, sin aire de cueva que la cambie. Los túneles más hondos serán más calientes: el terreno se calienta al bajar.
		#Subterra_Log_barometerScan_Excavation = El túnel solo tiene el aire que entró desde la superficie, o el que trajeron los kerbals: un tubo recién hecho de casi nada.
		#Subterra_Log_seismicScan_Excavation = Las grietas nuevas del túnel aún se asientan con chasquidos y crujidos mientras la roca se acomoda al hueco. Los ingenieros dicen que es normal. Los demás dicen que da mal rollo.
		#Subterra_Log_gravityScan_Excavation = Aquí la gravedad depende solo de la profundidad: cuanto más hondo el túnel, más de <<1>> queda encima tirando hacia arriba, y menos tira hacia abajo.
		#Subterra_Log_atmosphereAnalysis_Excavation = El aire lleva polvo de roca y un tufillo a explosivo: una neblina fina que tardará semanas en asentarse.
		#Subterra_Log_evaScience_Excavation = El kerbal registra las paredes metro a metro: el primer mapa de una roca que ningún ojo había visto.
		#Subterra_Log_Any_Excavation = Datos de un túnel excavado por kerbals: roca abierta a la luz por primera vez.

		// --- Geoda: una sala sellada de cristales ------------------------------------------------------------------------
		#Subterra_Log_crewReport_Geode = Cristales tan grandes como kerbals cubren las paredes y destellan en todos los colores que dan los focos. Nadie habla durante un minuto entero. Luego hablan todos a la vez.
		#Subterra_Log_evaReport_Geode = De cerca los cristales son transparentes, con otros más pequeños crecidos sobre los grandes, y algunos guardan burbujas de líquido: gotas del agua caliente de la que crecieron, selladas hace eras.
		#Subterra_Log_surfaceSample_Geode = Una punta de cristal arrancada de la pared. Dentro, diminutos bolsillos de líquido: la misma agua en la que nació esta sala. Su química dice cuándo ocurrió y a qué temperatura.
		#Subterra_Log_mysteryGoo_Geode = El goo adquirió un leve brillo cristalino. Quizá quedó impresionado. Quizá intentaba encajar.
		#Subterra_Log_mobileMaterialsLab_Geode = Los cristales son casi perfectos: crecieron despacio y sin perturbaciones en una sala sellada. Su estructura es una lección de paciencia para cualquier científico de materiales.
		#Subterra_Log_temperatureScan_Geode = La geoda está exactamente a la temperatura de la roca de alrededor: nunca entró aire que la cambiara. Los cristales crecieron cuando hacía mucho más calor.
		#Subterra_Log_barometerScan_Geode = La presión es la que haya entrado por el agujero: hasta que se abrió, la geoda era una burbuja sellada que solo contenía sus cristales.
		#Subterra_Log_seismicScan_Geode = La geoda suena como una campana. Un hueco forrado de cristales duros dentro de roca maciza es, sísmicamente hablando, un instrumento musical.
		#Subterra_Log_gravityScan_Geode = Una anomalía negativa pequeña y nítida: un vacío sellado, el tipo de objetivo que un estudio gravimétrico encuentra antes que cualquier taladro.
		#Subterra_Log_atmosphereAnalysis_Geode = Trazas de gas liberado por las inclusiones líquidas de los cristales al abrir la sala: el aliento del agua que hizo la geoda.
		#Subterra_Log_evaScience_Geode = Tamaños de cristal medidos por toda la sala: los mayores en el centro de cada pared, los menores en las esquinas, adonde el agua cargada de minerales llegaba menos.
		#Subterra_Log_Any_Geode = Datos del interior de una geoda, una sala sellada de cristales que crecieron en la oscuridad.

		// --- Lago subglacial ---------------------------------------------------------------------------------------------
		#Subterra_Log_crewReport_SubglacialLake = Agua negra bajo un techo de hielo, perfectamente quieta. Los focos se reflejan en ella como en un espejo. Ha estado líquida, sellada y a oscuras desde mucho antes de que ningún kerbal mirara al cielo.
		#Subterra_Log_evaReport_SubglacialLake = En la orilla, el hielo de arriba brilla con un azul tenue. El kerbal mete un guante: fría, pero líquida, gracias al peso del hielo de encima y al calor de la roca de abajo.
		#Subterra_Log_surfaceSample_SubglacialLake = Agua del lago: limo fino, sales disueltas, minerales lavados del suelo de roca. Si algo ha vivido alguna vez en <<1>>, es en sitios como este donde se escondería.
		#Subterra_Log_mysteryGoo_SubglacialLake = El goo se disolvió un poco en el agua del lago y luego se recompuso, con cara de suficiencia.
		#Subterra_Log_mobileMaterialsLab_SubglacialLake = Las muestras empapadas en el lago muestran qué hacen eras de contacto con agua sellada a la roca y al metal: corrosión lenta y constante, sin que ninguna ola la agite nunca.
		#Subterra_Log_temperatureScan_SubglacialLake = El agua está apenas por encima de su punto de congelación. El hielo aprieta tanto que se funde en su base: al lago lo calienta la roca desde abajo y lo tapa el hielo desde arriba.
		#Subterra_Log_barometerScan_SubglacialLake = Aquí la presión es el peso del hielo de encima, cientos de metros de él, empujando sobre el agua.
		#Subterra_Log_seismicScan_SubglacialLake = El fondo del lago refleja las señales con nitidez: un lecho plano de sedimento bajo el agua, depositado grano a grano en calma total.
		#Subterra_Log_gravityScan_SubglacialLake = El agua pesa menos que la roca y más que el hielo: el lago aparece como una anomalía sutil bajo el casquete, que es como se encuentran estos lagos desde órbita.
		#Subterra_Log_atmosphereAnalysis_SubglacialLake = El aire sobre el agua está saturado de humedad y cargado de gases que burbujearon del lago al abrirlo.
		#Subterra_Log_evaScience_SubglacialLake = Sondeos por todo el lago cartografían su fondo: una cubeta lisa, más honda donde el hielo de encima es más grueso.
		#Subterra_Log_Any_SubglacialLake = Datos de un lago sellado bajo el hielo, líquido en la oscuridad durante eras.

		// --- Océano subsuperficial ---------------------------------------------------------------------------------------
		#Subterra_Log_crewReport_SubsurfaceOcean = Al otro lado de las ventanillas: nada. Ni suelo abajo ni superficie arriba, solo agua oscura en todas direcciones y el techo de hielo muy por encima. La tripulación está muy callada.
		#Subterra_Log_evaReport_SubsurfaceOcean = Flotando en el océano de <<1>>, el kerbal ve cómo la luz de los focos se apaga en la oscuridad a pocos metros. En algún lugar arriba está la cara inferior del hielo; en algún lugar abajo, el fondo marino.
		#Subterra_Log_surfaceSample_SubsurfaceOcean = Una muestra del océano: salada, fría, llena de minerales disueltos del suelo de roca muy por debajo. Toda el agua de un mundo que nadie había probado jamás.
		#Subterra_Log_mysteryGoo_SubsurfaceOcean = En el océano oscuro el goo latía despacio, como al compás de algo muy lejano. Los kerbals acordaron no ponerlo en el informe. Demasiado tarde.
		#Subterra_Log_mobileMaterialsLab_SubsurfaceOcean = Las muestras expuestas al agua helada y aplastante del océano muestran cómo aguantarán los cascos en inmersiones largas. La respuesta: más vale que sean gruesos.
		#Subterra_Log_temperatureScan_SubsurfaceOcean = Unos pocos grados sobre la congelación: más tibia junto al fondo, donde la calienta la roca, y más fría bajo el hielo. Corrientes lentas suben y bajan entre los dos.
		#Subterra_Log_barometerScan_SubsurfaceOcean = La presión ahí fuera es todo el peso del hielo y del agua de encima, y crece con cada metro que se baja.
		#Subterra_Log_seismicScan_SubsurfaceOcean = El sonido llega a kilómetros en el océano: el techo de hielo cruje y gime mientras las mareas lo flexionan, un coro lejano y constante.
		#Subterra_Log_gravityScan_SubsurfaceOcean = El océano es una capa más ligera entre el hielo y la roca: cuán hondo y cuán salado es se puede deducir solo con la gravedad.
		#Subterra_Log_atmosphereAnalysis_SubsurfaceOcean = Gases disueltos en el océano, medidos mientras burbujean de la muestra: una química hecha por el agua y la roca en contacto, aislada del cielo.
		#Subterra_Log_evaScience_SubsurfaceOcean = Agua tomada a varias profundidades: cuanto más honda, más salada y más tibia. El océano está en capas, y se remueve despacio.
		#Subterra_Log_Any_SubsurfaceOcean = Datos del océano bajo la corteza de <<1>>: un mar entero que nunca ha visto el sol.

		// --- Sitios con nombre: su lore ----------------------------------------------------------------------------------
		#Subterra_Lore_KscCave = La Cueva del KSC, a un paseo en rover de la pista: la primera cueva que ven casi todos los programas espaciales. Gene Kerman insiste en que la "descubrió" una prueba de rover que se salió del camino.
		#Subterra_Lore_KerbinGreatHall = El Gran Salón: una cámara que el agua subterránea disolvió en la caliza durante cientos de miles de años, con entrada por una dolina en las tierras altas al norte del KSC.
		#Subterra_Lore_KerbinCenotes = Los Cenotes de la Costa: dolinas donde se hundió el techo de una cueva inundada, abriendo ventanas de agua clara cerca de la orilla. Los kerbals antiguos las tomaban por puertas a otro mundo. Tenían algo de razón.
		#Subterra_Lore_KerbinKimberlite = La Chimenea de Kimberlita: un conducto abierto desde el manto por una erupción violenta, impulsada por gases. Las kimberlitas suben diamantes desde muy hondo; esta baja en espiral durante kilómetros, y bajo su fondo hay algo sellado.
		#Subterra_Lore_KerbinDeepGeode = La Geoda Profunda: una sala de cristales sellada muy por debajo de la Chimenea de Kimberlita, crecida de agua cargada de minerales que calentaba el viejo conducto volcánico.
		#Subterra_Lore_KerbinLakeKostok = El Lago Kostok: agua líquida a dos kilómetros bajo el hielo del polo sur, aislada del cielo quizá desde hace millones de años. Su agua es la más antigua de Kerbin.
		#Subterra_Lore_KerbinWhillansLake = El Lago Whillans: una película de agua de pocos metros de hondo extendida bajo 4,5 km de hielo, con el techo casi tocando el fondo. Se llena y se vacía cada pocos años, levantando metros el hielo de encima, y es todo barro y agua lenta.
		#Subterra_Lore_KerbinEllsworthChain = La Cadena Ellsworth: tres lagos en fila bajo el hielo polar, unidos por canales, con el agua de deshielo pasando despacio del primero al último.
		#Subterra_Lore_DunaNorthBrines = Las Bolsas de Salmuera del Norte: lagos pequeños de una salmuera tan salada que sigue líquida con el frío, ensartados en canales bajo el casquete norte de Duna.
		#Subterra_Lore_DunaSouthBrineFilm = La Película de Salmuera del Sur: una lámina de salmuera de pocos metros de hondo y kilómetros de ancho que brilla bajo el hielo austral.
		#Subterra_Lore_LaytheWhillansLake = El Lago Fino: una lámina ancha de agua de pocos metros de hondo bajo el hielo norte de Laythe, calentada desde abajo por las mareas de Jool.
		#Subterra_Lore_LaytheLakeChain = La Cadena de Lagos: tres lagos bajo el casquete norte de Laythe unidos por canales de agua, cada uno un poco más hondo que el anterior.
		#Subterra_Lore_KerbinVerneRoute = La Ruta Verne: por el cráter de un volcán dormido, a lo largo de un tubo antiguo hasta el Mar de Lidenbrock (una caverna inundada a tres kilómetros bajo tierra) y de vuelta arriba por un segundo volcán. Una vieja historia cuenta que un profesor y su sobrino hicieron este viaje. Los kerbals dan por hecho que era un profesor kerbal.
		#Subterra_Lore_SerenitySkylight = La Claraboya Serenidad: la primera claraboya vista en la Mun, un pozo en el mar que se abre a un tubo de lava. Su descubrimiento mandó a todos los planificadores de misiones de vuelta a la mesa de dibujo.
		#Subterra_Lore_GreatGallery = La Gran Galería: uno de los tubos de lava más largos de la Mun, kilómetros bajo el mar oscuro. Con la poca gravedad de la Mun, los tubos crecen mucho más anchos de lo que podrían en Kerbin.
		#Subterra_Lore_KermanChain = La Cadena Kerman: una fila de pozos de colapso a lo largo de un tubo de lava enterrado, como cuentas en un hilo, cada uno donde cedió el techo.
		#Subterra_Lore_Frostvault = Bóveda Escarcha: un tubo forrado de hielo cerca del polo de la Mun, donde el sol nunca entra. El hielo de agua se fue acumulando durante eras: un tesoro para quien piense quedarse.
		#Subterra_Lore_KermanRille = El Surco Kerman: un canal sinuoso excavado por lava que corría, techado en parte: un tubo de lava al que le falta media tapa.
		#Subterra_Lore_DunaCatena = La Catena de Duna: una fila recta de pozos de diez kilómetros sobre un tubo de lava enterrado, como las cadenas de pozos de los flancos de los volcanes viejos en otros lugares del sistema de Kerbol.
		#Subterra_Lore_DunaVolcanoTubes = Tubos del Volcán: tubos por el flanco de un volcán en escudo dormido, por donde la lava corrió en canales aislados decenas de kilómetros antes de llegar a las llanuras.
		#Subterra_Lore_DunaPolarIce = Cueva del Hielo Polar: un tubo bajo el casquete norte de Duna, con las paredes escarchadas. El aire atrapado en su hielo es una muestra del cielo de Duna de hace eras, cuando quizá era más denso.
		#Subterra_Lore_DunaCanyonCaves = Cuevas del Cañón: cámaras bajas y anchas bajo el suelo del Cañón Central, abiertas donde el agua corrió, o se filtró, por la roca en capas del cañón.
		#Subterra_Lore_DunaSouthPolarLake = El Lago del Polo Sur: una lente de salmuera fría a más de un kilómetro bajo el hielo austral. La sal la mantiene líquida muy por debajo del punto de congelación del agua dulce. El radar la encontró antes que ningún kerbal.
		#Subterra_Lore_IkeTrench = La Fosa de Ike: una larga grieta abierta por las mareas que Duna levanta en su luna, techada en algunos tramos. A Ike la están estirando poco a poco.
		#Subterra_Lore_TyloGreatSystem = El Gran Sistema de Tylo: tubos de lava hondos y anchos bajo los mares llanos, con salas como catedrales. La gravedad de Tylo es fuerte, pero su roca también. Y bajo todo ello hay un océano.
		#Subterra_Lore_TyloHighlandCaves = Cuevas de las Tierras Altas: cuevas más pequeñas en las viejas tierras altas de Tylo, rotas y vueltas a soldar por los impactos, más antiguas que los mares y más difíciles de leer.
		#Subterra_Lore_MinmusFlatsGallery = La Galería de las Llanuras: una cueva ancha y baja en el hielo bajo las Grandes Llanuras, de cuando aquel lago helado era líquido.
		#Subterra_Lore_MinmusIceCaves = Cuevas de Hielo de las Laderas: un tubo sinuoso en el hielo de menta bajo las laderas de Minmus. La luz del día se filtra por su techo fino y tiñe de verde las paredes.
		#Subterra_Lore_MinmusCentralGeode = La Geoda Central: una cámara de cristales sellada a cuarenta metros bajo las tierras altas, encontrada por radar. En Minmus hasta los cristales parecen un poco mentolados.
		#Subterra_Lore_MinmusMintLake = El Lago de Menta: agua líquida colgada en el hielo de Minmus sobre su océano, delatada por el domo criovolcánico que tiene encima y el penacho que sale de su cima.
		#Subterra_Lore_Mohole = El Mohole: el techo hundido de una enorme cámara magmática vaciada en el polo de Moho. Sus paredes bajan en espiral durante kilómetros. Los científicos que le pusieron nombre insisten en que el chiste no fue a propósito.
		#Subterra_Lore_MohoPlainsTubes = Tubos de las Llanuras: tubos de lava bajo las llanuras abrasadas de Moho, donde la roca nunca deja de estar caliente.
		#Subterra_Lore_MohoThermalRefuge = Refugio Térmico: una cámara honda y cerrada a temperatura constante, a salvo de los días y las noches brutales de Moho. La habitación más cómoda tan cerca del sol.
		#Subterra_Lore_EveAquifer = El Acuífero de Explodium: un pasadizo kárstico medio inundado de explodium, el líquido volátil que disuelve la roca de Eve como el agua disuelve la caliza. Bombas bienvenidas; llamas, no.
		#Subterra_Lore_EveSaltDome = El Domo de Sal: una columna de sal antigua que subió por la corteza de Eve como la cera de una lámpara de lava, empujando hacia arriba la roca de encima.
		#Subterra_Lore_LaytheIslandTube = El Tubo de la Isla: un tubo de lava bajo una de las islas volcánicas de Laythe, que baja hacia el mar. Su extremo del lado del mar está inundado.
		#Subterra_Lore_LaytheNorthPolarLake = El Lago del Polo Norte: agua bajo el hielo norte de Laythe, líquida gracias al calor que las mareas de Jool bombean en la luna.
		#Subterra_Lore_DresCanyonCaves = Cuevas del Cañón: cuevas en las paredes de los grandes cañones de Dres, grietas abiertas cuando algo muy grande chocó contra el planeta enano.
		#Subterra_Lore_GillyTunnel = El Túnel de Gilly: un hueco sinuoso entre los bloques que forman Gilly, abierto por los dos extremos. Gilly es menos una luna que un montón suelto de rocas volando en formación.
		#Subterra_Lore_BopCavern = La Caverna de Bop: un vacío enorme en el hielo sucio del que está hecho Bop. Bop es probablemente un cometa capturado, ahuecado por eras de desgasificación.
		#Subterra_Lore_BopKrakenChamber = La Cámara Antigua: una cavidad inmensa en lo hondo de Bop, y en ella, algo grande y viejo. La tripulación informa de que "definitivamente no se mueve". Se les ha pedido que sigan comprobándolo.
		#Subterra_Lore_VallIceCaves = Cuevas de Hielo de Vall: tubos en la corteza de hielo de Vall, flexionados cada día por las mareas de Jool. Se abren y se cierran fracciones de milímetro, crujiendo sin parar.
		#Subterra_Lore_VallThera = El Lago Thera: una lente de agua líquida colgada en la corteza de hielo de Vall, como las que se cree que hay bajo los terrenos caóticos de las lunas heladas. Su chimenea criovolcánica lo delata desde órbita.
		#Subterra_Lore_VallThrace = El Lago Thrace: un segundo lago colgado en el hielo de Vall, señalado por un domo donde el agua empuja hacia arriba el hielo de encima.
		#Subterra_Lore_EelooIceCaves = Cuevas de Hielo de Eeloo: cuevas en la corteza helada del mundo más lejano, donde el sol es solo una estrella brillante.
		#Subterra_Lore_EelooGeyserLake = El Lago del Géiser: una bolsa de líquido en lo hondo del hielo de Eeloo, que escapa al espacio por un géiser. Hasta el mundo más frío del sistema está caliente por dentro.
		#Subterra_Lore_PolIceCaves = Cuevas de Hielo de Pol: tubos en el extraño hielo color polen de Pol, un mundo de agujas y hoyos.

		// --- Testigos de roca, por capa ----------------------------------------------------------------------------------
		#Subterra_Exp_Core_Regolith = Polvo suelto y perlas vítreas en bandas finas y ordenadas. Cada grano fue machacado, fundido o lanzado aquí por impactos: el regolito de <<1>> son los restos de eras de bombardeo. El fondo del testigo es algo más grueso que la parte de arriba.
		#Subterra_Exp_Core_Megaregolith = Bloques rotos en una matriz de harina de roca, triturados por los grandes impactos de la juventud de <<1>>. Bajo la superficie hay kilómetros de esta capa destrozada: la corteza se rompió, se mezcló y se removió mucho antes de que corriera la primera lava.
		#Subterra_Exp_Core_MareBasalt = Basalto oscuro de grano fino lleno de burbujas de gas congeladas, de un mar de lava que inundó una cuenca hace eras. El hierro y el titanio le dan el color oscuro que hace resaltar los mares desde lejos.
		#Subterra_Exp_Core_AnorthositeBreccia = Fragmentos claros de anortosita (una roca casi toda de feldespato) soldados por impactos: la primera corteza de <<1>>, que flotó en un océano de magma global cuando el mundo era joven y estaba fundido.
		#Subterra_Exp_Core_Basalt = Basalto denso y oscuro: lava que salió, corrió y se enfrió. Pequeños cristales de olivino brillan verdes en el corte; ya estaban sólidos cuando subió la lava.
		#Subterra_Exp_Core_VolcanicBasalt = Coladas finas apiladas como las páginas de un libro, de pocos metros cada una, cada una con un techo de escoria donde se enfrió. Contarlas es contar erupciones.
		#Subterra_Exp_Core_IslandBasalt = Basalto joven con olivino y piroxeno frescos: las islas de <<1>> crecieron de coladas como estas, una sobre otra, desde el fondo del mar.
		#Subterra_Exp_Core_Granite = Cristales gruesos de cuarzo, feldespato y mica: roca que se enfrió despacio, a kilómetros de profundidad, durante cientos de miles de años. Los continentes están hechos de granito: ligero, fuerte y muy, muy viejo.
		#Subterra_Exp_Core_Limestone = Caliza gris y fina llena de conchas de diminutos animales marinos. Se formó en un fondo marino antiguo; el agua que se ha filtrado por ella desde entonces disolvió las cuevas y dolinas del karst de <<1>>.
		#Subterra_Exp_Core_Sandstone = Granos de arena redondeados y cementados en capas inclinadas: las caras de dunas, o las ondas del lecho de un río, convertidas en piedra.
		#Subterra_Exp_Core_Sediments = Capas blandas de limo y arcilla que el agua y el viento depositaron año tras año. Las láminas finas registran estaciones; los lechos gruesos, crecidas y tormentas.
		#Subterra_Exp_Core_LayeredSediments = Cientos de bandas finas, claras y oscuras, alternando como un reloj. Siguen los lentos bamboleos de la órbita y el eje de <<1>>: un registro de climas antiguos escrito en piedra.
		#Subterra_Exp_Core_Evaporites = Sal y yeso: un mar se secó aquí una y otra vez, dejando sus sales cada vez. Bajo presión la sal fluye como una pasta de dientes muy lenta y sube en domos.
		#Subterra_Exp_Core_Soil = Suelo oscuro y suelto con raíces, arenilla y restos de incontables seres vivos pequeños. Apenas un metro de grosor, y tardó miles de años en hacerse.
		#Subterra_Exp_Core_DeepCrust = Roca metamórfica caliente y densa, plegada a presión: las raíces profundas de la corteza.
		#Subterra_Exp_Core_MiddleCrust = Gneis bandeado: minerales claros y oscuros estirados en franjas por un calor y una presión que nunca llegaron a fundir la roca. La corteza media es adonde van las montañas cuando se entierran.
		#Subterra_Exp_Core_LowerCrust = Roca pesada y oscura, con los minerales realineados por el calor y la presión: las raíces profundas de la corteza de <<1>>. Quema al tacto incluso dentro del portamuestras.
		#Subterra_Exp_Core_MagmaChamberRoof = Roca vítrea y cocida, cruzada por vetas que estuvieron fundidas: el techo de una cámara magmática. Debajo, la roca era líquida no hace tanto, hablando en términos geológicos.
		#Subterra_Exp_Core_LithosphericMantle = Olivino verde y piroxeno oscuro, fríos y rígidos: la parte alta del manto, soldada a la corteza en las placas que flotan sobre la roca más blanda de abajo.
		#Subterra_Exp_Core_Asthenosphere = Olivino con una película fina de fundido entre sus granos. Solo un uno o dos por ciento es líquido, pero basta para que toda la capa fluya con las eras: las placas de encima se deslizan sobre ella.
		#Subterra_Exp_Core_UpperMantle = Peridotita, casi toda olivino verde: la roca más común de todo <<1>>, y casi nunca vista en su superficie. A esta profundidad brilla.
		#Subterra_Exp_Core_Mantle = Roca verde y densa del manto, que fluye despacio durante eras bajo una presión inmensa.
		#Subterra_Exp_Core_TransitionZone = A esta presión el olivino se ha comprimido en cristales más densos que pueden guardar agua dentro de su estructura. La zona de transición de <<1>> quizá guarde más agua que todos sus mares.
		#Subterra_Exp_Core_LowerMantle = Cristales que solo existen bajo una presión aplastante, más densos que cualquier roca de la superficie. Forman la mayor parte de la masa del manto, y del planeta.
		#Subterra_Exp_Core_CoreMantleBoundary = Una capa densa y desigual donde el manto rocoso toca el núcleo de metal. El calor del núcleo inunda aquí el manto, y de ella suben grandes plumas hacia la superficie.
		#Subterra_Exp_Core_OuterCore = Hierro y níquel líquidos, en remolino: el movimiento de este océano de metal es lo que crea el campo magnético de <<1>>. La muestra era líquida al tomarla y ahora es sólida, lo cual dice mucho de la cabeza del taladro.
		#Subterra_Exp_Core_InnerCore = Hierro y níquel sólidos, cristalizados por la presión pese a un calor como el de la superficie de una estrella. El centro de <<1>>: no hay ningún sitio más hondo adonde ir.
		#Subterra_Exp_Core_IronCore = Hierro y níquel, de una densidad imposible: un trozo del núcleo de <<1>>, un mundo lo bastante pequeño como para que su núcleo se solidificara hace mucho.
		#Subterra_Exp_Core_Core = Hierro y níquel, de una densidad imposible: un trozo del propio núcleo.
		#Subterra_Exp_Core_RockyMantle = Roca de silicatos oscura bajo el hielo: el interior pedregoso que esconde la corteza helada.
		#Subterra_Exp_Core_RockyCore = Roca densa y oscura en el corazón de un mundo helado: todo lo pesado se hundió aquí cuando <<1>> era joven y lo bastante caliente para separarse.
		#Subterra_Exp_Core_IcyMantle = Hielo a gran presión, gris de polvo: ni el hielo quebradizo de la superficie ni agua líquida, sino una capa tibia, lenta y plástica que se mueve con las eras.
		#Subterra_Exp_Core_HighPressureIce = Hielo comprimido en formas cristalinas que no pueden existir en la superficie: más denso que el agua y sólido aunque esté tibio. Se hunde en vez de flotar.
		#Subterra_Exp_Core_IceRegolith = Granos de hielo y polvo apelmazados: el suelo escarchado de un mundo helado, removido por micrometeoritos y congelado duro.
		#Subterra_Exp_Core_WaterIce = Hielo de agua claro y duro con burbujitas atrapadas, cada una una muestra del aire, o del vacío, que había cuando se formó el hielo.
		#Subterra_Exp_Core_DirtyIce = Hielo veteado de polvo oscuro y mugre orgánica: aquello de lo que están hechos los cometas, aquí a granel.
		#Subterra_Exp_Core_IcyCrust = Hielo y roca en capas alternas: una corteza que se heló, se fundió y volvió a helarse muchas veces mientras <<1>> se calentaba y se enfriaba.
		#Subterra_Exp_Core_IcyBreccia = Hielo y roca rotos y vueltos a congelar juntos por impactos antiguos: las cicatrices de la historia de <<1>>, selladas en hielo.
		#Subterra_Exp_Core_IceShell = Hielo más antiguo cuanto más hondo: la corteza sobre el océano.
		#Subterra_Exp_Core_MintIce = Hielo verde pálido, con un leve olor a menta. Nadie sabe bien por qué Minmus es así. Los científicos lo comprobaron dos veces: la muestra huele a menta sin ninguna duda.
		#Subterra_Exp_Core_PolarIce = Hielo polar en capas finas, cada banda una estación de escarcha y polvo. Leído desde arriba, el testigo es un calendario de inviernos polares.
		#Subterra_Exp_Core_Rubble = Bloques sueltos y huecos que apenas mantiene juntos la gravedad: un montón de escombros, no un mundo macizo. El taladro no paraba de caer en huecos.
		#Subterra_Exp_Core_PartialMelt = Roca con bolsillos de fundido entre sus cristales, brillando anaranjada en el portamuestras: camino de convertirse en magma, si alguna vez encuentra por dónde subir.
		#Subterra_Exp_Core_SubsurfaceOcean = El taladro salió mojado: el pozo atravesó el fondo de la corteza hasta el océano de <<1>>. Salado, frío y líquido desde hace eras.

		// --- Testigos de roca, por tipo de roca (capas de otros paquetes de planetas) -------------------------------------
		#Subterra_Exp_Core_Kind_Generic = Un cilindro de roca del fondo del pozo, bandeado y fresco: roca que nadie había visto nunca, de lo hondo de <<1>>.
		#Subterra_Exp_Core_Kind_Regolith = Polvo suelto y granos rotos: restos de impactos y meteorización, apelmazados durante eras.
		#Subterra_Exp_Core_Kind_Basalt = Roca volcánica oscura de grano fino: lava que se enfrió cerca de la superficie.
		#Subterra_Exp_Core_Kind_Anorthosite = Roca clara casi toda de feldespato: corteza que flotó en un antiguo océano de magma.
		#Subterra_Exp_Core_Kind_Breccia = Fragmentos angulosos cementados: roca rota por un impacto y vuelta a soldar por su calor.
		#Subterra_Exp_Core_Kind_Limestone = Caliza fina hecha de conchas de diminutos animales marinos: un fondo marino antiguo.
		#Subterra_Exp_Core_Kind_Sandstone = Granos de arena cementados en piedra en capas inclinadas: viejas dunas o lechos de ríos.
		#Subterra_Exp_Core_Kind_Granite = Cristales gruesos de cuarzo y feldespato: roca que se enfrió despacio, muy bajo tierra.
		#Subterra_Exp_Core_Kind_Ice = Hielo duro y claro con burbujas y polvo: helado desde hace eras.
		#Subterra_Exp_Core_Kind_Salt = Cristales de sal: lo que queda de un mar que se secó.
		#Subterra_Exp_Core_Kind_Metal = Hierro y níquel, de una densidad imposible: metal de un núcleo.
		#Subterra_Exp_Core_Kind_Olivine = Olivino verde y piroxeno: la parte alta y rígida del manto.
		#Subterra_Exp_Core_Kind_Mantle = Roca densa del manto, que fluye despacio durante eras bajo una presión inmensa.
		#Subterra_Exp_Core_Kind_Core = Roca densa y metal del corazón de <<1>>.
		#Subterra_Exp_Core_Kind_Sediment = Capas blandas de limo y arcilla depositadas por el agua o el viento.
		#Subterra_Exp_Core_Kind_Gabbro = Gabro grueso y oscuro: el gemelo del basalto, enfriado despacio en lo hondo de la corteza.
		#Subterra_Exp_Core_Kind_Gneiss = Gneis bandeado: roca estirada en franjas por el calor y la presión.
		#Subterra_Exp_Core_Kind_Asthenosphere = Roca caliente con una película de fundido entre sus granos: la capa blanda sobre la que se deslizan las placas.
		#Subterra_Exp_Core_Kind_MoltenMetal = Metal que estaba líquido cuando llegó el taladro: una muestra de un océano de metal en remolino.

		// --- El centro de un mundo (CentreReward) -------------------------------------------------------------------------
		#Subterra_Centre_Title = Viaje al centro de <<1>>
		#Subterra_Centre_Message = ¡El centro de <<1>>!
		#Subterra_Centre_Ok = Adelante (y arriba)
		#Subterra_Centre_Science = +<<1>> de ciencia
		#Subterra_Centre_Funds = +<<1>> de fondos
		#Subterra_Centre_Reputation = +<<1>> de reputación
		#Subterra_Centre_Any = El centro de <<1>>. Desde aquí todos los caminos van hacia arriba: el mundo entero te aprieta por todos lados y no tira de ti hacia ninguno. Ningún kerbal había llegado tan hondo, y quizá ninguno vuelva a hacerlo.
		#Subterra_Centre_Kerbin = Seiscientos kilómetros de roca, magma y hierro fundido encima, y al fondo de todo, el corazón de hierro sólido de Kerbin: más caliente que la superficie del sol y solidificado por el peso del mundo entero. La gravedad es cero; todo camino va hacia arriba. El profesor de la vieja historia nunca llegó tan lejos.
		#Subterra_Centre_Mun = El corazón de la Mun: un pequeño núcleo de hierro que se solidificó hace mucho. Toda la Mun aprieta desde todos lados y no tira de ti hacia ninguno. Nadie en Kerbin se lo va a creer; tendrán que hablar los instrumentos.
		#Subterra_Centre_Minmus = El corazón rocoso de Minmus, bajo su hielo y su océano. Contra toda lógica, huele un poco a menta.
		#Subterra_Centre_Duna = El núcleo de Duna: un día movió un campo magnético que protegía un cielo más denso y quizá mares. Se ha ido enfriando desde entonces, y el aire de Duna se fue con su campo.
		#Subterra_Centre_Ike = El núcleo de Ike, pequeño y frío, apretado cada día por las mareas de Duna. Ike cruje a tu alrededor.
		#Subterra_Centre_Eve = El centro de Eve: más roca y hierro que Kerbin, bajo un cielo tan pesado que aplasta módulos de aterrizaje. Llegar aquí fue lo fácil. Volver a órbita desde Eve es cosa de leyenda.
		#Subterra_Centre_Gilly = El medio de Gilly: apenas un centro, unos pocos kilómetros de escombros sueltos que mantiene juntos un susurro de gravedad. Cuidado con los huecos.
		#Subterra_Centre_Moho = El núcleo de Moho: una enorme bola de hierro que es casi todo el planeta, como si el sol hubiera quemado el resto. El lugar más caliente tan cerca de la estrella más caliente.
		#Subterra_Centre_Dres = El corazón de Dres, el planeta enano olvidado. Nadie se acuerda de Dres. Nadie olvidará esto.
		#Subterra_Centre_Laythe = El núcleo de Laythe, caliente por las mareas de Jool, bajo un océano con aire encima. La luna más amable para los kerbals es por dentro tan feroz como cualquiera.
		#Subterra_Centre_Vall = El centro de Vall, bajo su corteza de hielo y su océano: un núcleo pedregoso que Jool flexiona cada día, lo bastante tibio para mantener un mar líquido encima durante eras.
		#Subterra_Centre_Tylo = El núcleo de Tylo, bajo un océano de cincuenta kilómetros de hondo y cientos de kilómetros de roca. La luna más pesada del sistema, y bajaste hasta el fondo.
		#Subterra_Centre_Bop = El corazón de Bop, un cometa capturado: hielo sucio hasta el fondo, y algo grande y viejo en alguna parte. Tienes la sensación de no estar solo.
		#Subterra_Centre_Pol = El centro de Pol, la luna color polen: un núcleo pequeño y pedregoso en un mundo de agujas.
		#Subterra_Centre_Eeloo = El núcleo de Eeloo, el mundo más lejano: roca, bajo hielo, bajo la luz de sol más débil del sistema. Incluso aquí hace más calor que en la superficie.
	}
}
