// The stock Drill-O-Matic Junior gets Subterra's borehole tools (Lucas: it, not the big Drill-O-Matic, which stays the
// stock miner: the Junior gains a purpose) behind a "borehole mode" switch (Lucas: the same stock parts with
// an extra mode, not Subterra copies of them). Off, they mine Ore as before; on: bore a hole through the rock layers, take
// core samples, pump what the layer yields, load and fire blast holes (vertical shafts, or horizontal rounds and vaults).
// Subterra's own SB-1 drill and SB-P pump are kept, hidden, for saved crafts.
@PART[MiniDrill]:FOR[Subterra]
{
	MODULE
	{
		name = ModuleSubterraCoreDrill
		modeSwitch = true
		boreholeMode = false
		baseRate = 0.5
		// The MiniDrill's bit comes out along its -Y axis: mounted so that it points sideways, it drills blast rounds.
		drillAxis = 0, -1, 0
		powerUse = 1.5
		maxRockTemp = 900
		transmitValue = 0.5
		blastRadius = 3
		// The short stock bit is hidden while the drill string bores.
		bitMesh = drill
	}
	MODULE
	{
		name = ModuleSubterraWellPump
		powerUse = 0.5
		// Lucas: worth using: a cooler or a water engine filled in minutes (Mun polar ice: 0.8 Water/s). [Claude, revisar]
		pumpRate = 40
	}
	RESOURCE
	{
		name = Explosive
		amount = 0
		maxAmount = 300
	}
}


// The stock ore tanks can hold explosive instead (Lucas: the same stock parts with an option, not copies): the same
// mass of Explosive. Subterra's own magazine is kept, hidden, for saved crafts.
@PART[SmallTank|RadialOreTank|LargeTank]:FOR[Subterra]
{
	MODULE
	{
		name = ModuleSubterraContentSwitch
		baseResource = Ore
		altResource = Explosive
	}
}
