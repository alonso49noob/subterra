// Explodium and explosive in the stock Convert-O-Trons (Lucas): Explodium makes 50% more fuel and oxidizer per unit than
// Ore, and twice the explosive. Ore makes explosive too (the baseline). Written out whole (not copied from the stock
// converters) so they do not depend on how those are named. [Claude, revisar]
@PART[ISRU]:NEEDS[Subterra]:FOR[Subterra]
{
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = #Subterra_Isru_ExplodiumLfOx
		StartActionName = #Subterra_Isru_ExplodiumLfOx_Start
		StopActionName = #Subterra_Isru_ExplodiumLfOx_Stop
		AutoShutdown = true
		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1000 10000
			key = 1250 500
			key = 2000 50
			key = 4000 0
		}
		GeneratesHeat = true
		DefaultShutoffTemp = .8
		ThermalEfficiency
		{
			key = 0 0 0 0
			key = 500 0.1 0 0
			key = 1000 1.0 0 0
			key = 1250 0.1 0 0
			key = 3000 0 0 0
		}
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		UseSpecialistHeatBonus = true
		SpecialistHeatFactor = 0.1
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		resourceOutputName = LF+Ox
		INPUT_RESOURCE
		{
			ResourceName = Explodium
			Ratio = 0.5
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 30
		}
		OUTPUT_RESOURCE
		{
			ResourceName = LiquidFuel
			Ratio = 0.675
			DumpExcess = false
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Oxidizer
			Ratio = 0.825
			DumpExcess = false
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = #Subterra_Isru_OreExplosive
		StartActionName = #Subterra_Isru_OreExplosive_Start
		StopActionName = #Subterra_Isru_OreExplosive_Stop
		AutoShutdown = true
		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1000 10000
			key = 1250 500
			key = 2000 50
			key = 4000 0
		}
		GeneratesHeat = true
		DefaultShutoffTemp = .8
		ThermalEfficiency
		{
			key = 0 0 0 0
			key = 500 0.1 0 0
			key = 1000 1.0 0 0
			key = 1250 0.1 0 0
			key = 3000 0 0 0
		}
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		UseSpecialistHeatBonus = true
		SpecialistHeatFactor = 0.1
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		resourceOutputName = Explosive
		INPUT_RESOURCE
		{
			ResourceName = Ore
			Ratio = 0.5
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 30
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Explosive
			Ratio = 2.5
			DumpExcess = false
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = #Subterra_Isru_ExplodiumExplosive
		StartActionName = #Subterra_Isru_ExplodiumExplosive_Start
		StopActionName = #Subterra_Isru_ExplodiumExplosive_Stop
		AutoShutdown = true
		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1000 10000
			key = 1250 500
			key = 2000 50
			key = 4000 0
		}
		GeneratesHeat = true
		DefaultShutoffTemp = .8
		ThermalEfficiency
		{
			key = 0 0 0 0
			key = 500 0.1 0 0
			key = 1000 1.0 0 0
			key = 1250 0.1 0 0
			key = 3000 0 0 0
		}
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		UseSpecialistHeatBonus = true
		SpecialistHeatFactor = 0.1
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		resourceOutputName = Explosive
		INPUT_RESOURCE
		{
			ResourceName = Explodium
			Ratio = 0.5
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 30
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Explosive
			Ratio = 5
			DumpExcess = false
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}
}

