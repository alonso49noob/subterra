// Ore baked for its water (Lucas: "haz que el ore pueda convertirse en agua"): the stock Convert-O-Trons heat Ore and
// condense the water out, about a third of its mass (1 Ore, 10 kg, gives 3 units of water, 3 kg). Water feeds the SB-K
// coolers and the SB-H water engine. [Claude, revisar]
@PART[ISRU]:NEEDS[Subterra]:FOR[Subterra]
{
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = #Subterra_Isru_OreWater
		StartActionName = #Subterra_Isru_OreWater_Start
		StopActionName = #Subterra_Isru_OreWater_Stop
		AutoShutdown = true
		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1000 10000
			key = 1250 500
			key = 2000 50
			key = 4000 0
		}
		GeneratesHeat = true
		DefaultShutoffTemp = .8
		ThermalEfficiency
		{
			key = 0 0 0 0
			key = 500 0.1 0 0
			key = 1000 1.0 0 0
			key = 1250 0.1 0 0
			key = 3000 0 0 0
		}
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		UseSpecialistHeatBonus = true
		SpecialistHeatFactor = 0.1
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		resourceOutputName = Water
		INPUT_RESOURCE
		{
			ResourceName = Ore
			Ratio = 0.5
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 15
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Water
			Ratio = 1.5
			DumpExcess = false
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}
}
