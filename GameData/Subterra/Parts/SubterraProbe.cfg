PART
{
	name = SubterraWaterEngine
	module = Part
	author = Subterra (stock model by AlexanderM)
	MODEL
	{
		model = Squad/Parts/Engine/OMSEngine/Puff_v2
		scale = 1.6, 1.6, 1.6
	}
	rescaleFactor = 1
	node_attach = 0.0, 0.0, 0.00, 0.0, 0.0, 1.0, 0
	attachRules = 0,1,0,1,1
	TechRequired = precisionPropulsion
	entryCost = 4000
	cost = 600
	category = Engine
	subcategory = 0
	title = #Subterra_Part_WaterEngine_title
	manufacturer = #Subterra_Part_Manufacturer
	description = #Subterra_Part_WaterEngine_desc
	mass = 0.05
	heatConductivity = 0.06
	skinInternalConductionMult = 4.0
	emissiveConstant = 0.8
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 10
	maxTemp = 2000
	maxPressure = 800000
	PhysicsSignificance = 1
	bulkheadProfiles = srf
	tags = subterra water engine hydrojet steam thruster ocean probe swim
	EFFECTS
	{
		running
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 1.0 0.4
				pitch = 0.0 0.5
				pitch = 1.0 0.9
				loop = true
			}
			MODEL_MULTI_PARTICLE
			{
				modelName = Squad/FX/Monoprop_big
				transformName = FXTransform
				emission = 0.0 0.0
				emission = 0.4 0.6
				emission = 1.0 0.8
				speed = 0.0 0.6
				speed = 1.0 0.8
				localPosition = 0, 0, 0.12
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}
	// Heats water into a jet: Water and electricity. In water its intake keeps the tank full, so it never runs dry there.
	MODULE
	{
		name = ModuleEnginesFX
		thrustVectorTransformName = thrustTransform
		exhaustDamage = False
		ignitionThreshold = 0.1
		minThrust = 0
		maxThrust = 4
		heatProduction = 10
		fxOffset = 0, 0, 0.7
		EngineType = Electric
		runningEffectName = running
		PROPELLANT
		{
			name = Water
			ratio = 0.5
			DrawGauge = True
			resourceFlowMode = NO_FLOW
		}
		PROPELLANT
		{
			name = ElectricCharge
			ratio = 0.1
			DrawGauge = False
		}
		atmosphereCurve
		{
			key = 0 150
			key = 1 120
			key = 4 0.001
		}
	}
	MODULE
	{
		name = ModuleSubterraWaterIntake
		intakeRate = 10
	}
	MODULE
	{
		name = ModuleGimbal
		gimbalTransformName = Gimbal
		gimbalRange = 6
		gimbalResponseSpeed = 12
		useGimbalResponseSpeed = true
	}
	RESOURCE
	{
		name = Water
		amount = 30
		maxAmount = 30
	}
}

// Evaporative coolers (Lucas: inline parts, like fuel tanks, to cool a craft that got too hot going deep). Deep in the rock
// a radiator has nowhere to shed heat; these boil water off instead, and top it up from cave water and seas. Stock RCS
// tank models. [Claude, revisar]
PART
{
	name = SubterraCoolerSmall
	module = Part
	author = Subterra (stock model by Squad)
	MODEL
	{
		model = Squad/Parts/FuelTank/RCSFuelTankR10/model
	}
	rescaleFactor = 1
	node_stack_top = 0.0, 0.1875, 0.0, 0.0, 1.0, 0.0, 0
	node_stack_bottom = 0.0, -0.1875, 0.0, 0.0, -1.0, 0.0, 0
	TechRequired = advScienceTech
	entryCost = 5000
	cost = 900
	category = Thermal
	subcategory = 0
	title = #Subterra_Part_CoolerSmall_title
	manufacturer = #Subterra_Part_Manufacturer
	description = #Subterra_Part_Cooler_desc
	attachRules = 1,1,1,1,0
	mass = 0.08
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 12
	maxTemp = 2000
	maxPressure = 20000
	bulkheadProfiles = size0, srf
	tags = subterra cooler cooling heat sink thermal evaporative water steam deep cave hot
	MODULE
	{
		name = ModuleSubterraHeatSink
		maxPower = 80
		kJPerUnit = 2500
		powerUse = 0.4
	}
	MODULE
	{
		name = ModuleSubterraWaterIntake
		intakeRate = 4
	}
	RESOURCE
	{
		name = Water
		amount = 150
		maxAmount = 150
	}
}

