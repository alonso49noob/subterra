// Subterra sub-project 4: parts for the player's own ice and ocean probes (Lucas: no cryobot part; a tiny probe core, a
// drill like the IceMole and an engine that runs on water, to build with). Stock models scaled down; built for the
// pressure of the deep oceans (Tylo's floor is about 575 MPa). [Claude, revisar]

// Water for the water engine when CommunityResourcePack (which defines it) is not installed: same values as CRP's.
RESOURCE_DEFINITION:NEEDS[!CommunityResourcePack]
{
	name = Water
	displayName = #Subterra_Resource_Water
	abbreviation = #Subterra_Resource_Water_abbr
	density = 0.001
	unitCost = 0.0008
	hsp = 4181
	flowMode = STACK_PRIORITY_SEARCH
	transfer = PUMP
	isTweakable = true
	volume = 1
}

PART
{
	name = SubterraProbeCore
	module = Part
	author = Subterra (stock model by Squad)
	MODEL
	{
		model = Squad/Parts/Command/probeCoreOcto2_v2/probeCoreOcto2_v2
		texture = octoDiffuse, Squad/Parts/Command/probeCoreOcto_v2/octoDiffuse
		texture = octoNormal, Squad/Parts/Command/probeCoreOcto_v2/octoNormal
		texture = octoSpecular, Squad/Parts/Command/probeCoreOcto_v2/octoSpecular
	}
	rescaleFactor = 0.5
	CrewCapacity = 0
	node_stack_bottom = 0.0, -0.0610621, 0.0, 0.0, -1.0, 0.0, 0
	node_stack_top = 0.0, 0.0610621, 0.0, 0.0, 1.0, 0.0, 0
	TechRequired = advUnmanned
	entryCost = 9000
	cost = 2200
	category = Pods
	subcategory = 0
	title = #Subterra_Part_ProbeCore_title
	manufacturer = #Subterra_Part_Manufacturer
	description = #Subterra_Part_ProbeCore_desc
	attachRules = 1,0,1,1,0
	mass = 0.03
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.15
	angularDrag = 1.5
	crashTolerance = 14
	maxTemp = 1400
	maxPressure = 800000
	explosionPotential = 0
	vesselType = Probe
	bulkheadProfiles = size0
	tags = subterra probe core tiny cryobot hydrobot ocean ice pressure
	MODULE
	{
		name = ModuleCommand
		minimumCrew = 0
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.02
		}
		hasHibernation = True
	}
	MODULE
	{
		name = ModuleSAS
		SASServiceLevel = 1
	}
	MODULE
	{
		name = ModuleReactionWheel
		PitchTorque = 0.15
		YawTorque = 0.15
		RollTorque = 0.15
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.02
		}
	}
	// A small radioisotope heater-generator, as real cryobot designs carry: power under kilometres of ice.
	MODULE
	{
		name = ModuleGenerator
		isAlwaysActive = true
		OUTPUT_RESOURCE
		{
			name = ElectricCharge
			rate = 0.75
		}
	}
	MODULE
	{
		name = ModuleDataTransmitter
		antennaType = INTERNAL
		packetInterval = 1.0
		packetSize = 2
		packetResourceCost = 12.0
		requiredResource = ElectricCharge
		antennaPower = 5000
		optimumRange = 2500
		packetFloor = .1
		packetCeiling = 5
	}
	RESOURCE
	{
		name = ElectricCharge
		amount = 60
		maxAmount = 60
	}
}

