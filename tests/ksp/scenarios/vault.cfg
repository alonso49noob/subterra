// Lucas: the blast drill used horizontally, to make very deep vaults. Kerbin, 150 m under the ground west of the KSC: the
// cheat menu's Set Position carves a pocket for the buggy; its core drill, set to drill horizontally with a 20 m hole
// diameter, reaches across the pocket to the rock face and drills a 40 m round (infinite propellant: no explosive needed).
// The buggy is moved away, the round fired: a 20 m vault 40 m long opens.
SUBTERRA_TEST
{
	name = vault
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = cheats
		propellant = true
		electricity = true
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.15
		lon = -75.2
		alt = -150
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = assert
		what = insideNetwork
		site = dug
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraCoreDrill
		baseRate = 20
		horizontal = true
		blastHeading = 0
		holeDiameter = 20
		fuseSeconds = 3
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StartDrilling
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = LoadCharges
	}
	STEP
	{
		do = assert
		what = logContains
		text = Round loaded
	}
	// Away from the blast (it is fired from the drill's module, wherever the vessel is now).
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.15
		lon = -75.0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = Detonate
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = assert
		what = logContains
		text = Round fired
	}
	// Back down into the pocket, now the vault's end.
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.15
		lon = -75.2
		alt = -150
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = floodlight
		on = true
		range = 80
		intensity = 3
		up = 6
	}
	STEP
	{
		do = camera
		distance = 10
		pitch = 15
		heading = 0
	}
	STEP
	{
		do = screenshot
		name = vault-inside
		hideUi = true
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
