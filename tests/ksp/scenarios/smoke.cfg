// Smoke test of the harness: a fresh sandbox game, the Crater Crawler rover launched from the
// runway and dropped 3 m above the Mun's terrain; it must survive the landing.
// Run: powershell -ExecutionPolicy Bypass -File tools/test-ksp.ps1 -Scenario smoke -Profile stock
SUBTERRA_TEST
{
	name = smoke
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Crater Crawler
		site = Runway
		crew = true
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = screenshot
		name = smoke
	}
	STEP
	{
		do = quit
	}
}
