// Task 30 with CommunityResourcePack (full profile): Water has the 0.05 floor in the gallery.
// The best matching ENRICHMENT rule wins: the shipped Mun.cfg multiplies Ore by 2.5 in the MareBasalt layer,
// which beats DevMun's x2 for the gallery (DevTube lies in MareBasalt), so the ratio is 2.5.
SUBTERRA_TEST
{
	name = ore-full
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = teleportToNetwork
		site = DevTube
		node = 1
		inside = true
		offsetUp = 2
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = assert
		what = abundanceRatio
		resource = Ore
		ratio = 2.5
	}
	STEP
	{
		do = assert
		what = abundanceAtLeast
		resource = Water
		min = 0.05
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
