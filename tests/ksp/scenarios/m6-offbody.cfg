// M0 spike (radar Task 4): KspSampler.Fill on the Mun and Duna from Kerbin (bodies never active in the session: cold),
// then with the vessel at the Mun, then from Kerbin's orbit, then at Duna. Stock profile:
// tools/test-ksp.ps1 -Scenario m6-offbody -Profile stock -Cfg none
SUBTERRA_TEST
{
	name = m6-offbody
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Crater Crawler
		site = Runway
		crew = true
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = spike
		name = OffBodyCell
		body = Mun
		phase = cold-from-Kerbin
	}
	STEP
	{
		do = spike
		name = OffBodyCell
		body = Duna
		phase = cold-from-Kerbin
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = spike
		name = OffBodyCell
		body = Mun
		phase = at-Mun
	}
	STEP
	{
		do = setOrbit
		body = Kerbin
		alt = 300000
		inc = 0
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = spike
		name = OffBodyCell
		body = Mun
		phase = Kerbin-orbit-after-visit
	}
	STEP
	{
		do = teleport
		body = Duna
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = spike
		name = OffBodyCell
		body = Duna
		phase = at-Duna
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
