// Counts the procedural networks of Tylo at the shipped density (run with -Cfg none; the vessel is put on Tylo first).
SUBTERRA_TEST
{
	name = netcount-tylo
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Rover Explorer
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Tylo
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = spike
		name = NetworkCounter
		body = Tylo
		scale = 1
	}
	STEP
	{
		do = quit
	}
}
