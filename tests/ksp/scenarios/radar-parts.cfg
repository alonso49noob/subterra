// Radar task 13: the Eco and Plomada parts exist, build their instrument from the cfg, and report whether they
// could scan: fine at 30 km above the Mun, out of the altitude window at 400 km, no power without electric charge.
SUBTERRA_TEST
{
	name = radar-parts
	STEP
	{
		do = assert
		what = partExists
		name = SubterraEco
	}
	STEP
	{
		do = assert
		what = partExists
		name = SubterraPlomada
	}
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Radar Probe
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = camera
		distance = 3
		pitch = 15
		heading = 40
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = parts-runway
		hideUi = true
	}
	STEP
	{
		do = camera
		distance = 4
		pitch = 10
		heading = 300
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = parts-runway-b
		hideUi = true
	}
	STEP
	{
		do = assert
		what = radarInstrument
	}
	STEP
	{
		do = assert
		what = radarStatus
		status = Idle
		count = 2
	}
	STEP
	{
		do = setOrbit
		body = Mun
		alt = 30000
		inc = 85
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraRadar
		event = StartScan
		all = true
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = assert
		what = radarStatus
		status = Scanning
		count = 2
	}
	STEP
	{
		do = camera
		distance = 6
		pitch = 20
		heading = 220
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = parts-orbit
		hideUi = true
	}
	STEP
	{
		do = setResourceAmount
		name = ElectricCharge
		amount = 0
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = assert
		what = radarStatus
		status = NoPower
		count = 2
	}
	STEP
	{
		do = setResourceAmount
		name = ElectricCharge
		fraction = 1
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = assert
		what = radarStatus
		status = Scanning
		count = 2
	}
	STEP
	{
		do = setOrbit
		body = Mun
		alt = 400000
		inc = 85
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = assert
		what = radarStatus
		status = OutOfAltitude
		count = 2
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraRadar
		event = StopScan
		all = true
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = assert
		what = radarStatus
		status = Idle
		count = 2
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
