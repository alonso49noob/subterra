// Sub-project 4: the SB-M mole bores the way its nose points and pulls its vessel down its bore. Here its module is put
// on the buggy's root (pointed straight down), with a bore wide enough for the buggy: it starts a
// bore at the KSC, goes down into the ground and the buggy is inside the dug void.
SUBTERRA_TEST
{
	name = mole
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	// Off the runway (its own collider covers anything dug under it).
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.20
		lon = -74.65
		alt = 2
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = cheats
		electricity = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraMole
		radius = 7
		baseRate = 1.5
		pitch = 90
		headOffset = 1.2
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraMole
		event = StartBoring
	}
	STEP
	{
		do = camera
		distance = 15
		pitch = 30
		heading = 0
	}
	STEP
	{
		do = wait
		seconds = 12
	}
	STEP
	{
		do = screenshot
		name = mole-going-in
		hideUi = true
	}
	STEP
	{
		do = wait
		seconds = 25
	}
	STEP
	{
		do = assert
		what = logContains
		text = Mole bore
	}
	STEP
	{
		do = assert
		what = insideNetwork
		site = dug
	}
	STEP
	{
		do = assert
		what = vesselAlive
		// The buggy's deployed solar panels and long antenna may break as it drops into the bore (the mole is meant for
		// slim probes): the rest must be whole.
		minParts = 22
	}
	STEP
	{
		do = floodlight
		on = true
		range = 40
		intensity = 2
		up = 3
	}
	STEP
	{
		do = screenshot
		name = mole-underground
		hideUi = true
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraMole
		event = StopBoring
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
