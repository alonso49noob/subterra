// Diagnostics (sub-project 3): measures the Mohole (Moho's north pole) with terrain profiles across it, and finds
// sites for Moho's caves.
SUBTERRA_TEST
{
	name = mohole
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Rover Explorer
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Moho
		lat = 80
		lon = 0
		alt = 3
		relative = terrain
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = terrainProfile
		body = Moho
		lat0 = 87
		lon0 = 0
		lat1 = 87
		lon1 = 180
		samples = 240
	}
	STEP
	{
		do = terrainProfile
		body = Moho
		lat0 = 87
		lon0 = 90
		lat1 = 87
		lon1 = -90
		samples = 240
	}
	STEP
	{
		do = spike
		name = SiteFinder
		body = Moho
		SITE
		{
			name = MohoPlainsTubes
			biome = Western Lowlands, Central Lowlands, Lowlands, Northern Sinkhole Ridge, Midlands
			length = 5000
			maxSlope = 6
			latMin = -60
			latMax = 60
		}
		SITE
		{
			name = MohoThermalRefuge
			biome = Highlands, Midlands
			length = 800
			maxSlope = 10
		}
	}
	STEP
	{
		do = quit
	}
}
