// Sub-project 2, blast holes: a core drill bores through DevTube's roof and floor, loads the hole (no charge
// across the tube), the rover drives away and fires it: a shaft opens into DevTube, the rover is unharmed.
SUBTERRA_TEST
{
	name = blast
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = teleportToNetwork
		site = DevTube
		node = 1
		inside = false
		offsetUp = 3
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraCoreDrill
		baseRate = 20
		blastRadius = 3
		fuseSeconds = 3
	}
	STEP
	{
		do = addResource
		name = Explosive
		max = 5000
		amount = 5000
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StartDrilling
	}
	STEP
	{
		do = wait
		seconds = 40
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StopDrilling
	}
	STEP
	{
		do = assert
		what = drillDepthAtLeast
		min = 85
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = LoadCharges
	}
	STEP
	{
		do = assert
		what = logContains
		text = "Blast BL-Mun-1 armed"
	}
	STEP
	{
		do = assert
		what = objectExists
		prefix = SubterraBlastRings
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = Detonate
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = assert
		what = logContains
		text = "into site:DevTube"
	}
	STEP
	{
		do = assert
		what = objectGone
		prefix = SubterraBlastRings
	}
	STEP
	{
		do = assert
		what = networkHasZone
		id = site:DevTube
		zone = Excavation
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
