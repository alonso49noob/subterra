// Sub-project 2 with CommunityResourcePack (full profile): a core drill near the Mun's south pole reaches the
// PolarIce layer and a well pump draws Water from it.
SUBTERRA_TEST
{
	name = pump
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = -83.7
		lon = -111.28
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraCoreDrill
		baseRate = 20
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraWellPump
	}
	STEP
	{
		do = addResource
		name = Water
		max = 50
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StartDrilling
	}
	STEP
	{
		do = wait
		seconds = 6
	}
	STEP
	{
		do = assert
		what = drillLayer
		name = PolarIce
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StopDrilling
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraWellPump
		event = StartPumping
	}
	STEP
	{
		do = wait
		seconds = 20
	}
	STEP
	{
		do = assert
		what = resourceAtLeast
		name = Water
		min = 0.2
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
