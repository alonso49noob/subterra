// M0 spike (radar Task 1): transparent sphere on the scaled body, seen in the map view over the Mun and Kerbin.
// Shell radius = 1.005 x (body radius + PQS mapMaxHeight) in scaled units, on a 128 x 64 sphere: the stock mesh has relief,
// Parallax displaces in the shader, and Unity's 24 x 16 primitive sphere sags under the terrain.
SUBTERRA_TEST
{
	name = m6-overlay
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Crater Crawler
		site = Runway
		crew = true
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = spike
		name = OverlaySpike
		bodies = Mun,Kerbin
		scale = 1.005
		ref = pqs
		mesh = hires
	}
	STEP
	{
		do = spike
		name = MapFocus
		body = Mun
		distance = 4
	}
	STEP
	{
		do = screenshot
		name = mun-1
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = screenshot
		name = mun-2
	}
	STEP
	{
		do = spike
		name = MapFocus
		body = Mun
		distance = 2.5
		heading = 2.0
		pitch = -0.4
	}
	STEP
	{
		do = screenshot
		name = mun-3
	}
	STEP
	{
		do = spike
		name = MapFocus
		body = Mun
		distance = 1.6
		heading = 1.0
		pitch = 0.9
	}
	STEP
	{
		do = screenshot
		name = mun-4
	}
	STEP
	{
		do = spike
		name = MapFocus
		body = Kerbin
		distance = 4
	}
	STEP
	{
		do = screenshot
		name = kerbin-1
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = screenshot
		name = kerbin-2
	}
	STEP
	{
		do = spike
		name = MapFocus
		body = Kerbin
		distance = 2.5
		heading = 2.0
		pitch = -0.4
	}
	STEP
	{
		do = screenshot
		name = kerbin-3
	}
	STEP
	{
		do = spike
		name = MapFocus
		body = Kerbin
		distance = 1.6
		heading = 1.0
		pitch = 0.9
	}
	STEP
	{
		do = screenshot
		name = kerbin-4
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
