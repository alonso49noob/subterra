// Radar task 16: the map overlay. Coverage and detections are marked by hand (radarMark, with synthetic networks), then
// the map view is pointed at a known place and photographed: the Mun's Serenity skylight (-6.66, 2.21) and Kerbin's
// KSC (-0.0972, -74.5577), whose position the screenshots check against the real terrain (the longitude alignment of
// the texture was never calibrated in the M0 spike). The overlay must also hide with its toolbar button, leave with
// the map view, and show again in the Tracking Station (the data goes through the save on the scene change).
SUBTERRA_TEST
{
	name = radar-map
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Radar Probe
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 3
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = -6.6624
		lon = 2.2053
		altitude = 30000
		halfWidth = 120000
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = 40
		lon = -30
		instrument = Gravimeter
		altitude = 30000
		halfWidth = 60000
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = -6.6624
		lon = 2.2053
		halfWidth = 0
		hint = MN-map-serenity#0
		level = Hint
		uncertainty = 25000
		depth = 200
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = -25
		lon = -20
		halfWidth = 0
		hint = MN-map-deep#0
		level = Hint
		uncertainty = 15000
		depth = 800
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = 15
		lon = 25
		halfWidth = 0
		hint = MN-map-found#0
		level = Detected
		uncertainty = 8000
		depth = 700
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = 0
		lon = 130
		altitude = 30000
		halfWidth = 100000
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = 10
		lon = 118
		halfWidth = 0
		hint = MN-map-lit-hint#0
		level = Hint
		uncertainty = 30000
		depth = 300
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = -20
		lon = 150
		halfWidth = 0
		hint = MN-map-lit-found#0
		level = Detected
		uncertainty = 10000
		depth = 900
	}
	STEP
	{
		do = radarMark
		body = Kerbin
		lat = -0.0972
		lon = -74.5577
		altitude = 30000
		halfWidth = 150000
	}
	STEP
	{
		do = radarMark
		body = Kerbin
		lat = -0.0972
		lon = -74.5577
		halfWidth = 0
		hint = KB-map-ksc#0
		level = Detected
		uncertainty = 12000
		depth = 300
	}
	STEP
	{
		do = radarMark
		body = Kerbin
		lat = 85
		lon = 0
		halfWidth = 0
		hint = KB-map-north#0
		level = Detected
		uncertainty = 20000
		depth = 0
	}
	STEP
	{
		do = mapView
		body = Mun
		lat = -6.6624
		lon = 2.2053
		distance = 2.5
	}
	STEP
	{
		do = wait
		seconds = 4
	}
	STEP
	{
		do = screenshot
		name = mun-map
	}
	STEP
	{
		do = screenshot
		name = mun-map-clean
		hideUi = true
	}
	STEP
	{
		do = resetClock
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = 30
		lon = -60
		altitude = 30000
		halfWidth = 30000
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = assert
		what = subterraFrameBudget
		avgMs = 2
		maxMs = 8
		seconds = 5
	}
	STEP
	{
		do = assert
		what = mapOverlay
		uploads = 2
		lat = 30
		lon = -60
		alpha = 40
	}
	STEP
	{
		do = assert
		what = mapOverlay
		body = Mun
		uploads = 1
		maxUploadMs = 4
		lat = -6.6624
		lon = 2.2053
		alpha = 140
	}
	STEP
	{
		do = assert
		what = mapOverlay
		lat = 15
		lon = 25
		alpha = 230
	}
	STEP
	{
		do = assert
		what = mapOverlay
		lat = 40
		lon = -30
		alpha = 40
	}
	STEP
	{
		do = assert
		what = mapOverlay
		lat = -60
		lon = 150
		alpha = 0
	}
	STEP
	{
		do = mapView
		body = Mun
		sunward = true
		distance = 2.5
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = mun-sunlit
		hideUi = true
	}
	STEP
	{
		do = assert
		what = mapOverlay
		lat = -20
		lon = 150
		alpha = 230
	}
	STEP
	{
		do = assert
		what = mapOverlay
		lat = 10
		lon = 118
		alpha = 140
	}
	STEP
	{
		do = mapView
		body = Mun
		lat = -6.6624
		lon = 2.2053
		distance = 1.6
		pitch = 0
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = mun-map-near
		hideUi = true
	}
	STEP
	{
		do = mapView
		body = Kerbin
		lat = -0.0972
		lon = -74.5577
		distance = 3
	}
	STEP
	{
		do = wait
		seconds = 4
	}
	STEP
	{
		do = screenshot
		name = kerbin-ksc
	}
	STEP
	{
		do = screenshot
		name = kerbin-ksc-clean
		hideUi = true
	}
	STEP
	{
		do = assert
		what = mapOverlay
		body = Kerbin
		lat = -0.0972
		lon = -74.5577
		alpha = 230
	}
	STEP
	{
		do = mapView
		body = Kerbin
		lat = -0.0972
		lon = -74.5577
		distance = 1.5
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = kerbin-ksc-near
		hideUi = true
	}
	STEP
	{
		do = mapOverlayShown
		on = false
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = screenshot
		name = kerbin-off
		hideUi = true
	}
	STEP
	{
		do = assert
		what = mapOverlay
		body = none
	}
	STEP
	{
		do = mapOverlayShown
		on = true
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = assert
		what = mapOverlay
		body = Kerbin
	}
	STEP
	{
		do = mapView
		on = false
	}
	STEP
	{
		do = assert
		what = mapOverlay
		body = none
	}
	STEP
	{
		do = scene
		name = TrackingStation
	}
	STEP
	{
		do = wait
		seconds = 3
	}
	STEP
	{
		do = mapView
		body = Mun
		sunward = true
		distance = 2.5
	}
	STEP
	{
		do = wait
		seconds = 4
	}
	STEP
	{
		do = screenshot
		name = mun-station
	}
	STEP
	{
		do = assert
		what = mapOverlay
		body = Mun
		uploads = 1
		lat = -6.6624
		lon = 2.2053
		alpha = 140
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
