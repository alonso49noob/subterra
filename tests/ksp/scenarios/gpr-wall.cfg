// Part 6, radar task 18: the Zahori in a tube, looking through the wall. With DevGprWall (two small tubes 45 m apart),
// a probe held in DevWallA with the radar level and pointing south, away from DevWallB, finds nothing of it; turned to
// look north, through the rock wall about 21 m thick, it brings DevWallB (a neighbouring room) to Detected.
SUBTERRA_TEST
{
	name = gpr-wall
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Zahori Probe
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = setNoon
		body = Mun
		lon = -0.43
	}
	STEP
	{
		do = teleportToNetwork
		site = DevWallA
		node = 1
		inside = true
		offsetUp = 3
		rootUp = true
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = aimRadar
		lat = -0.01289
		lon = -0.4286
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = assert
		what = radarAxis
		dir = level
		tolerance = 10
	}
	STEP
	{
		do = camera
		distance = 6
		pitch = 10
		heading = 200
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = gpr-wall-away
		hideUi = true
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraRadar
		event = StartScan
		all = true
	}
	STEP
	{
		do = wait
		seconds = 4
	}
	STEP
	{
		do = assert
		what = radarStatus
		status = Scanning
		count = 1
	}
	STEP
	{
		do = radarProbe
	}
	STEP
	{
		do = assert
		what = detectionLevel
		id = site:DevWallB
		level = None
	}
	STEP
	{
		do = aimRadar
		lat = 0.01289
		lon = -0.4286
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = assert
		what = radarAxis
		dir = level
		tolerance = 10
	}
	STEP
	{
		do = wait
		seconds = 4
	}
	STEP
	{
		do = radarProbe
	}
	STEP
	{
		do = assert
		what = detectionLevel
		id = site:DevWallB
		level = Detected
	}
	STEP
	{
		do = assert
		what = radarWaypoint
		id = site:DevWallB
		min = 1
		max = 1
	}
	STEP
	{
		do = assert
		what = logContains
		text = "Zahori hollow"
	}
	STEP
	{
		do = camera
		distance = 6
		pitch = 10
		heading = 20
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = gpr-wall-toward
		hideUi = true
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
