// Sub-project 3: candidate coordinates for Tylo's great cave system. Tylo's maps load on demand: the vessel is put
// on Tylo first (with it far away, its terrain read flat).
SUBTERRA_TEST
{
	name = sitefinder-tylo
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Rover Explorer
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Tylo
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = spike
		name = SiteFinder
		body = Tylo
		SITE
		{
			name = TyloGreatSystem
			biome = Lowlands, Midlands, Mara
			length = 8000
			maxSlope = 8
			latMin = -50
			latMax = 50
		}
		SITE
		{
			name = TyloHighlandCaves
			biome = Highlands
			length = 3000
			maxSlope = 15
		}
	}
	STEP
	{
		do = quit
	}
}
