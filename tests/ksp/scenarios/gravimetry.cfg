// Radar task 15: a Plomada gravimeter 20 km over the Mun maps a whole Mun day (the swath is 40 km wide, the track
// moves about 15 km per orbit at the Great Gallery's latitude). Lazy detection evaluates the named Great Gallery
// (250 m wide at its chamber) straight away and the procedural cells under the coverage as they are generated: the
// gallery reaches Hint, and no network narrower than 100 m does (at 20 km a void needs about 180 m of width to
// give 0.05 mGal). The frame budget holds while the requested cells are generated (measured after the scanner's
// catch-up: walking the backlog of a 40 km swath has its own spikes, task 14's scanner). The 40 km swath costs the
// scanner a lot per sample, so the warp leaves a backlog it walks at x1 before the gallery's coverage is checked.
// Infinite electricity: EC is task 13's test.
SUBTERRA_TEST
{
	name = gravimetry
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Radar Probe
		site = Runway
	}
	STEP
	{
		do = cheats
		electricity = true
	}
	STEP
	{
		do = setOrbit
		body = Mun
		alt = 20000
		inc = 60
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraRadar
		event = StartScan
		part = SubterraPlomada
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = warp
		rate = 10000
		seconds = 15
	}
	STEP
	{
		do = wait
		seconds = 4
	}
	STEP
	{
		do = waitUntil
		what = radarLastScan
		maxLag = 60
		timeout = 300
	}
	STEP
	{
		do = assert
		what = coverageAt
		body = Mun
		lat = 49.398
		lon = 64.9603
		instrument = Gravimeter
		maxAltitude = 21000
	}
	STEP
	{
		do = waitUntil
		what = detectionLevel
		id = site:GreatGallery
		level = Hint
		timeout = 60
	}
	STEP
	{
		do = assert
		what = detectionLevel
		id = site:GreatGallery
		level = Hint
	}
	STEP
	{
		do = waitUntil
		what = cellsReady
		body = Mun
		min = 40
		timeout = 300
	}
	STEP
	{
		do = resetClock
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = assert
		what = subterraFrameBudget
		avgMs = 2
		maxMs = 8
		seconds = 8
	}
	STEP
	{
		do = assert
		what = noHintNarrowerThan
		body = Mun
		width = 100
		minHints = 2
	}
	STEP
	{
		do = assert
		what = hintCount
		body = Mun
		min = 2
	}
	STEP
	{
		do = waitUntil
		what = logContains
		text = new hints on
		timeout = 30
	}
	STEP
	{
		do = screenshot
		name = gravimetry
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
