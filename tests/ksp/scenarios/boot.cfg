// Task 21: the loader reads DevMun.cfg and BadBodies.cfg (bad nodes skipped with a warning), fast,
// without exceptions. No flight needed.
SUBTERRA_TEST
{
	name = boot
	STEP
	{
		do = assert
		what = logContains
		text = "[Subterra] Loaded body Mun: 5 sites, 3 fields"
	}
	STEP
	{
		do = assert
		what = logContains
		text = "Skipped SUBTERRA_BODY 'Tekto': body not found"
	}
	STEP
	{
		do = assert
		what = logContains
		text = "SUBTERRA_BODY without 'body' skipped"
	}
	STEP
	{
		do = assert
		what = loaderTime
		maxMs = 1000
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
