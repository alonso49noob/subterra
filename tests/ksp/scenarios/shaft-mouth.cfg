// Roadmap bug 1 (Lucas: a blast shaft is dug but the ground over it is not cut, so it cannot be entered). On Kerbin at
// the KSC: a short blast shaft (infinite propellant cheat: no explosive needed), then the buggy hangs 30 m over its
// mouth: a ray down must go into the shaft (no terrain left over it), and photos of the mouth from above.
SUBTERRA_TEST
{
	name = shaft-mouth
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = cheats
		propellant = true
		electricity = true
	}
	// Off the runway (its own collider covers anything dug under it): on the grass 1 km south of the KSC.
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.20
		lon = -74.65
		alt = 2
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = brakes
		on = true
	}
	// A save from before the hole (loaded at the end: the ground must be whole again).
	STEP
	{
		do = quicksave
		name = before
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraCoreDrill
		baseRate = 20
		blastRadius = 5
		fuseSeconds = 3
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StartDrilling
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StopDrilling
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = LoadCharges
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.20
		lon = -74.593
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = Detonate
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = teleportToNetwork
		site = dug
		end = top
		offsetUp = 30
		upright = true
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = assert
		what = raycastDown
		expectMin = 45
		missOk = true
	}
	STEP
	{
		do = assert
		what = mouthRays
		radius = 3
		within = 40
	}
	STEP
	{
		do = camera
		distance = 30
		pitch = 80
		heading = 0
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = shaft-mouth-above
		hideUi = true
	}
	STEP
	{
		do = camera
		distance = 30
		pitch = 25
		heading = 90
	}
	STEP
	{
		do = screenshot
		name = shaft-mouth-side
		hideUi = true
	}
	// Seen from far (the terrain is cut only near the camera; a cap covers the hole from afar).
	STEP
	{
		do = camera
		distance = 1200
		pitch = 60
		heading = 0
	}
	STEP
	{
		do = wait
		seconds = 3
	}
	STEP
	{
		do = screenshot
		name = shaft-mouth-far
		hideUi = true
	}
	// Saved and loaded: the hole is still open (Lucas: holes covered by the ground again).
	STEP
	{
		do = quicksave
		name = s1
	}
	STEP
	{
		do = quickload
		name = s1
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = teleportToNetwork
		site = dug
		end = top
		offsetUp = 30
		upright = true
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = assert
		what = mouthRays
		radius = 3
		within = 40
	}
	STEP
	{
		do = camera
		distance = 30
		pitch = 80
		heading = 0
	}
	STEP
	{
		do = screenshot
		name = shaft-mouth-reloaded
		hideUi = true
	}
	// Back to the save from before the hole: its opening must be gone (Lucas: holes of a game that was left stayed cut,
	// and new ones with the same id were never cut). The buggy stands where the hole was: ground right under it.
	STEP
	{
		do = quickload
		name = before
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = assert
		what = raycastDown
		fromUp = 5
		expectMax = 12
	}
	STEP
	{
		do = camera
		distance = 30
		pitch = 70
		heading = 0
	}
	STEP
	{
		do = screenshot
		name = shaft-mouth-before
		hideUi = true
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
