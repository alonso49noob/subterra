// Lucas: on Vall, a shaft blasted down through the ice into the ocean showed rock walls all through the water ("the
// ocean is full of rock"), and from inside the shaft in the ice the view went dark blue. Near Vall's north pole (the ground ~2 km high, the ocean under ~1 km below the datum): a 3.5 km blast shaft (infinite propellant), then the buggy in the shaft in the ice (normal view, not
// underwater), then down in the ocean under it (underwater view; no shaft walls around: photos).
SUBTERRA_TEST
{
	name = vall-shaft
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = cheats
		propellant = true
		electricity = true
	}
	STEP
	{
		do = teleport
		body = Vall
		lat = 88
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = brakes
		on = true
	}
	// Parked first: on a slope the buggy rolled and the drill (it needs to be landed) never started.
	STEP
	{
		do = waitUntil
		what = vesselLanded
		timeout = 60
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraCoreDrill
		baseRate = 500
		blastRadius = 8
		fuseSeconds = 3
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StartDrilling
	}
	STEP
	{
		do = waitUntil
		what = drillDepthAtLeast
		min = 3500
		timeout = 120
	}
	// Lucas: the ocean is a layer of the column; the drill reports it once in the water.
	STEP
	{
		do = assert
		what = drillLayer
		name = SubsurfaceOcean
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StopDrilling
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = LoadCharges
	}
	STEP
	{
		do = teleport
		body = Vall
		lat = 88
		lon = 30
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = Detonate
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	// In the shaft, 300 m down in the ice: an ordinary view, not the dark "inside the ice" one.
	STEP
	{
		do = teleportToNetwork
		site = dug
		end = top
		offsetUp = -300
		upright = true
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = assert
		what = cameraUnderwater
		expect = false
	}
	STEP
	{
		do = floodlight
		on = true
		range = 60
		intensity = 2
		up = 4
	}
	STEP
	{
		do = camera
		distance = 8
		pitch = 20
		heading = 0
	}
	STEP
	{
		do = screenshot
		name = vall-shaft-ice
		hideUi = true
	}
	// Down in the ocean under the ice, at the bottom of the shaft: water all round, no rock walls.
	STEP
	{
		do = teleportToNetwork
		site = dug
		end = bottom
		offsetUp = 30
		upright = true
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = assert
		what = cameraUnderwater
		expect = true
	}
	STEP
	{
		do = assert
		what = mouthRays
		radius = 6
		within = 60
	}
	STEP
	{
		do = camera
		distance = 12
		pitch = 10
		heading = 0
	}
	STEP
	{
		do = screenshot
		name = vall-shaft-ocean
		hideUi = true
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
