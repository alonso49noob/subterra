// Lucas: 500 km under Kerbin his thermometer read 205 K and the temperature never passed 1000 K, above all in time warp.
// The buggy set 500 km down with Set Position (with "ignore max temperature" on): the air and the background radiation are
// the rock's (thousands of kelvin), and the parts heat up to it, in time warp too.
SUBTERRA_TEST
{
	name = deep-heat
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = cheats
		propellant = true
		electricity = true
		heat = true
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.04
		lon = -74.6
		alt = -500000
		relative = sea
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = assert
		what = altitudeBelow
		max = -490000
	}
	STEP
	{
		do = assert
		what = gravityBetween
		min = 1.0
		max = 2.2
	}
	STEP
	{
		do = assert
		what = airBetween
		minKPa = 5000
	}
	STEP
	{
		do = wait
		seconds = 20
	}
	STEP
	{
		do = assert
		what = vesselTempBetween
		min = 600
	}
	STEP
	{
		do = warp
		rate = 1000
		seconds = 10
	}
	STEP
	{
		do = assert
		what = vesselTempBetween
		min = 2000
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
