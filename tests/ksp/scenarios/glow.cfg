// Sub-project 3: light in caves: glowing fungi (and the giant ones) in the Great Hall on Kerbin, daylight through thin
// mint ice in the Minmus ice caves at noon. No floodlight: only the glow lights and the rover.
SUBTERRA_TEST
{
	name = glow
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Rover Explorer
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = teleportToNetwork
		site = KerbinGreatHall
		node = 1
		inside = true
		upright = true
		offsetUp = 2.2
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 12
	}
	STEP
	{
		do = assert
		what = objectExists
		prefix = SubterraScatter GlowFungi
	}
	STEP
	{
		do = assert
		what = objectExists
		prefix = SubterraGlowLight
	}
	STEP
	{
		do = camera
		distance = 25
		pitch = 10
		heading = 0
	}
	STEP
	{
		do = screenshot
		name = glow-hall
		hideUi = true
	}
	STEP
	{
		do = camera
		distance = 25
		pitch = 10
		heading = 180
	}
	STEP
	{
		do = screenshot
		name = glow-hall2
		hideUi = true
	}
	STEP
	{
		do = teleport
		body = Minmus
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = setNoon
		body = Minmus
		lon = 94.37
	}
	STEP
	{
		do = teleportToNetwork
		site = MinmusIceCaves
		node = 1
		inside = true
		upright = true
		offsetUp = 2.2
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 12
	}
	STEP
	{
		do = assert
		what = objectExists
		prefix = SubterraScatter IceGlow
	}
	STEP
	{
		do = camera
		distance = 14
		pitch = 5
		heading = 0
	}
	STEP
	{
		do = screenshot
		name = glow-ice
		hideUi = true
	}
	STEP
	{
		do = camera
		distance = 14
		pitch = 8
		heading = 150
	}
	STEP
	{
		do = screenshot
		name = glow-ice2
		hideUi = true
	}
}
