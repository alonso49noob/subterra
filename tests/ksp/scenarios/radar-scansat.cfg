// Radar task 17: the SubterraCavity resource and its layer in SCANsat (full profile). The radar's detections are marked
// by hand (radarMark): a hint on the Mun at lat 5 lon 20 and a detection at lat -30 lon 100. The abundance of the
// resource, as the game's resource map answers it, must be the confidence there (a hint 0.4, a detection 1) and 0
// everywhere else (and on every body Subterra never scanned), and the stock KerbNet resource chart must not list the
// resource. Then SCANsat gets full resource coverage of the Mun and its big map is opened on the Subterra layer and
// photographed: the layer must show the hint (orange, yellow-ish) and the detection and nothing elsewhere. A hint added
// afterwards at lat -40 lon -100 shows that the cached raster is rebuilt when the detections change.
SUBTERRA_TEST
{
	name = radar-scansat
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Radar Probe
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 3
	}
	STEP
	{
		do = assert
		what = abundanceAtMost
		resource = SubterraCavity
		body = Mun
		lat = 5
		lon = 20
		value = 0
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = 5
		lon = 20
		halfWidth = 0
		hint = MN-scansat-hint#0
		level = Hint
		uncertainty = 25000
		depth = 200
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = -30
		lon = 100
		halfWidth = 0
		hint = MN-scansat-found#0
		level = Detected
		uncertainty = 8000
		depth = 700
	}
	STEP
	{
		do = assert
		what = abundanceAtLeast
		resource = SubterraCavity
		body = Mun
		lat = 5
		lon = 20
		value = 0.3
	}
	STEP
	{
		do = assert
		what = abundanceAtMost
		resource = SubterraCavity
		body = Mun
		lat = 5
		lon = 20
		value = 0.5
	}
	STEP
	{
		do = assert
		what = abundanceAtLeast
		resource = SubterraCavity
		body = Mun
		lat = -30
		lon = 100
		value = 0.99
	}
	STEP
	{
		do = assert
		what = abundanceAtMost
		resource = SubterraCavity
		body = Mun
		lat = -40
		lon = -100
		value = 0
	}
	STEP
	{
		do = assert
		what = abundanceAtMost
		resource = SubterraCavity
		body = Minmus
		lat = 5
		lon = 20
		value = 0
	}
	STEP
	{
		do = assert
		what = abundanceAtMost
		resource = SubterraCavity
		body = Kerbin
		lat = 5
		lon = 20
		value = 0
	}
	STEP
	{
		do = assert
		what = cavityLookups
		body = Mun
		count = 100000
		maxMs = 150
	}
	STEP
	{
		do = assert
		what = stockChartLacks
		body = Mun
		resource = SubterraCavity
	}
	STEP
	{
		do = assert
		what = scansatDisplayModule
		part = OrbitalScanner
		resource = SubterraCavity
	}
	STEP
	{
		do = assert
		what = scansatOverlay
		resource = SubterraCavity
		body = Mun
		lat = 5
		lon = 20
		min = 0.3
		max = 0.5
	}
	STEP
	{
		do = assert
		what = scansatOverlay
		resource = SubterraCavity
		body = Mun
		lat = -40
		lon = -100
		max = 0
	}
	STEP
	{
		do = scansatFill
		body = Mun
		type = 256
	}
	STEP
	{
		do = scansatBigMap
		body = Mun
		resource = SubterraCavity
		seconds = 8
	}
	STEP
	{
		do = assert
		what = scansatListed
		resource = SubterraCavity
	}
	STEP
	{
		do = screenshot
		name = scansat-bigmap
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = -40
		lon = -100
		halfWidth = 0
		hint = MN-scansat-late#0
		level = Hint
		uncertainty = 25000
		depth = 300
	}
	STEP
	{
		do = assert
		what = abundanceAtLeast
		resource = SubterraCavity
		body = Mun
		lat = -40
		lon = -100
		value = 0.3
	}
	STEP
	{
		do = assert
		what = cavityLookups
		body = Mun
		count = 100000
		maxMs = 150
	}
	STEP
	{
		do = scansatBigMap
		close = true
	}
	STEP
	{
		do = assert
		what = stockChartLacks
		body = Mun
		resource = SubterraCavity
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
