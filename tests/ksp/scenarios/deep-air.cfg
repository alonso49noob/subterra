// Lucas: 35 km under Kerbin a GRAVMAX read 11 m/s² (gravity should fall going down) and the barometer 0.17 kPa (the air
// pressure should grow). Also: the deep, hot rock ever more iridescent. On Kerbin: gravity and air at the surface, then the
// buggy set 30 km under the datum with the cheat menu's Set Position (a pocket is carved round it): gravity about 9.3 m/s²
// (the GRAVMAX says the same), the air over 5 atm and as hot as the rock, the walls iridescent.
SUBTERRA_TEST
{
	name = deep-air
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = cheats
		propellant = true
		electricity = true
	}
	STEP
	{
		do = addModule
		module = ModuleEnviroSensor
		sensorType = GRAV
	}
	STEP
	{
		do = moduleEvent
		module = ModuleEnviroSensor
		event = Toggle
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = assert
		what = gravityBetween
		min = 9.6
		max = 10.0
	}
	STEP
	{
		do = assert
		what = airBetween
		minKPa = 90
		maxKPa = 110
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.04
		lon = -74.6
		alt = -30000
		relative = sea
	}
	STEP
	{
		do = wait
		seconds = 12
	}
	STEP
	{
		do = assert
		what = altitudeBelow
		max = -29000
	}
	STEP
	{
		do = assert
		what = gravityBetween
		min = 9.0
		max = 9.6
	}
	STEP
	{
		do = assert
		what = airBetween
		minKPa = 500
		maxKPa = 6000
	}
	// Dry underground under Kerbin's sea level: the air alone on the parts, not KSP's sea over them (it was ~290 MPa).
	STEP
	{
		do = assert
		what = partPressureBetween
		min = 500
		max = 6000
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = floodlight
		on = true
		range = 40
		intensity = 0.8
		up = 3
	}
	STEP
	{
		do = camera
		distance = 7
		pitch = 10
		heading = 30
	}
	STEP
	{
		do = assert
		what = chunkMaterials
		within = 30
		contains = glow
	}
	STEP
	{
		do = screenshot
		name = deep-iridescent
		hideUi = true
	}
	STEP
	{
		do = wait
		seconds = 20
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	// Lucas: hydrostatic pressure on the barometers. In Kerbin's sea 60 m down: the water over the parts counts.
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.1
		lon = -73.9
		alt = -60
		relative = sea
	}
	STEP
	{
		do = wait
		seconds = 3
	}
	STEP
	{
		do = assert
		what = partPressureBetween
		min = 150
		max = 1500
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
