// Part 6, radar task 18: the SG-Z Zahori ground radar. A probe with the Zahori facing down is held 1.5 m over the
// terrain above the first stretch of the Serenity Skylight tube (130 m from its skylight, outside the cave, 140 m over the
// centre of its first segment): the part looks straight down, nothing is known of the cave before the scan, three seconds of scanning
// bring the network to Detected, lay a waypoint at the skylight and say so once on screen; with maxSpeed forced to 0
// the status reads "too fast"; the frame budget (avg 2 ms, worst 8 ms) holds from before the scan starts, so the frames of the first hit, its
// message and its waypoint are inside the check.
SUBTERRA_TEST
{
	name = gpr
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Zahori Probe
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = setNoon
		body = Mun
		lon = 2.3
	}
	STEP
	{
		do = teleportToNetwork
		site = SerenitySkylight
		target = 0
		inside = false
		offsetUp = 1.5
		rootUp = true
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = assert
		what = radarAxis
		dir = outward
		tolerance = 5
	}
	STEP
	{
		do = aimRadar
		down = true
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = assert
		what = radarAxis
		dir = down
		tolerance = 10
	}
	STEP
	{
		do = camera
		distance = 4
		pitch = -10
		heading = 40
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = gpr-part
		hideUi = true
	}
	STEP
	{
		do = assert
		what = detectionLevel
		id = site:SerenitySkylight
		level = None
	}
	STEP
	{
		do = assert
		what = radarStatus
		status = Idle
		count = 1
	}
	STEP
	{
		do = resetClock
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraRadar
		event = StartScan
		all = true
	}
	STEP
	{
		do = wait
		seconds = 3
	}
	STEP
	{
		do = screenshot
		name = gpr-detected
	}
	STEP
	{
		do = radarProbe
	}
	STEP
	{
		do = assert
		what = radarStatus
		status = Scanning
		count = 1
	}
	STEP
	{
		do = assert
		what = detectionLevel
		id = site:SerenitySkylight
		level = Detected
	}
	STEP
	{
		do = assert
		what = radarWaypoint
		id = site:SerenitySkylight
		min = 1
		max = 1
	}
	STEP
	{
		do = assert
		what = logContains
		text = "Zahori hollow"
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = assert
		what = radarWaypoint
		id = site:SerenitySkylight
		min = 1
		max = 1
	}
	STEP
	{
		do = assert
		what = subterraFrameBudget
		sinceReset = true
		avgMs = 2
		maxMs = 8
	}
	// Part 6, radar task 19: the 3D outline of what the scan detected shows through the terrain.
	STEP
	{
		do = assert
		what = wireframeLines
		min = 50
	}
	STEP
	{
		do = camera
		distance = 220
		pitch = 20
		awayFromSkylight = SerenitySkylight
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = gpr-wireframe
		hideUi = true
	}
	STEP
	{
		do = setField
		module = ModuleSubterraRadar
		field = maxSpeed
		value = 0
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = assert
		what = radarStatus
		status = TooFast
		count = 1
	}
	STEP
	{
		do = screenshot
		name = gpr-too-fast
	}
	STEP
	{
		do = setField
		module = ModuleSubterraRadar
		field = maxSpeed
		value = 3
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = assert
		what = radarStatus
		status = Scanning
		count = 1
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
