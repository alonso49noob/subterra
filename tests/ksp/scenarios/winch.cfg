// Lucas's testing tools for deep holes: with KSP's infinite propellant cheat a blast hole needs no explosive; the
// SB-W winch lowers the buggy down the shaft and stops it over the floor; the cheat menu's Set Position with a negative
// altitude puts the vessel under the ground in a pocket carved its size.
SUBTERRA_TEST
{
	name = winch
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = cheats
		propellant = true
		electricity = true
	}
	// Off the runway (its own collider covers anything dug under it): on the grass 1 km south of the KSC.
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.20
		lon = -74.65
		alt = 2
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraCoreDrill
		baseRate = 20
		blastRadius = 6
		fuseSeconds = 3
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraWinch
		maxSpeed = 30
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StartDrilling
	}
	STEP
	{
		do = wait
		seconds = 40
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StopDrilling
	}
	// No explosive on board: loaded anyway with the cheat.
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = LoadCharges
	}
	STEP
	{
		do = assert
		what = logContains
		text = armed:
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.20
		lon = -74.593
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = Detonate
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	// Over the mouth of the shaft, hooked, then lowered at 10 m/s (a 12 m shaft: the buggy with its panels out is nearly 6 m wide, and the walls are rough).
	STEP
	{
		do = teleportToNetwork
		site = dug
		end = top
		offsetUp = 4
		upright = true
		hold = true
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraWinch
		event = Hook
	}
	STEP
	{
		do = release
	}
	STEP
	{
		do = wait
		seconds = 3
	}
	STEP
	{
		do = setField
		module = ModuleSubterraWinch
		field = speed
		value = 10
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraWinch
		event = Lower
	}
	STEP
	{
		do = camera
		distance = 12
		pitch = 30
		heading = 0
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = screenshot
		name = winch-going-down
		hideUi = true
	}
	STEP
	{
		do = waitUntil
		what = logContains
		text = m over the floor
		timeout = 240
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = assert
		what = insideNetwork
		site = dug
	}
	STEP
	{
		do = floodlight
		on = true
		range = 40
		intensity = 2
		up = 3
	}
	STEP
	{
		do = screenshot
		name = winch-bottom
		hideUi = true
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraWinch
		event = Release
	}
	// The cheat menu's Set Position, 400 m under the ground west of the KSC (solid rock): a pocket is carved around it.
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.15
		lon = -75.2
		alt = -400
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = assert
		what = logContains
		text = carved: radius
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = assert
		what = insideNetwork
		site = dug
	}
	STEP
	{
		do = screenshot
		name = winch-pocket
		hideUi = true
	}
	STEP
	{
		do = cameraInfo
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
