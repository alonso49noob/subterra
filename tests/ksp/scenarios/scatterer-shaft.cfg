// Scatterer (graphics profile): its underwater view must stay out of a dry hole under the sea level. A core drill
// bores 120 m down at the KSC (land at about 70 m), a blast opens the shaft, and the buggy is set at its bottom (below
// the sea level): Scatterer's underwater view off, Subterra's off (no water there).
// Run: tools/run-scenarios.ps1 -Profile graphics -Scenarios scatterer-shaft
SUBTERRA_TEST
{
	name = scatterer-shaft
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = assert
		what = logContains
		text = Scatterer found: its underwater view
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraCoreDrill
		baseRate = 20
		blastRadius = 3
		fuseSeconds = 3
	}
	STEP
	{
		do = addResource
		name = Explosive
		max = 5000
		amount = 5000
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StartDrilling
	}
	STEP
	{
		do = wait
		seconds = 90
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StopDrilling
	}
	STEP
	{
		do = assert
		what = drillDepthAtLeast
		min = 110
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = LoadCharges
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.0972
		lon = -74.45
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = Detonate
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = teleportToNetwork
		site = dug
		offsetUp = 2
		hold = true
	}
	STEP
	{
		do = camera
		distance = 4
		pitch = 20
		heading = 0
	}
	STEP
	{
		do = wait
		seconds = 3
	}
	STEP
	{
		do = cameraInfo
	}
	STEP
	{
		do = assert
		what = cameraUnderwater
		expect = false
	}
	STEP
	{
		do = assert
		what = scattererUnderwater
		expect = false
	}
	STEP
	{
		do = floodlight
		on = true
		range = 40
		intensity = 2
		up = 3
	}
	STEP
	{
		do = screenshot
		name = scatterer-shaft-bottom
		hideUi = true
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
