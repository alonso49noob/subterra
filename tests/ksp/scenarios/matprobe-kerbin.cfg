// Writes Kerbin's terrain material (textures, colours) to materials.txt.
SUBTERRA_TEST
{
	name = matprobe-kerbin
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = spike
		name = MaterialProbe
		body = Kerbin
	}
	STEP
	{
		do = quit
	}
}
