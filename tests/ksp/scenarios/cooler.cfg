// The SB-K evaporative cooler: a buggy heated to 600 K cools back under its set temperature (310 K) by boiling off water.
// (The module goes on the buggy's root with a big power, so the test does not take a quarter of an hour; its water is in the
// root too and takes the root's temperature, so little of it.)
SUBTERRA_TEST
{
	name = cooler
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = cheats
		electricity = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraHeatSink
		maxPower = 200000
		targetTemp = 310
	}
	STEP
	{
		do = heatVessel
		k = 600
	}
	STEP
	{
		do = addResource
		name = Water
		max = 1500
		amount = 1500
	}
	STEP
	{
		do = assert
		what = partTempNear
		k = 600
		tol = 60
	}
	STEP
	{
		do = wait
		seconds = 30
	}
	STEP
	{
		do = assert
		what = partTempNear
		k = 305
		tol = 25
	}
	STEP
	{
		do = assert
		what = logContains
		text = Cooler on
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
