// Counts the procedural networks of Duna and Ike at the shipped density (see networks.txt; run with -Cfg none).
SUBTERRA_TEST
{
	name = netcount-duna
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = spike
		name = NetworkCounter
		body = Duna
		scale = 1
	}
	STEP
	{
		do = spike
		name = NetworkCounter
		body = Ike
		scale = 1
	}
	STEP
	{
		do = quit
	}
}
