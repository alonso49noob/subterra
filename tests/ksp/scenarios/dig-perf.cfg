// Sub-project 2: Subterra's main-thread cost per frame while the tunnel borer digs from the surface (the mouth's rim
// is rebuilt as the tunnel grows under it) and through the ground.
SUBTERRA_TEST
{
	name = dig-perf
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Rover
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = cheats
		electricity = true
	}
	STEP
	{
		do = setField
		module = ModuleSubterraTunnelBorer
		field = baseRate
		value = 4
	}
	STEP
	{
		do = resetClock
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraTunnelBorer
		event = StartDigging
	}
	STEP
	{
		do = trace
		seconds = 10
	}
	STEP
	{
		do = assert
		what = tunnelLengthAtLeast
		min = 3
	}
	STEP
	{
		do = assert
		what = subterraFrameBudget
		avgMs = 2
		maxMs = 8
		seconds = 10
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
