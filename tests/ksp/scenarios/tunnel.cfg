// Sub-project 2: a tunnel borer on a rover digs into the Mun from the surface (a new network XP-Mun-1 with a
// mouth in the terrain); the tunnel survives F5/F9 (the borer module, added in flight for the test, does not: KSP only restores a part's cfg modules).
SUBTERRA_TEST
{
	name = tunnel
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraTunnelBorer
		baseRate = 5
		pitch = -15
		headOffset = 2
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraTunnelBorer
		event = StartDigging
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = assert
		what = tunnelLengthAtLeast
		min = 3
	}
	STEP
	{
		do = assert
		what = networkHasZone
		id = XP-Mun-1
		zone = Excavation
	}
	STEP
	{
		do = assert
		what = logContains
		text = "Tunnel XP-Mun-1 started"
	}
	STEP
	{
		do = camera
		distance = 20
	}
	STEP
	{
		do = screenshot
		name = tunnel-mouth
	}
	STEP
	{
		do = quicksave
		name = t1
	}
	STEP
	{
		do = quickload
		name = t1
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = assert
		what = networkHasZone
		id = XP-Mun-1
		zone = Excavation
	}
	STEP
	{
		do = assert
		what = logContains
		text = "Loaded 1 dug tunnels"
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
