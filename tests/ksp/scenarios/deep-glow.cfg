// Lucas: the deep underground should look like the Earth's insides (a diagram: brown crust, red mantle, an orange liquid
// outer core, a white-hot inner core), and the layers subdivided. Kerbin, with the "ignore max temperature" cheat: Set
// Position 100 km down (the partly molten asthenosphere) and 350 km down (the liquid outer core): the layer there, its
// glow, photos.
SUBTERRA_TEST
{
	name = deep-glow
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = cheats
		propellant = true
		electricity = true
		heat = true
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.04
		lon = -74.6
		alt = -100000
		relative = sea
	}
	STEP
	{
		do = wait
		seconds = 12
	}
	STEP
	{
		do = assert
		what = chunkMaterials
		within = 40
		contains = Asthenosphere
	}
	STEP
	{
		do = assert
		what = chunkMaterials
		within = 40
		contains = glow
	}
	STEP
	{
		do = floodlight
		on = true
		range = 40
		intensity = 0.6
		up = 3
	}
	STEP
	{
		do = camera
		distance = 7
		pitch = 10
		heading = 30
	}
	STEP
	{
		do = screenshot
		name = glow-asthenosphere
		hideUi = true
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.04
		lon = -74.6
		alt = -350000
		relative = sea
	}
	STEP
	{
		do = wait
		seconds = 12
	}
	STEP
	{
		do = assert
		what = chunkMaterials
		within = 40
		contains = OuterCore
	}
	STEP
	{
		do = floodlight
		on = true
		range = 40
		intensity = 0.6
		up = 3
	}
	STEP
	{
		do = camera
		distance = 7
		pitch = 10
		heading = 30
	}
	STEP
	{
		do = screenshot
		name = glow-outer-core
		hideUi = true
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
