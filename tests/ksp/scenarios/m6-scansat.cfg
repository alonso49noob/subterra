// M0 spike (radar Task 2): SCANsat with a resource that has an empty GLOBAL_RESOURCE and a patched abundance.
// Needs the full profile and the temporary cfg: tools/test-ksp.ps1 -Scenario m6-scansat -Profile full -Cfg m6-cavity
// Three polar passes over the Mun (different LAN): no scanner (control), a high-res resource scanner (256), a low-res one (128).
SUBTERRA_TEST
{
	name = m6-scansat
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Crater Crawler
		site = Runway
		crew = true
	}
	STEP
	{
		do = setOrbit
		body = Mun
		alt = 30000
		inc = 85
		lan = 0
	}
	STEP
	{
		do = spike
		name = ScansatScan
		mode = none
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 30
	}
	STEP
	{
		do = spike
		name = ScansatCoverage
		label = pass1-none
	}
	STEP
	{
		do = setOrbit
		body = Mun
		alt = 30000
		inc = 85
		lan = 60
	}
	STEP
	{
		do = spike
		name = ScansatScan
		mode = SpikeHi
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 30
	}
	STEP
	{
		do = spike
		name = ScansatCoverage
		label = pass2-hi
	}
	STEP
	{
		do = setOrbit
		body = Mun
		alt = 30000
		inc = 85
		lan = 120
	}
	STEP
	{
		do = spike
		name = ScansatScan
		mode = SpikeLo
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 30
	}
	STEP
	{
		do = spike
		name = ScansatCoverage
		label = pass3-lo
	}
	STEP
	{
		do = spike
		name = ScansatSpike
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
