// Sub-project 2: a tunnel dug from DevTube's floor joins DevTube (one network, no wall between them).
SUBTERRA_TEST
{
	name = tunnel-join
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = teleportToNetwork
		site = DevTube
		node = 1
		inside = true
		offsetUp = 2
	}
	STEP
	{
		do = waitUntil
		what = vesselLanded
		timeout = 60
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraTunnelBorer
		baseRate = 5
		pitch = 0
		radius = 2
		headOffset = 2
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraTunnelBorer
		event = StartDigging
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = assert
		what = tunnelJoined
		to = site:DevTube
	}
	STEP
	{
		do = assert
		what = networkHasZone
		id = site:DevTube
		zone = Excavation
	}
	STEP
	{
		do = assert
		what = logContains
		text = "reached site:DevTube"
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
