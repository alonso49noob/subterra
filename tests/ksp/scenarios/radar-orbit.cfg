// Radar task 14: an Eco in a low Mun orbit (12 km: F is about 600 m, so the 4F swath shows tubes of 200 m and up)
// marks coverage under its real ground track. First a pass flown with the radar off is walked back from three
// recorded points (the body turns about 6 degrees in that time, so a missing or wrong rotation correction misses
// them); then an orbit flown at x100 with the radar on; then three orbits at x10000 within the frame budget; then
// a change of orbit with a backlog waiting (not walked with the new orbit) and an elliptical orbit whose
// periapsis passes are covered although the ticks land outside the altitude window.
// Infinite electricity: the probe's battery lasts about 100 s of scanning, and EC is task 13's test.
SUBTERRA_TEST
{
	name = radar-orbit
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Radar Probe
		site = Runway
	}
	STEP
	{
		do = cheats
		electricity = true
	}
	STEP
	{
		do = setOrbit
		body = Mun
		alt = 12000
		inc = 60
	}
	STEP
	{
		do = subPoint
		name = a
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 8
	}
	STEP
	{
		do = subPoint
		name = b
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 8
	}
	STEP
	{
		do = subPoint
		name = c
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 8
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraRadar
		event = StartScan
		part = SubterraEco
	}
	STEP
	{
		do = radarSetLastScan
		part = SubterraEco
		point = a
	}
	STEP
	{
		do = wait
		seconds = 4
	}
	STEP
	{
		do = subPoint
		name = now
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = a
		maxAltitude = 13000
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = b
		maxAltitude = 13000
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = c
		maxAltitude = 13000
	}
	STEP
	{
		do = assert
		what = radarLastScan
		maxLag = 60
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 8
	}
	STEP
	{
		do = subPoint
		name = d
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 8
	}
	STEP
	{
		do = subPoint
		name = e
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 8
	}
	STEP
	{
		do = subPoint
		name = f
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = vessel
		maxAltitude = 13000
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = d
		maxAltitude = 13000
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = e
		maxAltitude = 13000
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = f
		maxAltitude = 13000
	}
	STEP
	{
		do = resetClock
	}
	STEP
	{
		do = warp
		rate = 10000
		seconds = 0.75
	}
	STEP
	{
		do = wait
		seconds = 6
	}
	STEP
	{
		do = assert
		what = subterraFrameBudget
		avgMs = 2
		maxMs = 8
		seconds = 8
	}
	STEP
	{
		do = assert
		what = radarLastScan
		maxLag = 60
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = vessel
		maxAltitude = 13000
	}
	STEP
	{
		do = subPoint
		name = g
	}
	STEP
	{
		do = radarSetLastScan
		part = SubterraEco
		point = a
	}
	STEP
	{
		do = setOrbit
		body = Mun
		alt = 12000
		inc = 90
		lan = 40
	}
	STEP
	{
		do = subPointAt
		name = ghost
		back = 600
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = assert
		what = logContains
		text = unwalked track dropped
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = ghost
		covered = false
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = vessel
		maxAltitude = 13000
	}
	STEP
	{
		do = setOrbit
		body = Mun
		pe = 12000
		ap = 400000
		inc = 30
	}
	STEP
	{
		do = subPoint
		name = pe0
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 30
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraRadar
		event = StartScan
		part = SubterraPlomada
	}
	STEP
	{
		do = radarSetLastScan
		part = SubterraPlomada
		point = pe0
	}
	STEP
	{
		do = wait
		seconds = 3
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = pe0
		instrument = Gravimeter
		maxAltitude = 14000
	}
	STEP
	{
		do = warp
		rate = 1000
		seconds = 20
	}
	STEP
	{
		do = wait
		seconds = 4
	}
	STEP
	{
		do = subPointAt
		name = pe1
		periapsisAgo = 1
	}
	STEP
	{
		do = subPointAt
		name = pe2
		periapsisAgo = 2
	}
	STEP
	{
		do = subPointAt
		name = pe3
		periapsisAgo = 3
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = pe1
		instrument = Gravimeter
		maxAltitude = 14000
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = pe2
		instrument = Gravimeter
		maxAltitude = 14000
	}
	STEP
	{
		do = assert
		what = coverageAt
		at = pe3
		instrument = Gravimeter
		maxAltitude = 14000
	}
	STEP
	{
		do = assert
		what = radarLastScan
		maxLag = 60
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
