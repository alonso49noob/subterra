// Radar task 12: orbital coverage and a Hint detection survive quicksave/quickload (RadarScenario).
SUBTERRA_TEST
{
	name = radar-save
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = radarMark
		body = Mun
		lat = 0
		lon = 0
		altitude = 30000
		halfWidth = 2000
		instrument = OrbitalRadar
		hint = MN-test#0
	}
	STEP
	{
		do = assert
		what = coverageAt
		body = Mun
		lat = 0
		lon = 0
		maxAltitude = 31000
	}
	STEP
	{
		do = quicksave
		name = r1
	}
	STEP
	{
		do = quickload
		name = r1
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = assert
		what = coverageAt
		body = Mun
		lat = 0
		lon = 0
		maxAltitude = 31000
	}
	STEP
	{
		do = assert
		what = detectionLevel
		id = MN-test
		level = Hint
	}
	STEP
	{
		do = assert
		what = detectionLevel
		id = nearest
		level = Hint
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
