// Lucas: craft set deep with Set Position ignored the pocket carved round them and kept going down. The pocket was sized
// from vessel.vesselSize and centred on the root part: a tall rocket whose root (its pod) is at the top had most of itself
// under the pocket's floor. The Kerbal X set 3 km under Kerbin, then 30 s later still in its pocket, and 2 km deeper too.
SUBTERRA_TEST
{
	name = deep-tall
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Tall Rocket
		site = LaunchPad
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.04
		lon = -74.6
		alt = -3000
		relative = sea
	}
	STEP
	{
		do = wait
		seconds = 30
	}
	STEP
	{
		do = assert
		what = altitudeBelow
		max = -2900
		min = -3060
	}
	STEP
	{
		do = floodlight
		on = true
		range = 60
		intensity = 0.8
		up = 4
	}
	STEP
	{
		do = camera
		distance = 30
		pitch = 5
		heading = 30
	}
	STEP
	{
		do = screenshot
		name = deep-tall
		hideUi = true
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.04
		lon = -74.6
		alt = -5000
		relative = sea
	}
	STEP
	{
		do = wait
		seconds = 30
	}
	STEP
	{
		do = assert
		what = altitudeBelow
		max = -4900
		min = -5060
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
