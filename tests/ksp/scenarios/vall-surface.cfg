// Diagnosis: in vall-shaft the buggy set 3 m over Vall's north pole went suborbital and hit at 32 m/s 14 s later (Vall's
// gravity is 0.23 m/s²). Set it there and watch: gravity, altitude, landing.
SUBTERRA_TEST
{
	name = vall-surface
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = teleport
		body = Vall
		lat = 88
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = assert
		what = gravityBetween
		min = 0.1
		max = 0.5
	}
	STEP
	{
		do = assert
		what = altitudeBelow
		max = 99999
	}
	STEP
	{
		do = wait
		seconds = 4
	}
	STEP
	{
		do = assert
		what = altitudeBelow
		max = 99999
	}
	STEP
	{
		do = assert
		what = gravityBetween
		min = 0.1
		max = 0.5
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = assert
		what = altitudeBelow
		max = 99999
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = assert
		what = vesselLanded
	}
}
