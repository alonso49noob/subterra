// Tylo's ocean under rock (sub-project 4): a rover set 20 m under the rock ceiling near the north pole stays in the
// water and rises against the rock ceiling (made of rock, not ice).
SUBTERRA_TEST
{
	name = tylo-ocean
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Rover Explorer
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = teleportToNetwork
		site = ocean
		body = Tylo
		lat = 85
		lon = 0
		depth = 20
		hold = false
	}
	STEP
	{
		do = wait
		seconds = 30
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = assert
		what = waterDepth
		min = 0
		max = 40
	}
	STEP
	{
		do = assert
		what = objectExists
		prefix = SubterraIceCeiling
	}
	STEP
	{
		do = floodlight
		on = true
		range = 80
		intensity = 2
		up = 6
	}
	STEP
	{
		do = camera
		distance = 20
		pitch = 5
		heading = 60
	}
	STEP
	{
		do = screenshot
		name = tylo-ocean
		hideUi = true
	}
	STEP
	{
		do = assert
		what = cameraUnderwater
	}
	STEP
	{
		do = cameraInfo
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
