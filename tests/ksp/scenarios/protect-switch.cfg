// Task 24 (Review Focus 3): switching from 3 km away to a rover parked in DevTube keeps it on rails
// until the cave colliders exist, then it settles alive.
SUBTERRA_TEST
{
	name = protect-switch
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Crater Crawler
		site = Runway
		crew = true
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = teleportToNetwork
		site = DevTube
		node = 1
		inside = true
		offsetUp = 6
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = assert
		what = vesselLanded
	}
	STEP
	{
		do = scene
		name = KSC
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 1.3
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = switchTo
		vessel = Crater Crawler
	}
	STEP
	{
		do = assert
		what = packedOrColliderBelow
	}
	STEP
	{
		do = waitUntil
		what = vesselLanded
		timeout = 60
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = assert
		what = vesselAlive
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
