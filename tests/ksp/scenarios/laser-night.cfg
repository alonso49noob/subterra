// Lucas: the xenon laser leaves a lighter rectangle of ground around its hole near the runway at night ("shading errors").
// A laser on the buggy digs into Kerbin beside the runway; screenshots of the mouth by day and at midnight, from above.
SUBTERRA_TEST
{
	name = laser-night
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraLaser
		baseRate = 5
		elevation = -15
		headOffset = 2
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraLaser
		event = StartFiring
	}
	STEP
	{
		do = wait
		seconds = 20
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraLaser
		event = StopFiring
	}
	STEP
	{
		do = setNoon
		body = Kerbin
		lon = -74.7
	}
	STEP
	{
		do = camera
		distance = 60
		pitch = 60
		heading = 0
	}
	STEP
	{
		do = screenshot
		name = laser-day
		hideUi = true
	}
	// Noon on the far side: midnight at the runway.
	STEP
	{
		do = setNoon
		body = Kerbin
		lon = 105.3
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = screenshot
		name = laser-night
		hideUi = true
	}
	STEP
	{
		do = camera
		distance = 150
		pitch = 70
		heading = 0
	}
	STEP
	{
		do = screenshot
		name = laser-night-far
		hideUi = true
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
