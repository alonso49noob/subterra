// Task 28: in the tube parts settle near the rock temperature (250.3 K at 70 m); in the sun on the surface they heat up.
// Parts hold a lot of heat (hours of game time to settle), so the waits are on-rails warp x100 (~100 min of game time).
SUBTERRA_TEST
{
	name = thermal
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	// Control: stock heat exchange on the runway, before any teleport.
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = assert
		what = partTempSnapshot
		name = runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = 0
		lon = 0
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = assert
		what = partTempSnapshot
		name = munSurface
	}
	STEP
	{
		do = setNoon
		body = Mun
		lon = 0
	}
	STEP
	{
		do = teleportToNetwork
		site = DevTube
		node = 2
		inside = true
		offsetUp = 2
	}
	STEP
	{
		do = wait
		seconds = 20
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 150
	}
	STEP
	{
		do = assert
		what = partTempNear
		k = 250.3
		tol = 10
	}
	STEP
	{
		do = assert
		what = partTempSnapshot
		name = cave
	}
	STEP
	{
		do = teleportToNetwork
		site = DevTube
		node = 2
		inside = false
		offsetUp = 2
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = warp
		rate = 100
		seconds = 60
	}
	STEP
	{
		do = assert
		what = partTempAway
		k = 250.3
		min = 20
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
