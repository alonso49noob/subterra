// Lucas: the map view from a craft in Vall's ocean under the ice was a mess (no Vall, coloured dotted trails all round).
// Set Position where he was (7.5638, 142.677, -29500 under the sea level), then the map as the player opens it: Vall seen
// from outside with the craft on it, not the inside of the planet.
SUBTERRA_TEST
{
	name = map-underground
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Subterra Rover Explorer
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = teleport
		body = Vall
		lat = 7.5638
		lon = 142.677
		alt = -29500
		relative = sea
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	// Lucas: pulled back from inside the ocean, the flight camera showed no Vall at all.
	STEP
	{
		do = camera
		distance = 80000
		pitch = 60
		heading = 0
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = screenshot
		name = flight-pulled-back
		hideUi = false
	}
	STEP
	{
		do = cameraInfo
	}
	STEP
	{
		do = mapView
		keepFocus = true
	}
	STEP
	{
		do = screenshot
		name = map-underground
		hideUi = false
	}
	STEP
	{
		do = wait
		seconds = 5
	}
	STEP
	{
		do = screenshot
		name = map-underground-later
		hideUi = false
	}
	STEP
	{
		do = mapView
		on = false
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
