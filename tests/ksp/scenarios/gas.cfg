// Sub-project 2: with DevGas (mare basalt always holds Ore gas), a core drill entering the basalt strikes a pocket and
// a well pump draws it; the hole profile window opens; the hole is loaded and its danger rings drawn, kept through a
// quicksave/quickload.
SUBTERRA_TEST
{
	name = gas
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = -7.5
		lon = 4.5
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraCoreDrill
		baseRate = 20
		blastRadius = 2
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraWellPump
	}
	STEP
	{
		do = addResource
		name = Ore
		max = 500
		amount = 0
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StartDrilling
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = assert
		what = logContains
		text = "struck Ore in MareBasalt"
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StopDrilling
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraWellPump
		event = StartPumping
	}
	STEP
	{
		do = wait
		seconds = 15
	}
	STEP
	{
		do = assert
		what = resourceAtLeast
		name = Ore
		min = 1
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = ShowProfile
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = assert
		what = componentExists
		type = ProfileWindow
	}
	STEP
	{
		do = screenshot
		name = profile
	}
	STEP
	{
		do = addResource
		name = Explosive
		max = 5000
		amount = 5000
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = LoadCharges
	}
	STEP
	{
		do = wait
		seconds = 1
	}
	STEP
	{
		do = assert
		what = objectExists
		prefix = SubterraBlastRings
	}
	STEP
	{
		do = camera
		distance = 70
		pitch = 60
		heading = 0
	}
	STEP
	{
		do = wait
		seconds = 2
	}
	STEP
	{
		do = screenshot
		name = rings
		hideUi = true
	}
	STEP
	{
		do = quicksave
	}
	STEP
	{
		do = quickload
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = assert
		what = objectExists
		prefix = SubterraBlastRings
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
