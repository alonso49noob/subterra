// Kerbin, at the KSC (dry land): a core drill bores 120 m down (past sea level), loads and fires a blast hole from
// 600 m away. The shaft starts on land, so no sea water should fill it: screenshots from above and at the mouth.
SUBTERRA_TEST
{
	name = kerbin-shaft
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = wait
		seconds = 8
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraCoreDrill
		baseRate = 20
		blastRadius = 3
		fuseSeconds = 3
	}
	STEP
	{
		do = addResource
		name = Explosive
		max = 5000
		amount = 5000
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StartDrilling
	}
	STEP
	{
		do = wait
		seconds = 90
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StopDrilling
	}
	STEP
	{
		do = assert
		what = drillDepthAtLeast
		min = 110
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = LoadCharges
	}
	STEP
	{
		do = teleport
		body = Kerbin
		lat = -0.0972
		lon = -74.45
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = Detonate
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = camera
		distance = 150
		pitch = 55
		heading = 0
	}
	STEP
	{
		do = screenshot
		name = kerbin-shaft-above
		hideUi = true
	}
	STEP
	{
		do = camera
		distance = 40
		pitch = 15
		heading = 180
	}
	STEP
	{
		do = screenshot
		name = kerbin-shaft-mouth
		hideUi = true
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
}
