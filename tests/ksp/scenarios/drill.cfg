// Sub-project 2: the parts load; a core drill bores through the Mun's regolith into the mare basalt and takes a
// core sample of that layer; a second hole over DevTube breaks into the tube and discovers it.
SUBTERRA_TEST
{
	name = drill
	STEP
	{
		do = assert
		what = partExists
		name = SubterraCoreDrill
	}
	STEP
	{
		do = assert
		what = partExists
		name = SubterraTunnelBorer
	}
	STEP
	{
		do = assert
		what = partExists
		name = SubterraWellPump
	}
	STEP
	{
		do = assert
		what = partExists
		name = SubterraExplosiveMagazine
	}
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
	STEP
	{
		do = launch
		craft = SPH/Bug-E Buggy
		site = Runway
	}
	STEP
	{
		do = teleport
		body = Mun
		lat = -7.5
		lon = 4.5
		alt = 3
		relative = terrain
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = addModule
		module = ModuleSubterraCoreDrill
		baseRate = 20
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StartDrilling
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = assert
		what = drillDepthAtLeast
		min = 20
	}
	STEP
	{
		do = assert
		what = drillLayer
		name = MareBasalt
	}
	STEP
	{
		do = assert
		what = coreSample
		subject = subterraCoreSample@MunSrfLandedMareBasalt
	}
	STEP
	{
		do = teleportToNetwork
		site = DevTube
		node = 1
		inside = false
		offsetUp = 3
	}
	STEP
	{
		do = wait
		seconds = 10
	}
	STEP
	{
		do = brakes
		on = true
	}
	STEP
	{
		do = moduleEvent
		module = ModuleSubterraCoreDrill
		event = StartDrilling
	}
	STEP
	{
		do = wait
		seconds = 40
	}
	STEP
	{
		do = assert
		what = logContains
		text = "reached site:DevTube"
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
}
