// Lucas could not start another hole from the bottom of a dug one (his rover lay tipped on the rubble down there and the
// drill went sideways). On the Mun: a 600 m blast shaft, the buggy let down to its bottom and left to settle on its own;
// the drill bores on from there to 900 m, the hole is loaded and fired from the surface: a second shaft below the first.
SUBTERRA_TEST
{
	name = drill-bottom
	STEP
	{
		do = newGame
		mode = SANDBOX
	}
