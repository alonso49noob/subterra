	}
	STEP
	{
		do = assert
		what = discovered
		id = nearest
	}
	STEP
	{
		do = assert
		what = waypointCount
		n = skylights
		id = nearest
	}
	STEP
	{
		do = assert
		what = scansatAnomaly
		name = DevTube
	}
	STEP
	{
		do = assert
		what = noSubterraExceptions
	}
	STEP
	{
		do = quit
	}
