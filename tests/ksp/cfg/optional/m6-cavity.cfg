// Radar M0 spike (Task 2), temporary: the SubterraCavity resource with an empty GLOBAL_RESOURCE, and three SCANsat
// scanners on the Crater Crawler's cabin to compare which bits make the layer appear. Task 17 deletes this file.
// Load it with: tools/test-ksp.ps1 -Profile full -Cfg m6-cavity
RESOURCE_DEFINITION
{
	name = SubterraCavity
	density = 0
	unitCost = 0
	flowMode = NO_FLOW
	transfer = NONE
	isTweakable = false
	volume = 0
}

GLOBAL_RESOURCE
{
	ResourceName = SubterraCavity
	ResourceType = 0
	Distribution
	{
		PresenceChance = 0
		MinAbundance = 0
		MaxAbundance = 0
		Variance = 0
		Dispersal = 0
	}
}

// The same with a nonzero distribution: SCANsat hides resources it thinks are absent (HideZeroResources), so this
// one shows whether a nonzero GLOBAL_RESOURCE avoids that.
RESOURCE_DEFINITION
{
	name = SubterraCavityB
	density = 0
	unitCost = 0
	flowMode = NO_FLOW
	transfer = NONE
	isTweakable = false
	volume = 0
}

GLOBAL_RESOURCE
{
	ResourceName = SubterraCavityB
	ResourceType = 0
	Distribution
	{
		PresenceChance = 100
		MinAbundance = 0.01
		MaxAbundance = 1
		Variance = 0
		Dispersal = 1
	}
}

// Wide fields of view (and no power cost) so one orbit paints a swath that can be seen in a screenshot.
@PART[landerCabinSmall]:NEEDS[SCANsat]:AFTER[SCANsat]
{
	MODULE
	{
		name = SCANsat
		sensorType = 128
		fov = 10
		min_alt = 5000
		max_alt = 500000
		best_alt = 30000
		requireLight = False
		scanName = SpikeLo
	}
	MODULE
	{
		name = SCANsat
		sensorType = 256
		fov = 10
		min_alt = 5000
		max_alt = 500000
		best_alt = 30000
		requireLight = False
		scanName = SpikeHi
	}
	MODULE
	{
		name = SCANresourceDisplay
		ResourceName = SubterraCavity
	}
}
